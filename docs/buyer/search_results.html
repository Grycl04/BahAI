<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Search Results - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- Messaging Modal CSS -->
<style>
    /* ===== MESSAGING MODAL STYLES ===== */
    .message-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(5px);
    }

    .message-modal.show {
        display: flex;
    }

    .message-modal-content {
        background: var(--bg-white);
        border-radius: 16px;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
    }

    .message-header {
        padding: 25px 30px;
        border-bottom: 1px solid var(--border);
        position: relative;
        background: var(--primary);
        color: white;
        border-radius: 16px 16px 0 0;
    }

    .message-header h2 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .message-subtitle {
        font-size: 14px;
        opacity: 0.9;
    }

    .message-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: white;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .message-close:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(90deg);
    }

    .message-broker-card {
        background: var(--bg-light);
        padding: 15px;
        border-radius: 12px;
        margin: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--border);
    }

    .message-broker-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 14px;
        flex-shrink: 0;
    }

    .message-broker-info {
        flex: 1;
        min-width: 0;
    }

    .message-broker-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 2px;
    }

    .message-broker-role {
        font-size: 12px;
        color: var(--text-light);
    }

    .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: var(--bg-light);
        min-height: 300px;
        max-height: 400px;
    }

    .message-bubble {
        margin-bottom: 15px;
        max-width: 80%;
    }

    .message-bubble.sent {
        margin-left: auto;
        text-align: right;
    }

    .message-bubble-content {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 18px;
        background: var(--bg-white);
        border: 1px solid var(--border);
        text-align: left;
        word-wrap: break-word;
    }

    .message-bubble.sent .message-bubble-content {
        background: var(--primary);
        color: white;
        border: none;
    }

    .message-time {
        font-size: 11px;
        color: var(--text-light);
        margin-top: 4px;
        display: block;
    }

    .message-bubble.sent .message-time {
        color: rgba(255, 255, 255, 0.7);
    }

    .no-messages {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-light);
    }

    .message-input-area {
        padding: 20px;
        border-top: 1px solid var(--border);
        background: var(--bg-white);
        border-radius: 0 0 16px 16px;
    }

    .message-textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--border);
        border-radius: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        resize: none;
        min-height: 60px;
        margin-bottom: 10px;
        transition: border-color 0.3s ease;
    }

    .message-textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(11, 46, 82, 0.1);
    }

    .message-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .contact-info {
        font-size: 12px;
        color: var(--text-light);
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .send-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
    }

    .send-btn:disabled {
        background: var(--border);
        cursor: not-allowed;
        transform: none;
    }

    .loading-messages {
        text-align: center;
        padding: 40px 20px;
    }

    .quick-contact-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .quick-contact-btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-decoration: none;
        white-space: nowrap;
    }

    .email-btn {
        background: #e8f5e9;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
    }

    .email-btn:hover {
        background: #d4edd5;
        transform: translateY(-1px);
    }

    .call-btn {
        background: #e3f2fd;
        color: #1565c0;
        border: 1px solid #bbdefb;
    }

    .call-btn:hover {
        background: #c5e0fb;
        transform: translateY(-1px);
    }

    /* Match buyer dashboard listing card styles */
    .listing-card-wrapper { transition: all 0.3s ease; }
    .listing-card-wrapper:hover { transform: translateY(-5px); }
    .listings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        margin-top: 25px;
    }
    .listing-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        border: 1px solid rgba(0, 0, 0, 0.05);
        height: 100%;
    }
    .listing-card:hover { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12); }
    .listing-card-image-container { position: relative; height: 180px; overflow: hidden; }
    .listing-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .listing-card:hover .listing-image { transform: scale(1.05); }
    .listing-type-badge.type-rent,
    .listing-type-badge.rent { background: #10b981; }
    .listing-type-badge.type-lease,
    .listing-type-badge.lease { background: #10b981; }
    .listing-type-badge.type-sale,
    .listing-type-badge.sale { background: #3b82f6; }
    .listing-content { padding: 18px; }
    .listing-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
    .listing-header > div:first-child { flex: 1; min-width: 0; overflow: hidden; }
    .listing-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 0;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }
    .listing-location { display: flex; align-items: center; gap: 6px; color: var(--text-light); font-size: 0.9rem; margin-bottom: 10px; }
    .listing-price {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary-dark) !important;
        white-space: normal !important;
        text-align: right;
        max-width: 45%;
    }
    .listing-price.price-rent,
    .listing-price.price-lease,
    .listing-price.price-sale {
        color: var(--primary-dark) !important;
    }
    .listing-details {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e7eb;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
    }
    .detail {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-light);
        font-size: 0.9rem;
        flex: 1 1 0;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .detail i { flex-shrink: 0; }
    .listing-broker { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .broker-avatar {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.9rem;
        overflow: hidden;
    }
    .broker-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .listing-save-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: auto;
        height: auto;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        z-index: 3;
        opacity: 1;
        transition: transform 0.2s ease;
        box-shadow: none;
    }
    .listing-save-btn .save-icon {
        color: #ffffff;
        line-height: 1;
        transition: color 0.2s ease, filter 0.2s ease;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }
    .listing-save-btn:hover { transform: scale(1.08); }
    .listing-save-btn:hover .save-icon { color: #2563eb; filter: drop-shadow(0 2px 4px rgba(29, 78, 216, 0.28)); }
    .listing-save-btn.saved .save-icon { color: #d4af37; filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.35)); }
    .listing-save-btn.saved:hover .save-icon { color: #b8860b; filter: drop-shadow(0 2px 5px rgba(184, 134, 11, 0.38)); }
    .action-btn.contact-btn { width: 100%; }

    /* Match buyer dashboard search section layout */
    .search-layout {
        display: grid;
        grid-template-columns: 2fr 3fr auto;
        gap: 20px;
        margin-bottom: 30px;
        align-items: stretch;
    }
    .search-filters-grid { order: 1; display: grid; grid-template-columns: repeat(2, minmax(170px, 1fr)); gap: 12px; }
    .search-keyword-group { order: 2; height: 100%; justify-content: center; }
    .search-inline-actions { order: 3; display: flex; align-items: end; gap: 10px; }
    .search-inline-actions .search-button,
    .search-inline-actions .reset-button {
        min-width: 52px;
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 12px;
        justify-content: center;
    }
    .search-inline-actions .search-button i,
    .search-inline-actions .reset-button i {
        margin: 0;
        font-size: 1rem;
    }

    @media (max-width: 1024px) {
        .search-layout { grid-template-columns: 1fr; gap: 16px; }
        .search-filters-grid,
        .search-keyword-group,
        .search-inline-actions { order: initial; }
        .search-inline-actions { align-items: center; justify-content: flex-start; }
        .listings-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }
    }

    /* Mobile responsive styles for messaging */
    @media (max-width: 768px) {
        .message-modal-content {
            max-width: 95%;
        }
        
        .message-actions {
            flex-direction: column;
            align-items: stretch;
        }
        
        .contact-info {
            justify-content: center;
        }
        
        .send-btn {
            width: 100%;
        }
        
        .quick-contact-buttons {
            flex-direction: column;
        }

        .search-filters-grid { grid-template-columns: 1fr; gap: 10px; }
        .search-label { font-size: 0.82rem; }
        .search-input, .search-select { padding: 12px 13px; font-size: 16px; }
        .search-inline-actions .search-button,
        .search-inline-actions .reset-button {
            width: 46px;
            height: 46px;
            min-width: 46px;
        }

        .listings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-top: 14px; }
        .listing-card-image-container { height: 150px; }
        .listing-content { padding: 10px; }
        .listing-header { flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; }
        .listing-price { text-align: left; max-width: none; width: 100%; }
        .listing-details { gap: 8px; margin-bottom: 10px; padding-bottom: 10px; }
        .listing-broker { display: none; }
        .detail-unit { display: none; }
    }

    @media (max-width: 480px) {
        .message-header {
            padding: 20px;
        }
        
        .message-broker-card {
            margin: 15px;
            flex-direction: column;
            text-align: center;
        }
        
        .message-broker-avatar {
            width: 50px;
            height: 50px;
            font-size: 16px;
        }

        .search-inline-actions { width: 100%; }
        .search-inline-actions .search-button,
        .search-inline-actions .reset-button {
            width: 44px;
            height: 44px;
            min-width: 44px;
        }

        .listings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
        .listing-card-image-container { height: 105px; }
        .listing-content { padding: 10px; }
        .listing-location { font-size: 0.74rem; }
        .detail { font-size: 0.72rem; }
    }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    deleteDoc,
    orderBy,
    serverTimestamp,
    updateDoc,
    setDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
    authDomain: "bahai-1b76d.firebaseapp.com",
    projectId: "bahai-1b76d",
    storageBucket: "bahai-1b76d.firebasestorage.app",
    messagingSenderId: "646878644941",
    appId: "1:646878644941:web:5b4ccc3412250337587784"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const GOOGLE_MAPS_API_KEY = "AIzaSyBwwAkIEixelJysaGrMb9BfTsMwz_C9Noxk";

// Expose Firebase instances for shared top-nav auth sync (same as buyer dashboard)
window.firebaseApp = app;
window.firebaseAuth = auth;
window.firebaseDB = db;

// Global variables
let allListings = [];
let userMap = new Map();
let searchFilters = {};
let isUserAuthenticated = false;
let currentConversationId = null;
let messageListener = null;
const SEARCH_RESULTS_PER_PAGE = 24;
let currentSearchListings = [];
let currentSearchSavedMap = new Map();
let currentSearchPage = 1;

// ========== KYC CHECK FUNCTIONS (ADDED) ==========

// Check if user can message based on KYC status
async function canUserMessage() {
    const currentUser = auth.currentUser;
    if (!currentUser) return false;
    
    try {
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        if (!userDoc.exists()) return false;
        
        const userData = userDoc.data();
        const kycStatus = userData.kycStatus || "not_submitted";
        
        // Only approved buyers can message
        return kycStatus === "approved";
    } catch (error) {
        console.error("Error checking KYC status:", error);
        return false;
    }
}

    if (!currentUser) {
        window.location.href = '../login.html';
        return;
    }
    
    // Check KYC status
    try {

        if (userDoc.exists()) {

            const kycStatus = userData.kycStatus || "not_submitted";

// Load messages for a conversation
function loadMessages(conversationId, brokerId) {
    const messagesContainer = document.getElementById('messagesContainer');
    
    // Clear any existing listener
    if (messageListener) {
        messageListener();
        messageListener = null;
    }
    
    // Show loading state
    messagesContainer.innerHTML = `
        <div class="loading-messages">
            <div class="spinner"></div>
            <p>Loading messages...</p>
        </div>
    `;
    
    console.log('🔍 Attempting to load messages for conversation:', conversationId);
    
    try {
        // Query messages for this conversation
        const messagesRef = collection(db, 'messages');
        const messagesQuery = query(
            messagesRef,
            where('conversationId', '==', conversationId),
            orderBy('timestamp', 'asc')
        );
        
        console.log('📋 Query created, listening for messages...');
        
        // Listen for real-time updates
        messageListener = onSnapshot(messagesQuery, 
            (snapshot) => {
                console.log('📨 Snapshot received, docs:', snapshot.size);
                
                messagesContainer.innerHTML = '';
                
                if (snapshot.empty) {
                    console.log('📭 No messages found in conversation');
                    messagesContainer.innerHTML = `
                        <div class="no-messages">
                            <div style="font-size: 48px; margin-bottom: 16px;">💬</div>
                            <h3>No messages yet</h3>
                            <p>Start the conversation by sending a message below.</p>
                        </div>
                    `;
                    return;
                }
                
                const currentUser = auth.currentUser;
                
                snapshot.forEach((doc) => {
                    const message = doc.data();
                    const isSent = message.senderId === currentUser.uid;
                    
                    const messageElement = document.createElement('div');
                    messageElement.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
                    
                    // Format timestamp
                    let timestamp = 'Just now';
                    if (message.timestamp) {
                        const date = message.timestamp.toDate ? message.timestamp.toDate() : new Date();
                        timestamp = formatMessageTime(date);
                    }
                    
                    const messageContent = document.createElement('div');
                    messageContent.className = 'message-bubble-content';
                    
                    let statusIndicator = '';
                    if (isSent) {
                        statusIndicator = `<span class="message-status" style="margin-left: 5px; font-size: 10px;">✓</span>`;
                    }
                    
                    messageContent.innerHTML = `
                        <div>${message.text}</div>
                        <span class="message-time">${timestamp}${statusIndicator}</span>
                    `;
                    
                    messageElement.appendChild(messageContent);
                    messagesContainer.appendChild(messageElement);
                });
                
                // Scroll to bottom
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 100);
                
            }, 
            (error) => {
                console.error('❌ Error in onSnapshot listener:', error);
                
                messagesContainer.innerHTML = `
                    <div class="no-messages">
                        <div style="font-size: 48px; margin-bottom: 16px;">💬</div>
                        <h3>Start a conversation</h3>
                        <p>Send a message to begin chatting with the broker.</p>
                    </div>
                `;
            }
        );
        
    } catch (error) {
        console.error('💥 Error setting up message listener:', error);
        messagesContainer.innerHTML = `
            <div class="no-messages">
                <div style="font-size: 48px; margin-bottom: 16px;">💬</div>
                <h3>Ready to chat</h3>
                <p>Send your first message below to start the conversation.</p>
            </div>
        `;
    }
}

// Send message function
async function sendMessage() {
    const messageInput = document.getElementById('messageInput');
    const messageText = messageInput.value.trim();
    const sendBtn = document.getElementById('sendMessageBtn');
    
    if (!messageText) {
        messageInput.focus();
        return;
    }
    
    if (!currentConversationId || !auth.currentUser) {
        alert('Unable to send message. Please refresh and try again.');
        return;
    }
    
    // Get broker ID from conversation ID
    const conversationParts = currentConversationId.split('_');
    const brokerId = conversationParts.find(id => id !== auth.currentUser.uid);
    
    if (!brokerId) {
        alert('Unable to identify recipient.');
        return;
    }
    
    // Disable send button and show loading
    const originalText = sendBtn.innerHTML;
    sendBtn.innerHTML = '<div class="spinner" style="border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; width: 16px; height: 16px;"></div>';
    sendBtn.disabled = true;
    messageInput.disabled = true;
    
    try {
        // Get property ID for context
        const property = allListings.find(l => l.userId === brokerId);
        const propertyId = property?.id;
        
        // Create conversation document if it doesn't exist
        const conversationRef = doc(db, 'conversations', currentConversationId);
        const conversationSnap = await getDoc(conversationRef);
        
        const conversationData = {
            participants: [auth.currentUser.uid, brokerId],
            lastMessage: messageText.substring(0, 100),
            lastMessageTime: serverTimestamp(),
            lastSenderId: auth.currentUser.uid,
            unreadCount: {
                [brokerId]: (conversationSnap.exists() ? 
                    (conversationSnap.data().unreadCount?.[brokerId] || 0) + 1 : 1)
            },
            buyerId: auth.currentUser.uid,
            brokerId: brokerId,
            propertyId: propertyId || null,
            propertyTitle: property?.title || null,
            buyerName: auth.currentUser.displayName || auth.currentUser.email,
            createdAt: conversationSnap.exists() ? 
                conversationSnap.data().createdAt : serverTimestamp(),
            updatedAt: serverTimestamp()
        };
        
        // Update or create conversation
        await setDoc(conversationRef, conversationData, { merge: true });
        
        // Add message to messages collection
        const messageData = {
            conversationId: currentConversationId,
            senderId: auth.currentUser.uid,
            receiverId: brokerId,
            text: messageText,
            timestamp: serverTimestamp(),
            read: false,
            createdAt: serverTimestamp(),
            type: 'text',
            propertyId: propertyId || null,
            senderName: auth.currentUser.displayName || auth.currentUser.email
        };
        
        await addDoc(collection(db, 'messages'), messageData);
        
        console.log('✅ Message sent successfully');
        
        // Clear input and reset UI
        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.disabled = false;
        
        // Show success feedback
        sendBtn.innerHTML = '✓ Sent';
        sendBtn.style.background = '#10b981';
        
        setTimeout(() => {
            sendBtn.innerHTML = '📨 Send';
            sendBtn.style.background = '';
            sendBtn.disabled = false;
        }, 1500);
        
        // Scroll to bottom of messages
        const messagesContainer = document.getElementById('messagesContainer');
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 100);
        
    } catch (error) {
        console.error('❌ Error sending message:', error);
        
        // Reset UI
        sendBtn.innerHTML = originalText;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        
        // Show user-friendly error
        let errorMessage = 'Failed to send message. ';
        if (error.code === 'permission-denied') {
            errorMessage += 'You do not have permission to send messages.';
        } else if (error.code === 'unavailable') {
            errorMessage += 'Network error. Please check your connection.';
        } else {
            errorMessage += 'Please try again.';
        }
        
        alert(errorMessage);
    }
}

// Format message timestamp
function formatMessageTime(date) {
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    if (diffDays < 7) return `${diffDays}d ago`;
    
    return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function closeMessageModal() {
    const messageModal = document.getElementById('messageModal');
    messageModal.classList.remove('show');
    document.body.style.overflow = 'auto';
    
    // Clean up message listener
    if (messageListener) {
        messageListener();
        messageListener = null;
    }
    
    currentConversationId = null;
    
    // Clear message input
    document.getElementById('messageInput').value = '';
}

function getRoleDisplayText(role) {
    const roleMap = {
        'landlord': 'Property Owner',
        'seller': 'Property Seller',
        'broker': 'Licensed Broker',
        'agent': 'Property Agent',
        'admin': 'Administrator'
    };
    return roleMap[role] || 'Posted by';
}

function getListingType(listing) {
    if (listing.listingType === 'lease' || listing.type === 'lease') {
        return 'lease';
    }

    if (listing.listingType === 'rent' || listing.type === 'rent') {
        return 'rent';
    }

    if (listing.listingType === 'sale' || listing.type === 'sale') {
        return 'sale';
    }

    if (listing.monthlyRent !== undefined && listing.monthlyRent !== null && listing.monthlyRent > 0) {
        return 'rent';
    }

    if (listing.annualRent !== undefined && listing.annualRent !== null && listing.annualRent > 0) {
        return 'lease';
    }

    if ((listing.pricing !== undefined && listing.pricing !== null && listing.pricing > 0) ||
        (listing.salePrice !== undefined && listing.salePrice !== null && listing.salePrice > 0)) {
        return 'sale';
    }

    return 'sale';
}

function getDisplayPrice(listing) {
    const type = getListingType(listing);

    switch (type) {
        case 'rent':
            return '₱' + (listing.monthlyRent || 0).toLocaleString() + '/month';
        case 'lease':
            const annualRent = listing.annualRent || 0;
            return '₱' + annualRent.toLocaleString() + '/year';
        case 'sale':
        default:
            return '₱' + (listing.pricing || listing.salePrice || 0).toLocaleString();
    }
}

function getPriceClass(listing) {
    const type = getListingType(listing);

    switch (type) {
        case 'rent':
            return 'price-rent';
        case 'lease':
            return 'price-lease';

        default:
            return 'price-sale';
    }
}

}

// Address helper functions from dashboard
function getCompleteAddress(listing) {
    const primaryAddress = listing.address || listing.location || listing.title || '';
    
    let fullAddress = primaryAddress;
    
    if (listing.city) {
        fullAddress += ', ' + listing.city;
    }
    
    if (listing.province && listing.province !== 'Calabarzon') {
        fullAddress += ', ' + listing.province;
    }
    
    if (!listing.province && listing.city) {
        fullAddress += ', Philippines';
    }
    
    return fullAddress || 'Batangas, Philippines';
}

// --- CATEGORY DETECTION FUNCTION (FROM BUYER DASHBOARD) ---
function propertyBelongsToCategory(listing, category) {
    const propertyType = (listing.propertyType || '').toLowerCase();
    const propertyCategory = (listing.propertyCategory || '').toLowerCase();
    const listingTitle = (listing.title || '').toLowerCase();
    const listingDescription = (listing.description || '').toLowerCase();
    const searchText = `${propertyType} ${propertyCategory} ${listingTitle} ${listingDescription}`;

    // Check property types first (exact matches)
    for (const type of category.propertyTypes) {
        const typeLower = type.toLowerCase();
        if (propertyType === typeLower || propertyType.includes(typeLower)) {
            return true;
        }
    }

    // Check keywords
    for (const keyword of category.keywords) {
        if (searchText.includes(keyword.toLowerCase())) {
            // Check exclusions
            if (category.excludeKeywords) {
                let shouldExclude = false;
                for (const excludeKeyword of category.excludeKeywords) {
                    if (searchText.includes(excludeKeyword.toLowerCase())) {
                        shouldExclude = true;
                        break;
                    }
                }
                if (!shouldExclude) {
                    return true;
                }
            } else {
                return true;
            }
        }
    }

    return false;
}

// Load filters from URL parameters
function loadFiltersFromURL() {
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('filters')) {
        try {
            searchFilters = JSON.parse(decodeURIComponent(urlParams.get("filters")));
            // Set form values from filters
            if (searchFilters.location) {
                document.getElementById("filterLocation").value = searchFilters.location;
            }
            if (searchFilters.transactionType) {
                document.getElementById("filterListingType").value = searchFilters.transactionType;
            }
            if (searchFilters.searchTerm) {
                document.getElementById("filterName").value = searchFilters.searchTerm;
            }
        } catch (error) {
            console.error("Error parsing filters from URL:", error);
        }
    }
}

// Update active filters display
function updateActiveFiltersDisplay() {
    const activeFiltersContainer = document.getElementById('activeFilters');
    const resultsBadge = document.getElementById('resultsBadge');
    const resultsNumber = document.getElementById('resultsNumber');
    
    if (Object.keys(searchFilters).length > 0) {
        activeFiltersContainer.innerHTML = '';
        
        Object.entries(searchFilters).forEach(([key, value]) => {
            if (value) {
                // Internal/system filters from chatbot should not show as raw chips
                if (key === 'propertyIds' || key === 'source' || key === 'amenity') return;
                if (key === 'searchTerm' && searchFilters.source === 'chatbot') return;
                
                const filterTag = document.createElement('div');
                filterTag.className = 'filter-tag';
                filterTag.style.cssText = `
                    display: inline-flex;
                    align-items: center;
                    gap: 5px;
                    background: var(--primary-light);
                    color: white;
                    padding: 4px 10px;
                    border-radius: 15px;
                    font-size: 12px;
                    margin-right: 8px;
                    margin-bottom: 8px;
                `;
                
                let displayKey = key;
                if (key === 'transactionType') displayKey = 'Type';
                if (key === 'searchTerm') displayKey = 'Keyword';
                
                filterTag.innerHTML = `
                    <span>${displayKey}: ${value}</span>
                    <button class="remove-filter" data-filter="${key}" style="background: none; border: none; color: white; cursor: pointer; font-size: 14px; margin-left: 4px;">×</button>
                `;
                activeFiltersContainer.appendChild(filterTag);
            }
        });
        
        activeFiltersContainer.style.display = 'flex';
        activeFiltersContainer.style.flexWrap = 'wrap';
        
        // Add event listeners to remove buttons
        activeFiltersContainer.querySelectorAll('.remove-filter').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const filterKey = this.getAttribute('data-filter');
                removeFilter(filterKey);
            });
        });
    } else {
        activeFiltersContainer.style.display = 'none';
    }
}

// Remove individual filter
function removeFilter(filterKey) {
    if (searchFilters[filterKey]) {
        delete searchFilters[filterKey];
        
        // Update form
        if (filterKey === 'location') document.getElementById('filterLocation').value = '';
        if (filterKey === 'transactionType') document.getElementById('filterListingType').value = '';
        if (filterKey === 'searchTerm') document.getElementById('filterName').value = '';
        
        // Apply filters and update URL
        applyFilters();
    }
}

// --- FILTER FUNCTIONS ---

// Apply filters function for this page
async function applyFilters() {
    // Keep chatbot deep-link context (near-mall map pins on property details)
    const preservedChatbot = {
        amenity: searchFilters.amenity,
        source: searchFilters.source,
        propertyIds: searchFilters.propertyIds
    };

    // Collect filter values
    const filters = {
        location: document.getElementById('filterLocation').value || undefined,
        transactionType: document.getElementById('filterListingType').value || undefined,
        searchTerm: document.getElementById('filterName').value || undefined
    };
    
    // Clean filters (remove undefined values)
    const cleanFilters = Object.fromEntries(
        Object.entries(filters).filter(([key, value]) => value !== undefined)
    );
    
    // Update searchFilters and reload
    searchFilters = { ...cleanFilters };
    if (preservedChatbot.amenity) searchFilters.amenity = preservedChatbot.amenity;
    if (preservedChatbot.source) searchFilters.source = preservedChatbot.source;
    if (Array.isArray(preservedChatbot.propertyIds) && preservedChatbot.propertyIds.length > 0) {
        searchFilters.propertyIds = preservedChatbot.propertyIds;
    }

    // Load listings with filters
    await loadAllListings();

    // Update URL without reloading (include amenity/source/propertyIds for details-page map)
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('filters', encodeURIComponent(JSON.stringify(searchFilters)));
    window.history.pushState({}, '', newUrl);

    // Log search event for AI recommendations (only if user is logged in)
    try {
        const currentUser = auth.currentUser;
        if (currentUser && Object.keys(searchFilters).length > 0) {
            await logSearchEvent(currentUser.uid, searchFilters);
            console.log('✔️ Search event logged for AI recommendations');
        }
    } catch (error) {
        console.log('Could not log search event', error.message);
    }
}

// Reset filters function
function resetFilters() {
    document.getElementById('filterLocation').value = "";
    document.getElementById('filterListingType').value = "";
    document.getElementById('filterName').value = "";

    // Clear search filters and reload
    searchFilters = {};
    loadAllListings();

    // Clear URL parameters
    window.history.pushState({}, '', 'search_results.html');
}

// Attach event listeners
document.getElementById('applyFilters').addEventListener('click', applyFilters);
document.getElementById('resetFilters').addEventListener('click', resetFilters);

async function loadAllListings() {
    try {
        console.log('[ ] Loading all listings...');

        // Fetch ALL properties
        const listingsQuery = query(collection(db, "properties"));
        const querySnapshot = await getDocs(listingsQuery);

        allListings = [];
        const userIds = new Set();

        querySnapshot.forEach((doc) => {
            const listing = {
                id: doc.id,
                ...doc.data()
            };
            allListings.push(listing);

            // Collect user IDs
            if (listing.userId) {
                userIds.add(listing.userId);
            } else if (listing.ownerId) {
                userIds.add(listing.ownerId);
            }
        });

        console.log(`Found ${allListings.length} listings total`);

        await loadAllUserData(userIds);

        // Display filtered listings
        displayFilteredListings();

    } catch (error) {
        console.error("Error loading listings:", error);
        displayError(error);
    }
}

async function loadAllUserData(userIds) {
    userMap.clear();

    if (userIds.size == 0) {
        console.log("No user IDs found to load");
        return;
    }

    console.log(`Loading user data for ${userIds.size} users...`);

    for (const userId of userIds) {
        await loadUserData(userId);
    }
}

async function loadUserData(userId) {
    try {
        // First try users collection
        const userDoc = await getDoc(doc(db, "users", userId));
        
        if (userDoc.exists()) {
            const userData = userDoc.data();
            const fullName = userData.fullName || 
                userData.firstName + ' ' + (userData.lastName || '') || 
                userData.email?.split('@')[0] || 
                `User ${userId.substring(0, 8)}`;
            
            userMap.set(userId, {
                displayName: fullName.trim(),
                email: userData.email || 'Email not available',
                phone: userData.phone || 'Phone not available',
                role: userData.role || 'user',
                photoURL: userData.photoURL || userData.profilePhotoURL || userData.profilePhoto || null
            });
            return;
        }
        
        // Then try landlords collection
        const landlordDoc = await getDoc(doc(db, "landlords", userId));
        
        if (landlordDoc.exists()) {
            const landlordData = landlordDoc.data();
            const fullName = landlordData.fullName || 
                landlordData.firstName + ' ' + (landlordData.lastName || '') || 
                landlordData.email?.split('@')[0] || 
                `Landlord ${userId.substring(0, 8)}`;
            
            userMap.set(userId, {
                displayName: fullName.trim(),
                email: landlordData.email || 'Email not available',
                phone: landlordData.phone || 'Phone not available',
                role: 'landlord',
                photoURL: landlordData.photoURL || landlordData.profilePhotoURL || landlordData.profilePhoto || null
            });
            return;
        }
        
        // Then try brokers collection
        const brokerDoc = await getDoc(doc(db, "brokers", userId));
        
        if (brokerDoc.exists()) {
            const brokerData = brokerDoc.data();
            const fullName = brokerData.fullName || 
                brokerData.firstName + ' ' + (brokerData.lastName || '') || 
                brokerData.email?.split('@')[0] || 
                `Broker ${userId.substring(0, 8)}`;
            
            userMap.set(userId, {
                displayName: fullName.trim(),
                email: brokerData.email || 'Email not available',
                phone: brokerData.phone || 'Phone not available',
                role: 'broker',
                photoURL: brokerData.photoURL || brokerData.profilePhotoURL || brokerData.profilePhoto || brokerData.profileImage || null
            });
            return;
        }
        
        // Default fallback
        userMap.set(userId, {
            displayName: `User ${userId.substring(0, 8)}`,
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        });
        
    } catch (error) {
        console.error(`Error loading user ${userId}:`, error);
        userMap.set(userId, {
            displayName: `User ${userId.substring(0, 8)}`,
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        });
    }
}

function displayFilteredListings() {
    // Filter active listings
    let filtered = allListings.filter(listing => {
        return listing.status === 'active' ||
            listing.status === 'available' ||
            listing.status === 'Active' ||
            (listing.status === undefined && listing.isActive !== false);
    });

    // Apply filters if any
    if (Object.keys(searchFilters).length > 0) {
        // If coming from chatbot, first constrain to chatbot-provided property IDs
        if (Array.isArray(searchFilters.propertyIds) && searchFilters.propertyIds.length > 0) {
            const allowedIds = new Set(searchFilters.propertyIds.map(String));
            filtered = filtered.filter(listing => allowedIds.has(String(listing.id)));
        }

        // Apply location filter
        if (searchFilters.location) {
            filtered = filtered.filter(listing =>
                (listing.location || "").includes(searchFilters.location) ||
                (listing.city || "").includes(searchFilters.location) ||
                (listing.province || "").includes(searchFilters.location)
            );
        }
        
        // Apply transaction type filter
        if (searchFilters.transactionType) {
            filtered = filtered.filter(listing =>
                getListingType(listing) === searchFilters.transactionType.toLowerCase()
            );
        }
        
        // Apply name/keyword filter
        // For chatbot-driven deep links, searchTerm is context text only.
        // Do not re-apply keyword filtering on top of explicit propertyIds.
        const shouldApplyKeywordFilter = searchFilters.searchTerm &&
            !(searchFilters.source === 'chatbot' &&
              Array.isArray(searchFilters.propertyIds) &&
              searchFilters.propertyIds.length > 0);

        if (shouldApplyKeywordFilter) {
            const rawSearch = searchFilters.searchTerm.toLowerCase().trim();
            const tokens = rawSearch.split(/[\s,]+/).filter(Boolean);

            filtered = filtered.filter(listing => {
                if (tokens.length === 0) return true;

                const textParts = [
                    listing.title,
                    listing.description,
                    listing.location,
                    listing.city,
                    listing.province,
                    listing.propertyType,
                    getListingType(listing)
                ].map(v => (v || '').toString().toLowerCase());

                const haystack = textParts.join(' ');

                const rawPrice =
                    listing.pricing ??
                    listing.salePrice ??
                    listing.monthlyRent ??
                    listing.annualRent ??
                    listing.price ??
                    0;
                const priceValue = typeof rawPrice === 'number'
                    ? rawPrice
                    : parseFloat(String(rawPrice).replace(/[^\d.]/g, '')) || 0;

                return tokens.every(token => {
                    // Try to interpret token as a price (e.g. "3m", "500k", "2500000")
                    const numericMatch = token.match(/^([\d,.]+)(k|m)?$/i);
                    if (numericMatch && priceValue > 0) {
                        let num = parseFloat(numericMatch[1].replace(/,/g, '')) || 0;
                        const suffix = numericMatch[2]?.toLowerCase();
                        if (suffix === 'k') num *= 1_000;
                        if (suffix === 'm') num *= 1_000_000;
                        if (num > 0) {
                            const low = num * 0.8;
                            const high = num * 1.2;
                            if (priceValue >= low && priceValue <= high) {
                                return true;
                            }
                        }
                    }

                    // Fallback: treat token as a regular keyword
                    return haystack.includes(token);
                });
            });
        }
    }

    // Update search summary
    const searchSummary = document.getElementById('searchSummary');
    const resultsCount = document.getElementById('resultsCount');
    const resultsTitle = document.getElementById('resultsTitle');
    const resultsBadge = document.getElementById('resultsBadge');
    const resultsNumber = document.getElementById('resultsNumber');

    if (Object.keys(searchFilters).length > 0) {
        let summaryText = `Found ${filtered.length} properties`;
        let filterParts = [];

        if (searchFilters.location) filterParts.push(`Location: ${searchFilters.location}`);
        if (searchFilters.transactionType) filterParts.push(`Type: ${searchFilters.transactionType}`);
        if (searchFilters.searchTerm && searchFilters.source !== 'chatbot') {
            filterParts.push(`Keyword: "${searchFilters.searchTerm}"`);
        }
        if (Array.isArray(searchFilters.propertyIds) && searchFilters.propertyIds.length > 0) {
            filterParts.push(`Source: Chatbot`);
        }

        if (filterParts.length > 0) {
            summaryText += ` matching ${filterParts.join(', ')}`;
        }

        searchSummary.innerHTML = `<i class="fas fa-check-circle" style="color: #10b981;"></i> ${summaryText}`;
        resultsCount.textContent = summaryText;
        resultsTitle.innerHTML = `<i class="fas fa-search"></i> Search Results (${filtered.length})`;
        
        // Update results badge
        resultsNumber.textContent = filtered.length;
        resultsBadge.style.display = 'inline-flex';
        resultsBadge.style.cssText = `
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            align-items: center;
            gap: 5px;
        `;
    } else {
        searchSummary.innerHTML = `<i class="fas fa-building"></i> Showing ${filtered.length} properties in Batangas`;
        resultsCount.textContent = `Showing ${filtered.length} properties in Batangas`;
        resultsTitle.innerHTML = `<i class="fas fa-building"></i> All Properties in Batangas (${filtered.length})`;
        
        // Update results badge
        resultsNumber.textContent = filtered.length;
        resultsBadge.style.display = 'inline-flex';
        resultsBadge.style.cssText = `
            background: var(--secondary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            align-items: center;
            gap: 5px;
        `;
    }
    
    // Update active filters display
    updateActiveFiltersDisplay();

    // Display filtered listings
    if (filtered.length === 0) {
        displayNoListings();
    } else {
        displayListings(filtered, 1, true);
    }
}

async function checkSavedStatus(listings) {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) return new Map();

        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef, where('userId', '==', currentUser.uid));
        const snapshot = await getDocs(q);

        const savedMap = new Map();
        snapshot.forEach(doc => {
            savedMap.set(doc.data().propertyId, true);
        });
        return savedMap;
    } catch (error) {
        console.error("Error checking saved status:", error);
        return new Map();
    }
}

async function displayListings(listings, page = 1, refreshData = true) {
    const container = document.getElementById('listingsContainer');
    if (refreshData) {
        currentSearchListings = Array.isArray(listings) ? listings : [];
        currentSearchPage = 1;
        // Check which properties are already saved (only if user is logged in)
        currentSearchSavedMap = await checkSavedStatus(currentSearchListings);
    }
    
    const totalPages = Math.max(1, Math.ceil(currentSearchListings.length / SEARCH_RESULTS_PER_PAGE));
    currentSearchPage = Math.max(1, Math.min(page, totalPages));
    const startIndex = (currentSearchPage - 1) * SEARCH_RESULTS_PER_PAGE;
    const pageListings = currentSearchListings.slice(startIndex, startIndex + SEARCH_RESULTS_PER_PAGE);
    
    // Add amenity suffix for chatbot integration
    const amenitySuffix = searchFilters.amenity
        ? `&amenity=${encodeURIComponent(searchFilters.amenity)}&source=ai`
        : '';
    
    container.innerHTML = pageListings.map(listing => {
        const isSaved = currentSearchSavedMap.has(listing.id);
        const ownerId = listing.userId || listing.ownerId || null;
        const userInfo = userMap.get(ownerId) || {
            displayName: ownerId ? `User ${ownerId.substring(0, 8)}` : 'Unknown',
            email: 'N/A',
            phone: 'N/A',
            role: 'user'
        };

        const userInitials = userInfo.displayName.split(' ').map(n => n[0]).join('').toUpperCase() || 'UU';
        const listingType = getListingType(listing);
        const displayPrice = getDisplayPrice(listing);
        const priceClass = getPriceClass(listing);
        const typeBadgeClass = getTypeBadgeClass(listing);
        const typeBadgeText = getTypeBadgeText(listing);

        // Get complete address
        const completeAddress = getCompleteAddress(listing);

        let mainPhoto;
        if (listing.photos && listing.photos.length > 0) {
            mainPhoto = listing.photos[0];
        } else if (listing.imageUrls && listing.imageUrls.length > 0) {
            mainPhoto = listing.imageUrls[0];
        } else if (listing.latitude && listing.longitude) {
            mainPhoto = `https://maps.googleapis.com/maps/api/staticmap?center=${listing.latitude},${listing.longitude}&zoom=15&size=400x200&markers=color:red%7C${listing.latitude},${listing.longitude}&key=${GOOGLE_MAPS_API_KEY}`;
        } else {
            mainPhoto = 'https://via.placeholder.com/400x200/0b2e52/white?text=No+Image';
        }

        const bedrooms = listing.bedrooms || (listingType === 'rent' && listing.propertyType === 'studio' ? 'Studio' : 0);
        const bathrooms = listing.bathrooms || 0;
        const area = listing.floorArea || listing.totalArea || 'N/A';
        const title = listing.title || 'Untitled Property';
        const truncatedTitle = title.length > 50 ? title.substring(0, 50) + '...' : title;
        const truncatedAddress = completeAddress.length > 40 ? completeAddress.substring(0, 40) + '...' : completeAddress;
        const brokerName = userInfo.displayName;
        const truncatedBrokerName = brokerName.length > 20 ? brokerName.substring(0, 20) + '...' : brokerName;
        const brokerAvatarHtml = userInfo.photoURL
            ? `<img src="${userInfo.photoURL}" alt="${(userInfo.displayName || '').replace(/"/g, '&quot;')}" onerror="var p=this.parentElement;p.innerHTML=p.getAttribute('data-fallback')||'U'">`
            : userInitials;
        const brokerAvatarWrapper = userInfo.photoURL
            ? `<div class="broker-avatar" data-fallback="${(userInitials || 'U').replace(/"/g, '&quot;')}" aria-label="Broker avatar">${brokerAvatarHtml}</div>`
            : `<div class="broker-avatar" aria-label="Broker avatar">${userInitials}</div>`;

        return `
        <div class="listing-card-wrapper">
            <div class="listing-card" data-listing-id="${listing.id}">
                <a href="new_property_details.html?id=${listing.id}${amenitySuffix}" class="card-link-overlay" aria-label="View ${title}"></a>
                <div class="listing-card-image-container">
                    <button type="button" class="${isSaved ? 'listing-save-btn saved' : 'listing-save-btn'}"
                            data-property-id="${listing.id}"
                            data-is-saved="${isSaved}"
                            aria-label="${isSaved ? 'Remove from saved' : 'Save property'}">
                        <i class="${isSaved ? 'fas' : 'far'} fa-heart save-icon" aria-hidden="true"></i>
                    </button>
                    <img src="${mainPhoto}" alt="${listing.title || 'Property'}" class="listing-image">
                    <div class="listing-type-badge ${typeBadgeClass}">${typeBadgeText}</div>
                </div>
                
                <div class="listing-content">
                    <div class="listing-header">
                        <div style="flex: 1; min-width: 0;">
                            <h3 class="listing-title" title="${title}">${truncatedTitle}</h3>
                        </div>
                        <div class="listing-price ${priceClass}">${displayPrice}</div>
                    </div>
                    <div class="listing-location">
                        <i class="fas fa-map-marker-alt" style="flex-shrink: 0;"></i>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${completeAddress}">${truncatedAddress}</span>
                    </div>
                    <div class="listing-details">
                        <div class="detail"><i class="fas fa-bed"></i> ${bedrooms}<span class="detail-unit">${bedrooms === 'Studio' ? '' : ' beds'}</span></div>
                        <div class="detail"><i class="fas fa-bath"></i> ${bathrooms}<span class="detail-unit"> baths</span></div>
                        <div class="detail"><i class="fas fa-ruler-combined"></i> ${area}<span class="detail-unit"> sqm</span></div>
                    </div>
                    <div class="listing-broker">
                        ${brokerAvatarWrapper}
                        <div class="broker-info">
                            <div class="broker-name" title="${brokerName}">${truncatedBrokerName}</div>
                            <div class="broker-contact">
                                ${getRoleDisplayText(userInfo.role)} · ${listing.propertyType || 'Property'}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
    
    renderSearchResultsPagination(totalPages, currentSearchPage);

    // Add event listeners to the newly created elements
    setupListingEventListeners();
    makePropertyCardsClickable();
    
    // Force badges to be visible
    setTimeout(forceBadgeVisibility, 100);
}

function renderSearchResultsPagination(totalPages, currentPage) {
    const paginationContainer = document.getElementById('pagination');
    if (!paginationContainer) return;

    if (!currentSearchListings.length || totalPages <= 1) {
        paginationContainer.style.display = 'none';
        paginationContainer.innerHTML = '';
        return;
    }

    const pagesToRender = [];
    for (let page = 1; page <= totalPages; page += 1) {
        if (
            page === 1 ||
            page === totalPages ||
            Math.abs(page - currentPage) <= 1
        ) {
            pagesToRender.push(page);
        }
    }
    const dedupedPages = Array.from(new Set(pagesToRender)).sort((a, b) => a - b);

    let html = `<button type="button" class="pagination-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>`;

    dedupedPages.forEach((page, index) => {
        if (index > 0 && page - dedupedPages[index - 1] > 1) {
            html += `<span style="padding: 0 2px; color: #6b7280;">...</span>`;
        }
        html += `<button type="button" class="pagination-btn ${page === currentPage ? 'active' : ''}" data-page="${page}">${page}</button>`;
    });

    html += `<button type="button" class="pagination-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;

    paginationContainer.innerHTML = html;
    paginationContainer.style.display = 'flex';

    paginationContainer.querySelectorAll('.pagination-btn[data-page]').forEach(button => {
        if (button.disabled) return;
        button.addEventListener('click', () => {
            const targetPage = Number(button.getAttribute('data-page'));
            if (!Number.isFinite(targetPage)) return;
            displayListings(currentSearchListings, targetPage, false);
            const section = document.querySelector('.properties-section');
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });
}

function setupListingEventListeners() {
    // Save property buttons
    document.querySelectorAll('.listing-save-btn').forEach(btn => {
        // Remove existing and add new listener
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        newBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            const propertyId = this.getAttribute('data-property-id');
            if (propertyId) {
                toggleSaveProperty(propertyId, this);
            }
        });
    });
}

function makePropertyCardsClickable() {
    const cards = document.querySelectorAll('.listing-card[data-listing-id]');
    cards.forEach(card => {
        if (card.dataset.clickBound === 'true') return;
        card.dataset.clickBound = 'true';
        card.style.cursor = 'pointer';

        card.addEventListener('click', function(e) {
            if (
                e.target.closest('.listing-save-btn') ||
                e.target.closest('button') ||
                e.target.closest('a.card-link-overlay')
            ) {
                return;
            }

            const listingId = this.getAttribute('data-listing-id');
            if (listingId) {
                // Must match overlay link (displayListings) so chatbot flows keep ?amenity=&source=ai for nearby map pins
                const amenitySuffix = searchFilters.amenity
                    ? `&amenity=${encodeURIComponent(searchFilters.amenity)}&source=ai`
                    : '';
                window.location.href = `new_property_details.html?id=${encodeURIComponent(listingId)}${amenitySuffix}`;
            }
        });
    });
}

function displayNoListings() {
    const container = document.getElementById('listingsContainer');
    const paginationContainer = document.getElementById('pagination');
    const resultsTitle = document.getElementById('resultsTitle');
    const resultsCount = document.getElementById('resultsCount');
    const resultsBadge = document.getElementById('resultsBadge');

    if (Object.keys(searchFilters).length > 0) {
        container.innerHTML = `
        <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <h3>No Properties Found</h3>
            <p>There are currently no properties matching your search criteria.</p>
            <button class="search-button" onclick="resetFilters()" style="margin-top: 20px;">
                <i class="fas fa-redo"></i>
                Reset Filters
            </button>
            <button class="search-button" onclick="window.location.href='buyer_dashboard.html'" style="margin-top: 10px; background: var(--secondary);">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </button>
        </div>`;

        resultsTitle.innerHTML = '<i class="fas fa-search"></i> No Results Found';
        resultsCount.textContent = "No properties match your search criteria";
        resultsBadge.style.display = 'none';
    } else {
        container.innerHTML = `
        <div class="empty-state">
            <div class="empty-state-icon">🏠</div>
            <h3>No Properties Available</h3>
            <p>There are currently no properties available in Batangas.</p>
            <button class="search-button" onclick="loadAllListings()" style="margin-top: 20px;">
                <i class="fas fa-redo"></i>
                Try Again
            </button>
        </div>`;

        resultsTitle.innerHTML = '<i class="fas fa-building"></i> All Properties in Batangas';
        resultsCount.textContent = "No properties available";
        resultsBadge.style.display = 'none';
    }
    if (paginationContainer) {
        paginationContainer.style.display = 'none';
        paginationContainer.innerHTML = '';
    }
}

function displayError(error) {
    const container = document.getElementById('listingsContainer');
    const paginationContainer = document.getElementById('pagination');
    const resultsBadge = document.getElementById('resultsBadge');
    
    container.innerHTML = `
    <div class="error-state">
        <div class="error-icon">⚠️</div>
        <h3>Error Loading Properties</h3>
        <p>There was an error loading the property listings.</p>
        <button class="search-button" onclick="loadAllListings()" style="margin-top: 20px;">
            <i class="fas fa-redo"></i>
            Try Again
        </button>
    </div>`;
    
    resultsBadge.style.display = 'none';
    if (paginationContainer) {
        paginationContainer.style.display = 'none';
        paginationContainer.innerHTML = '';
    }
}

// ====================== EVENT HANDLERS ============================

async function toggleSaveProperty(propertyId, buttonElement) {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) {
            alert('Please login to save properties');
            window.location.href = '../login.html';
            return;
        }

        const isSaved = buttonElement.getAttribute('data-is-saved') === 'true';
        if (isSaved) {
            // Remove from saved
            const savedRef = collection(db, 'savedProperties');
            const q = query(savedRef,
                where('userId', '==', currentUser.uid),
                where('propertyId', '==', propertyId)
            );
            const snapshot = await getDocs(q);

            if (!snapshot.empty) {
                await deleteDoc(snapshot.docs[0].ref);
                currentSearchSavedMap.delete(propertyId);
                buttonElement.innerHTML = '<i class="far fa-heart save-icon" aria-hidden="true"></i>';
                buttonElement.setAttribute('data-is-saved', 'false');
                buttonElement.setAttribute('aria-label', 'Save property');
                buttonElement.classList.remove('saved');
                console.log(`Property ${propertyId} removed from saved`);
                showSaveToast('Removed from saved', false);
            }
        } else {
            // Add to saved
            await addDoc(collection(db, 'savedProperties'), {
                userId: currentUser.uid,
                propertyId: propertyId,
                savedAt: new Date(),
                createdAt: new Date(),
            });

            // Log save event for AI recommendations
            await logSaveEvent(currentUser.uid, propertyId);
            currentSearchSavedMap.set(propertyId, true);

            buttonElement.innerHTML = '<i class="fas fa-heart save-icon" aria-hidden="true"></i>';
            buttonElement.setAttribute('data-is-saved', 'true');
            buttonElement.setAttribute('aria-label', 'Remove from saved');
            buttonElement.classList.add('saved');
            console.log(`Property ${propertyId} saved`);
            showSaveToast('Property saved!', false);
        }
    } catch (error) {
        console.error("Error toggling save:", error);
        showSaveToast("Error saving property", true);
    }
}

function showSaveToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${isError ? '#ef4444' : '#10b981'};
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    z-index: 9999;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.3s ease;
    `;

    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
