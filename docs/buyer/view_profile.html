<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profile - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* Broker-style design tokens */
:root {
  --primary: #0b2e52;
  --primary-gradient: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
  --accent-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
  --premium: #0b2e52;
  --text-dark: #1a202c;
  --text-light: #718096;
  --bg-light: #f8fafc;
  --bg-white: #ffffff;
  --border: #e2e8f0;
  --border-radius: 16px;
  --border-radius-sm: 12px;
  --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); color: var(--text-dark); min-height: 100vh; }

.mobile-menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 1001;
  background: var(--primary-gradient); color: white; border: none; width: 50px; height: 50px;
  border-radius: 12px; font-size: 24px; cursor: pointer; }
.main { flex: 1; margin-left: 0; padding: 24px; padding-top: 94px; width: 100%; min-height: calc(100vh - 94px); }

.back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; margin-bottom: 24px;
  background: white; border: 2px solid var(--border); border-radius: var(--border-radius-sm); color: var(--text-dark);
  font-weight: 600; text-decoration: none; transition: all 0.2s; }
.back-btn:hover { border-color: var(--primary); color: var(--primary); }

/* Profile Header - Broker style */
.profile-header {
  background: var(--bg-white);
  padding: 30px;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(0,0,0,0.05);
  margin-bottom: 30px;
  border-top: 5px solid var(--premium);
}
.profile-badges { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.profile-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
}
.badge-broker { background: var(--primary-gradient); color: white; }
.badge-landlord { background: var(--accent-gradient); color: white; }
.badge-broker-affiliated { background: var(--accent-gradient); color: white; }
.badge-active { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
.badge-verified { background: var(--accent-gradient); color: white; }

.profile-main { display: flex; align-items: flex-start; gap: 30px; margin-bottom: 30px; }
@media (max-width: 768px) {
  .profile-main { flex-direction: column; align-items: center; text-align: center; }
}
.profile-photo {
  width: 160px;
  height: 160px;
  border-radius: 16px;
  overflow: hidden;
  border: 4px solid var(--premium);
  box-shadow: var(--shadow-lg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-gradient);
  color: white;
  font-size: 48px;
  font-weight: 700;
}
.profile-photo img { width: 100%; height: 100%; object-fit: cover; }
.profile-details { flex: 1; }
.profile-name { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
.profile-title { font-size: 18px; color: var(--premium); font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.profile-title i { color: #d4af37; }
.profile-location { display: flex; align-items: center; gap: 10px; color: var(--text-light); margin-bottom: 15px; font-size: 16px; }
.profile-location i { color: #d4af37; }
.profile-bio { line-height: 1.6; color: var(--text-dark); margin-bottom: 20px; font-style: italic; }

/* Profile Stats - Broker style */
.profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
@media (max-width: 1024px) { .profile-stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .profile-stats { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--bg-white);
  padding: 20px;
  border-radius: var(--border-radius-sm);
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(0,0,0,0.05);
  text-align: center;
  border-top: 3px solid var(--premium);
}
.stat-value { font-size: 36px; font-weight: 700; color: var(--premium); margin-bottom: 5px; }
.stat-label { font-size: 14px; color: var(--text-light); font-weight: 500; }

/* Profile Actions */
.profile-actions { display: flex; gap: 15px; flex-wrap: wrap; }
.action-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px;
  font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s ease; text-decoration: none;
  border: none; font-family: inherit;
}
.action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-primary { background: var(--primary-gradient); color: white; }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }

/* Profile Content Grid */
.profile-content { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
@media (max-width: 1024px) { .profile-content { grid-template-columns: 1fr; } }

/* Profile Cards */
.profile-card {
  background: var(--bg-white);
  padding: 25px;
  border-radius: var(--border-radius);
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(0,0,0,0.05);
  margin-bottom: 25px;
  border-top: 3px solid var(--premium);
}
.section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.section-header i { font-size: 22px; color: var(--premium); }
.section-header h2 { font-size: 20px; font-weight: 600; color: var(--text-dark); }

/* Contact List */
.contact-list { list-style: none; }
.contact-item { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--border); }
.contact-item:last-child { border-bottom: none; }
.contact-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(11,46,82,0.1);
  display: flex; align-items: center; justify-content: center;
  color: var(--premium); font-size: 18px;
}
.contact-label { font-size: 13px; color: var(--text-light); margin-bottom: 3px; }
.contact-value { font-weight: 500; color: var(--text-dark); word-break: break-all; }

/* Tags */
.tags-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.tag { background: var(--bg-light); color: var(--text-dark); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; border: 1px solid var(--border); }

/* Social Links */
.social-links { display: flex; flex-wrap: wrap; gap: 10px; }
.social-link {
  width: 45px; height: 45px; border-radius: 50%; background: var(--bg-light); color: var(--text-dark);
  font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none;
  transition: all 0.3s ease;
}
.social-link:hover { transform: translateY(-3px); color: white; }
.social-facebook:hover { background: #1877F2; }
.social-linkedin:hover { background: #0077B5; }
.social-instagram:hover { background: #E4405F; }

/* Properties Grid */
.properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-top: 25px; }
@media (max-width: 768px) { .properties-grid { grid-template-columns: 1fr; } }
.profile-property-card {
  background: var(--bg-white); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--card-shadow);
  text-decoration: none; color: inherit; display: block; transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid rgba(0,0,0,0.05);
}
.profile-property-card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
.profile-property-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
.profile-property-card-content { padding: 16px; }
.profile-property-card-title { font-size: 1rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-property-card-loc { font-size: 0.85rem; color: var(--text-light); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.profile-property-card-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
.profile-properties-empty { text-align: center; padding: 32px 20px; color: var(--text-light); font-size: 15px; background: var(--bg-light); border-radius: var(--border-radius-sm); }

.profile-empty { text-align: center; padding: 60px 24px; color: var(--text-light); }
.profile-empty p { margin-top: 12px; font-size: 15px; }
.loading-state { text-align: center; padding: 80px 20px; color: var(--text-light); }
.loading-state .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu">☰</button>
<div id="sidebar-container"></div>

<main class="main">
  <a href="#" class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back</a>
  
  <div id="profileContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading profile...</p>
    </div>
  </div>
</main>

<script src="../sidebar-user.js"></script>
<script src="buyer-sidebar-loader.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.firebasestorage.app",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function getUrlParams() {
  const p = new URLSearchParams(window.location.search);
  return { type: p.get('type') || 'broker', id: p.get('id') || '' };
}

document.getElementById('backBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const referrer = document.referrer;
  if (referrer && referrer.includes(window.location.hostname) && !referrer.includes('view_profile')) {
    window.history.back();
  } else {
    window.location.href = 'buyer_dashboard.html';
  }
});

async function loadProfile(type, profileId) {
  let profileData = null;
  if (type === 'agent') {
    try {
      let agentDoc = await getDoc(doc(db, "agents", profileId));
      if (!agentDoc.exists()) {
        const agentsQuery = query(collection(db, "agents"), where("authUid", "==", profileId));
        const agentSnap = await getDocs(agentsQuery);
        if (!agentSnap.empty) agentDoc = agentSnap.docs[0];
      }
      if (agentDoc && agentDoc.exists()) {
        profileData = { ...agentDoc.data(), id: agentDoc.id };
      }
    } catch (_) {}
    if (!profileData) {
      try {
        const userDoc = await getDoc(doc(db, "users", profileId));
        if (userDoc.exists()) {
          const d = userDoc.data();
          if (d.userType === 'agent' || d.userRole === 'agent') {
            profileData = { ...d, id: profileId };
          }
        }
      } catch (_) {}
    }
  } else if (type === 'broker') {
    try {
      const brokerDoc = await getDoc(doc(db, "brokers", profileId));
      if (brokerDoc.exists()) profileData = { ...brokerDoc.data(), id: profileId };
    } catch (_) {}
    if (!profileData) {
      try {
        const userDoc = await getDoc(doc(db, "users", profileId));
        if (userDoc.exists()) profileData = { ...userDoc.data(), id: profileId };
      } catch (_) {}
    }
  } else {
    try {
      const landlordDoc = await getDoc(doc(db, "landlords", profileId));
      if (landlordDoc.exists()) profileData = { ...landlordDoc.data(), id: profileId };
    } catch (_) {}
    if (!profileData) {
      try {
        const userDoc = await getDoc(doc(db, "users", profileId));
        if (userDoc.exists()) profileData = { ...userDoc.data(), id: profileId };
      } catch (_) {}
    }
  }
  return profileData;
}

async function loadProperties(userId, type) {
  try {
    const propsRef = collection(db, "properties");
    let list = [];
    const q1 = query(propsRef, where("userId", "==", userId));
    const snap1 = await getDocs(q1);
    snap1.forEach(d => list.push({ id: d.id, ...d.data() }));
    if (type === 'agent') {
      const q2 = query(propsRef, where("agentId", "==", userId));
      const snap2 = await getDocs(q2);
      const seen = new Set(list.map(p => p.id));
      snap2.forEach(d => { if (!seen.has(d.id)) { seen.add(d.id); list.push({ id: d.id, ...d.data() }); } });
    }
    return list.filter(p => !p.status || p.status === 'active' || p.status === 'available');
  } catch (e) {
    console.warn('Error loading properties:', e);
    return [];
  }
}

function getListingType(p) {
  if (p.monthlyRent) return 'rent';
  if (p.annualRent) return 'lease';
  return 'sale';
}

function getDisplayPrice(p) {
  const t = getListingType(p);
  if (t === 'rent') return '₱' + (p.monthlyRent || 0).toLocaleString() + '/mo';
  if (t === 'lease') return '₱' + (p.annualRent || 0).toLocaleString() + '/yr';
  return '₱' + (p.pricing || p.salePrice || 0).toLocaleString();
}

function ensureArray(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v === 'string') return v.split(',').map(s => s.trim()).filter(Boolean);
  return [String(v)];
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderProfile(profile, type, properties) {
  const defaultNames = { broker: 'Broker', agent: 'Agent', landlord: 'Property Owner' };
  const fullName = profile.fullName || profile.displayName || profile.name || defaultNames[type] || 'User';
  const role = type === 'agent'
    ? (profile.title || profile.role || profile.profession || 'Real Estate Agent')
    : type === 'broker'
    ? (profile.title || profile.role || profile.profession || 'Licensed Broker')
    : 'Property Owner';
  const photoURL = profile.photoURL || profile.profilePhotoURL || profile.profilePhoto || profile.profileImage || profile.imageURL || '';
  const bio = profile.bio || profile.description || profile.about || '';
  const email = profile.email || 'Not provided';
  const phone = profile.phone || profile.phoneNumber || profile.contactNumber || 'Not provided';
  const location = profile.location || profile.city || profile.address || 'Not specified';

  const initials = (fullName || 'U').split(' ').map(n => n ? n[0] : '').join('').toUpperCase().substring(0, 2) || 'U';
  const safeInitials = (initials || 'U').replace(/["'<>]/g, '');
  const avatarHtml = photoURL
    ? `<img src="${(photoURL || '').replace(/"/g, '&quot;')}" alt="${(fullName || '').replace(/"/g, '&quot;')}" onerror="var p=this.parentElement;p.innerHTML=p.getAttribute('data-fallback')||'U'">`
    : initials;

  const yearsExp = profile.yearsExperience || profile.experienceYears || 0;
  const agentId = profile.agentId || profile.agentID || profile.id || '';
  const clientsServed = profile.clientsServed || profile.totalClients || profile.clients || '0';
  const successRate = profile.successRate ? profile.successRate + '%' : '0%';
  const licenseNum = profile.licenseNumber || profile.license || '';
  const agency = profile.agencyName || profile.company || profile.brokerage || '';
  const languages = profile.languages || profile.spokenLanguages || '';
  const availability = profile.availability || profile.officeHours || '';
  const website = profile.website || (profile.socialMedia && profile.socialMedia.website) || '';
  const propertyTypes = ensureArray(profile.propertyTypes);
  const servicesOffered = ensureArray(profile.servicesOffered);
  const serviceAreas = ensureArray(profile.serviceAreas);
  const sm = profile.socialMedia || {};
  const memberSince = profile.createdAt || profile.joinedDate || profile.dateCreated;

  let memberSinceStr = '';
  if (memberSince && memberSince.toDate) {
    try { memberSinceStr = memberSince.toDate().toLocaleDateString('en-US', { year: 'numeric', month: 'long' }); } catch (_) {}
  } else if (memberSince && typeof memberSince === 'object' && memberSince.seconds) {
    try { memberSinceStr = new Date(memberSince.seconds * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'long' }); } catch (_) {}
  } else if (memberSince) {
    try { memberSinceStr = new Date(memberSince).toLocaleDateString('en-US', { year: 'numeric', month: 'long' }); } catch (_) {}
  }

  const socialPlatforms = [
    { key: 'facebook', icon: 'fab fa-facebook-f', url: 'https://facebook.com/', cls: 'social-facebook' },
    { key: 'linkedin', icon: 'fab fa-linkedin-in', url: 'https://linkedin.com/in/', cls: 'social-linkedin' },
    { key: 'instagram', icon: 'fab fa-instagram', url: 'https://instagram.com/', cls: 'social-instagram' }
  ];
  const socialLinksHtml = socialPlatforms.filter(pl => sm[pl.key] && sm[pl.key].trim())
    .map(pl => `<a href="${pl.url}${sm[pl.key].trim()}" target="_blank" rel="noopener noreferrer" class="social-link ${pl.cls}" aria-label="${pl.key}"><i class="${pl.icon}"></i></a>`)
    .join('');

  const badgesHtml = type === 'agent'
    ? `<span class="profile-badge badge-broker-affiliated">Broker Affiliated</span>`
    : type === 'broker'
    ? `<span class="profile-badge badge-broker">Broker</span><span class="profile-badge badge-active">Active</span><span class="profile-badge badge-verified">Verified Broker</span>`
    : `<span class="profile-badge badge-landlord">Property Owner</span><span class="profile-badge badge-active">Active</span><span class="profile-badge badge-verified">Verified</span>`;

  const profileId = profile.id || '';
  const messagesUrl = profileId ? `messages.html?userId=${encodeURIComponent(profileId)}` : 'messages.html';
  const actionsHtml = true
    ? `<div class="profile-actions">
        <a href="${messagesUrl}" class="action-btn btn-primary"><i class="fas fa-comment"></i> Message</a>
        ${email !== 'Not provided' ? `<a href="mailto:${email.replace(/"/g, '&quot;')}" class="action-btn btn-outline"><i class="fas fa-envelope"></i> Contact</a>` : ''}
        ${phone !== 'Not provided' ? `<a href="tel:${encodeURIComponent(phone)}" class="action-btn btn-outline"><i class="fas fa-phone"></i> Call</a>` : ''}
        ${phone !== 'Not provided' && (phone || '').replace(/\D/g, '').length >= 10 ? `<a href="https://wa.me/${(phone || '').replace(/\D/g, '')}" target="_blank" rel="noopener noreferrer" class="action-btn btn-outline"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
      </div>`
    : '';

  const yearsExpStr = yearsExp > 0 ? `${yearsExp} years experience` : '';

  const propertiesHtml = properties.length > 0
    ? properties.map(p => {
        const img = (p.photos || p.imageUrls || [])[0] || 'https://via.placeholder.com/320x180/0b2e52/white?text=No+Image';
        const title = (p.title || 'Untitled').substring(0, 50) + ((p.title || '').length > 50 ? '…' : '');
        const loc = (p.location || p.address || 'Location not specified').substring(0, 40) + ((p.location || p.address || '').length > 40 ? '…' : '');
        const price = getDisplayPrice(p);
        return `<a href="new_property_details.html?id=${p.id}" class="profile-property-card" aria-label="View ${title}">
          <img src="${img}" alt="${title}">
          <div class="profile-property-card-content">
            <div class="profile-property-card-title">${title}</div>
            <div class="profile-property-card-loc"><i class="fas fa-map-marker-alt"></i> ${loc}</div>
            <div class="profile-property-card-price">${price}</div>
          </div>
        </a>`;
      }).join('')
    : '<div class="profile-properties-empty">No listed properties yet</div>';

  const tagsHtml = (arr) => arr.length > 0 ? arr.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') : '';

  const profDetailsRows = [];
  if (type === 'agent') profDetailsRows.push(`<div style="margin-bottom:15px;"><div class="contact-label">Agent ID</div><div class="contact-value">${escapeHtml(agentId || profile.id || 'Not provided')}</div></div>`);
  if (licenseNum) profDetailsRows.push(`<div style="margin-bottom:15px;"><div class="contact-label">Broker License Number</div><div class="contact-value">${escapeHtml(licenseNum)}</div></div>`);
  if (agency) profDetailsRows.push(`<div style="margin-bottom:15px;"><div class="contact-label">Agency/Company</div><div class="contact-value">${escapeHtml(agency)}</div></div>`);
  if (languages) profDetailsRows.push(`<div style="margin-bottom:15px;"><div class="contact-label">Languages Spoken</div><div class="contact-value">${escapeHtml(languages)}</div></div>`);
  if (availability) profDetailsRows.push(`<div style="margin-bottom:15px;"><div class="contact-label">Availability</div><div class="contact-value">${escapeHtml(availability)}</div></div>`);
  if (memberSinceStr) profDetailsRows.push(`<div><div class="contact-label">Member Since</div><div class="contact-value">${escapeHtml(memberSinceStr)}</div></div>`);

  const hasSpecializations = ((type === 'broker' || type === 'agent') && (propertyTypes.length || servicesOffered.length || serviceAreas.length));
  const hasProfDetails = ((type === 'broker' || type === 'agent') && profDetailsRows.length > 0);

  return `
    <div class="profile-header">
      <div class="profile-badges">${badgesHtml}</div>
      <div class="profile-main">
        <div class="profile-photo" ${photoURL ? `data-fallback="${safeInitials.replace(/"/g, '&quot;')}"` : ''}>${avatarHtml}</div>
        <div class="profile-details">
          <h1 class="profile-name">${escapeHtml(fullName)}</h1>
          <div class="profile-title"><i class="fas ${type === 'agent' ? 'fa-user-tie' : type === 'broker' ? 'fa-crown' : 'fa-home'}"></i>${escapeHtml(role)}</div>
          <div class="profile-location">
            <i class="fas fa-map-marker-alt"></i>
            <span>${escapeHtml(location)}</span>
            ${yearsExpStr ? `<span>• ${yearsExpStr}</span>` : ''}
          </div>
          ${bio ? `<div class="profile-bio">${escapeHtml(bio).replace(/\n/g, '<br>')}</div>` : ''}
          <div class="profile-stats">
            <div class="stat-card"><div class="stat-value">${properties.length}</div><div class="stat-label">Properties</div></div>
            ${(type === 'broker' || type === 'agent') ? `<div class="stat-card"><div class="stat-value">${yearsExp}</div><div class="stat-label">Years Experience</div></div>` : ''}
            ${type === 'broker' ? `<div class="stat-card"><div class="stat-value">${clientsServed}</div><div class="stat-label">Clients Served</div></div>` : ''}
            ${type === 'broker' ? `<div class="stat-card"><div class="stat-value">${successRate}</div><div class="stat-label">Success Rate</div></div>` : ''}
          </div>
          ${actionsHtml}
        </div>
      </div>
    </div>
    <div class="profile-content">
      <div class="left-column">
        ${bio ? `<div class="profile-card"><div class="section-header"><i class="fas fa-user-tie"></i><h2>About</h2></div><div style="line-height:1.6;color:var(--text-dark);">${escapeHtml(bio).replace(/\n/g, '<br>')}</div></div>` : ''}
        ${hasSpecializations ? `
        <div class="profile-card">
          <div class="section-header"><i class="fas fa-star"></i><h2>Specializations</h2></div>
          ${propertyTypes.length ? `<div style="margin-bottom:20px;"><h3 style="margin-bottom:10px;color:var(--text-dark);font-size:16px;font-weight:600;">Property Types</h3><div class="tags-container">${tagsHtml(propertyTypes)}</div></div>` : ''}
          ${servicesOffered.length ? `<div style="margin-bottom:20px;"><h3 style="margin-bottom:10px;color:var(--text-dark);font-size:16px;font-weight:600;">Services Offered</h3><div class="tags-container">${tagsHtml(servicesOffered)}</div></div>` : ''}
          ${serviceAreas.length ? `<div><h3 style="margin-bottom:10px;color:var(--text-dark);font-size:16px;font-weight:600;">Service Areas</h3><div class="tags-container">${tagsHtml(serviceAreas)}</div></div>` : ''}
        </div>` : ''}
        <div class="profile-card">
          <div class="section-header"><i class="fas fa-home"></i><h2>Listings (${properties.length})</h2></div>
          <div class="properties-grid">${propertiesHtml}</div>
        </div>
      </div>
      <div class="right-column">
        <div class="profile-card">
          <div class="section-header"><i class="fas fa-address-card"></i><h2>Contact Information</h2></div>
          <ul class="contact-list">
            <li class="contact-item"><div class="contact-icon"><i class="fas fa-envelope"></i></div><div class="contact-details"><div class="contact-label">Email</div><div class="contact-value">${escapeHtml(email)}</div></div></li>
            <li class="contact-item"><div class="contact-icon"><i class="fas fa-phone"></i></div><div class="contact-details"><div class="contact-label">Phone</div><div class="contact-value">${escapeHtml(phone)}</div></div></li>
            <li class="contact-item"><div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div><div class="contact-details"><div class="contact-label">Location</div><div class="contact-value">${escapeHtml(location)}</div></div></li>
            ${website ? `<li class="contact-item"><div class="contact-icon"><i class="fas fa-globe"></i></div><div class="contact-details"><div class="contact-label">Website</div><a href="${website.startsWith('http') ? website : 'https://' + website}" target="_blank" rel="noopener noreferrer" class="contact-value" style="color:var(--premium);">${escapeHtml(website)}</a></div></li>` : ''}
          </ul>
        </div>
        ${hasProfDetails ? `<div class="profile-card"><div class="section-header"><i class="fas fa-briefcase"></i><h2>Professional Details</h2></div><div class="professional-details">${profDetailsRows.join('')}</div></div>` : ''}
        ${socialLinksHtml ? `<div class="profile-card"><div class="section-header"><i class="fas fa-share-alt"></i><h2>Connect</h2></div><div class="social-links">${socialLinksHtml}</div></div>` : ''}
      </div>
    </div>
  `;
}

function showError(msg) {
  document.getElementById('profileContent').innerHTML = `
    <div class="profile-card">
      <div class="profile-empty">
        <div style="font-size: 48px; margin-bottom: 16px;">👤</div>
        <h3>Profile not found</h3>
        <p>${msg}</p>
        <a href="buyer_dashboard.html" class="back-btn" style="margin-top: 24px; display: inline-flex;">Return to Dashboard</a>
      </div>
    </div>
  `;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = '../login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }
  loadBuyerSidebar('view_profile.html');
  const { type, id } = getUrlParams();
  if (!id) {
    showError('No profile ID provided.');
    return;
  }
  const [profile, properties] = await Promise.all([
    loadProfile(type, id),
    loadProperties(id, type)
  ]);
  if (!profile || Object.keys(profile).length === 0) {
    showError('This profile could not be loaded.');
    return;
  }
  document.getElementById('profileContent').innerHTML = renderProfile(profile, type, properties);
});
</script>
</body>
</html>
