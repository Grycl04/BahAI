<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Property Details - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root {
  --primary: #0b2e52;
  --primary-gradient: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
  --accent: #d4af37;
  --accent-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
  --text-dark: #1a202c;
  --text-light: #64748b;
  --bg-light: #f8fafc;
  --bg-white: #ffffff;
  --border: #e2e8f0;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: var(--text-dark); min-height: 100vh; }

.mobile-menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 1001;
  background: var(--primary-gradient); color: white; border: none; width: 50px; height: 50px;
  border-radius: 12px; font-size: 24px; cursor: pointer; }
.main { flex: 1; margin-left: 0; padding: 24px; padding-top: 94px; width: 100%; min-height: calc(100vh - 94px); }

.back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; margin-bottom: 24px;
  background: white; border: 2px solid var(--border); border-radius: var(--radius); color: var(--text-dark);
  font-weight: 600; text-decoration: none; transition: all 0.2s; }
.back-btn:hover { border-color: var(--primary); color: var(--primary); }

/* Hero Gallery */
.gallery-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--primary); margin-bottom: 24px; }
.gallery-hero .main-media-wrap { width: 100%; height: 420px; position: relative; }
.gallery-hero .main-media-wrap img, .gallery-hero .main-media-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-hero .main-media-wrap video { background: #000; }
.gallery-badges { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; flex-wrap: wrap; z-index: 2; }
.badge { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.badge-sale { background: var(--accent); color: white; }
.badge-rent { background: #059669; color: white; }
.badge-lease { background: #0ea5e9; color: white; }
.badge-active { background: white; color: var(--primary); }
.save-btn-float { position: absolute; top: 20px; right: 20px; padding: 12px 24px; border-radius: 12px;
  border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
  background: white; color: var(--primary); box-shadow: var(--shadow-lg); transition: all 0.2s; z-index: 2; }
.save-btn-float:hover { transform: translateY(-2px); }
.save-btn-float.saved { background: var(--success); color: white; border: none; }
.gallery-thumbs { display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.5); overflow-x: auto; }
.gallery-thumbs .thumb-item { width: 80px; height: 60px; border-radius: 8px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; flex-shrink: 0; overflow: hidden; position: relative; }
.gallery-thumbs .thumb-item:hover, .gallery-thumbs .thumb-item.active { opacity: 1; border: 2px solid white; }
.gallery-thumbs .thumb-item img, .gallery-thumbs .thumb-item video { width: 100%; height: 100%; object-fit: cover; }
.video-badge { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }

/* Content Grid */
.content-grid { display: grid; grid-template-columns: 1fr 420px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

/* Cards */
.card { background: white; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
.card-title { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

/* Property Header */
.prop-header { margin-bottom: 24px; }
.prop-title { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; line-height: 1.3; }
.prop-location { display: flex; align-items: center; gap: 8px; color: var(--text-light); font-size: 15px; margin-bottom: 16px; }
.prop-price { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
.prop-stats { display: flex; flex-wrap: wrap; gap: 24px; }
.stat { display: flex; align-items: center; gap: 10px; }
.stat i { color: var(--primary); font-size: 18px; }
.stat span { font-weight: 600; color: var(--text-dark); }

/* Detail Rows */
.detail-grid { display: grid; gap: 12px; }
.detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px; background: var(--bg-light); border-radius: var(--radius); }
.detail-label { font-size: 13px; color: var(--text-light); font-weight: 500; }
.detail-value { font-size: 15px; font-weight: 600; color: var(--text-dark); text-align: right; }

/* Contact Card */
.contact-card { background: var(--primary-gradient); color: white; border-radius: var(--radius-lg); padding: 28px; display: flex; flex-direction: column; width: 100%; }
.contact-header { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.contact-profile { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
.contact-profile-link {
  display: flex;
  align-items: center;
  gap: 20px;
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  margin: -8px -12px 0 -12px;
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}
.contact-profile-link:hover {
  background: rgba(255,255,255,0.1);
  box-shadow: inset 0 0 0 1px rgba(212,175,55,0.4);
}
.contact-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; overflow: hidden; flex-shrink: 0; }
.contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
.contact-profile-info { flex: 1; min-width: 0; }
.contact-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; word-break: break-word; }
.contact-role { font-size: 16px; opacity: 0.95; margin-bottom: 4px; }
.contact-view-profile { font-size: 12px; opacity: 0.8; text-decoration: underline; text-underline-offset: 2px; }
.contact-profile-link:hover .contact-view-profile { opacity: 1; color: rgba(212,175,55,1); }
.contact-verified { font-size: 11px; opacity: 0.85; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.contact-verified i { color: rgba(255,255,255,0.9); }
.contact-methods { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; flex: 1; }
.contact-method { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: rgba(255,255,255,0.1); border-radius: var(--radius); font-size: 16px; min-height: 56px; }
.contact-method i { width: 24px; text-align: center; font-size: 18px; flex-shrink: 0; }
.contact-method span { word-break: break-word; overflow-wrap: break-word; }
.contact-btn { width: 100%; padding: 16px 24px; border-radius: var(--radius); border: none; font-weight: 600; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; background: white; color: var(--primary); transition: all 0.2s; }
.contact-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

/* Amenities */
.amenities-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.amenity-chip { padding: 8px 16px; background: var(--bg-light); border-radius: 20px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }

/* Description */
.desc-text { font-size: 15px; line-height: 1.7; color: var(--text-dark); white-space: pre-wrap; }

/* Map Container - Updated for interactive map */
.map-container { 
  height: 280px; 
  border-radius: var(--radius); 
  overflow: hidden; 
  background: var(--bg-light);
  position: relative;
}

#propertyMap {
  width: 100%;
  height: 100%;
  border: none;
}

.map-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: var(--bg-light);
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
  flex-direction: column;
  gap: 8px;
}

.map-placeholder i {
  font-size: 48px;
  color: var(--primary);
}

/* Loading */
.loading-state { text-align: center; padding: 80px 20px; color: var(--text-light); }
.loading-state .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
.loading-state .loading-ai-note { font-size: 0.9rem; margin-top: 12px; color: var(--text-light); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Recommended by BahAI badge */
.badge-bahai { background: linear-gradient(135deg, var(--accent) 0%, #b8860b 100%); color: white; }
.gallery-image-count { position: absolute; bottom: 70px; right: 20px; background: rgba(0,0,0,0.6); color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 2; }

/* AI Insights panel */
.bahai-insights-panel { background: linear-gradient(135deg, rgba(11,46,82,0.04) 0%, rgba(212,175,55,0.08) 100%); border: 1px solid rgba(212,175,55,0.25); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; }
.bahai-insights-label { font-size: 0.75rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.bahai-insights-label i { color: var(--accent); }
.bahai-insights-list { list-style: none; padding: 0; margin: 0; }
.bahai-insights-list li { font-size: 0.95rem; color: var(--text-dark); padding: 6px 0; padding-left: 20px; position: relative; line-height: 1.4; }
.bahai-insights-list li::before { content: '•'; color: var(--accent); font-weight: 700; position: absolute; left: 0; }
.bahai-insights-footer { font-size: 0.7rem; color: var(--text-light); margin-top: 12px; font-style: italic; }

/* Trust microcopy */
.trust-note { font-size: 0.8rem; color: var(--text-light); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
.trust-note i { color: var(--success); }

/* HYBRID CALCULATOR WIDGETS - Best of both worlds */
.calculator-widget { 
  background: white; 
  border-radius: var(--radius-lg); 
  padding: 20px; 
  margin-top: 20px; 
  box-shadow: var(--shadow);
  border: 1px solid rgba(0,0,0,0.05);
}

.calc-header {
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.calc-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
  margin: 0;
}

.calc-header p {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 4px;
}

.calc-input-group {
  margin-bottom: 16px;
}

.calc-input-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dark);
  margin-bottom: 6px;
}

.calc-input-group input[type="number"],
.calc-input-group select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
}

.calc-input-group input:focus,
.calc-input-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(11, 46, 82, 0.1);
}

.calc-range-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}

.calc-range-row input[type="range"] {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  outline: none;
}

.calc-range-row input[type="range"]::-webkit-slider-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
}

.calc-range-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  min-width: 50px;
  text-align: right;
}

.calc-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Inter', sans-serif;
  margin-top: 8px;
}

.calc-btn.mortgage {
  background: var(--primary-gradient);
  color: white;
}

.calc-btn.rent {
  background: linear-gradient(135deg, #059669 0%, #10b981 100%);
  color: white;
}

.calc-btn.lease {
  background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
  color: white;
}

.calc-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

/* CALCULATOR RESULTS - Detailed from old code */
.calc-results {
  background: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
  color: white;
  padding: 16px;
  border-radius: var(--radius);
  margin-top: 16px;
  display: none;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.calc-results.show {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-highlight {
  background: rgba(255, 255, 255, 0.15);
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 12px;
  text-align: center;
}

.result-amount {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.result-label {
  font-size: 13px;
  opacity: 0.9;
}

.result-details {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}

.result-item {
  background: rgba(255, 255, 255, 0.1);
  padding: 12px;
  border-radius: 6px;
}

.result-item-label {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 4px;
}

.result-item-value {
  font-size: 14px;
  font-weight: 600;
}

.affordability-status {
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.affordability-good {
  background: rgba(16, 185, 129, 0.2);
  border-left: 4px solid var(--success);
  color: var(--success);
}

.affordability-moderate {
  background: rgba(245, 158, 11, 0.2);
  border-left: 4px solid var(--warning);
  color: var(--warning);
}

.affordability-stressed {
  background: rgba(239, 68, 68, 0.2);
  border-left: 4px solid var(--danger);
  color: var(--danger);
}

.calc-note {
  font-size: 11px;
  opacity: 0.8;
  margin-top: 12px;
  font-style: italic;
  line-height: 1.4;
}

/* Similar properties section */
.similar-properties-section { margin-top: 40px; }
.similar-properties-title { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.similar-properties-title i { color: var(--accent); }
.similar-properties-label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
.similar-properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.similar-property-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
.similar-property-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.similar-property-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
.similar-property-card-content { padding: 16px; }
.similar-property-card-title { font-size: 1rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.similar-property-card-loc { font-size: 0.85rem; color: var(--text-light); margin-bottom: 8px; }
.similar-property-card-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
@media (max-width: 600px) { .similar-properties-grid { grid-template-columns: 1fr; } }

/* Message Modal */
.message-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; padding: 20px; }
.message-modal.show { display: flex; opacity: 1; }
.message-modal-content { width: 90%; max-width: 700px; max-height: 85vh; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.message-header { padding: 24px 28px; background: var(--primary-gradient); color: white; display: flex; justify-content: space-between; align-items: center; }
.message-header h2 { font-size: 1.25rem; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.message-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; margin-left: 12px; }
.message-close:hover { background: rgba(255,255,255,0.3); }
.message-broker-card { padding: 20px 28px; background: var(--bg-light); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.message-broker-avatar { width: 52px; height: 52px; min-width: 52px; border-radius: 50%; background: var(--primary-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; }
.message-broker-avatar img { width: 100%; height: 100%; object-fit: cover; }
.message-broker-name { font-weight: 600; color: var(--text-dark); font-size: 1rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.message-broker-role { font-size: 0.85rem; color: var(--text-light); }
.messages-container { flex: 1; padding: 24px 28px; overflow-y: auto; min-height: 280px; max-height: 360px; background: #f9fafb; }
.message-bubble { margin-bottom: 16px; max-width: 80%; }
.message-bubble.sent { margin-left: auto; }
.message-bubble.received { margin-right: auto; }
.message-bubble-content { background: white; padding: 14px 18px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.message-bubble.sent .message-bubble-content { background: var(--primary-gradient); color: white; }
.message-time { display: block; font-size: 0.75rem; opacity: 0.8; margin-top: 6px; }
.message-bubble.sent .message-time { color: rgba(255,255,255,0.9); }
.loading-messages, .no-messages { text-align: center; padding: 40px 20px; color: var(--text-light); }
.message-input-area { padding: 20px 28px; background: white; border-top: 1px solid var(--border); }
.message-textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; resize: none; min-height: 80px; max-height: 140px; margin-bottom: 14px; }
.message-textarea:focus { outline: none; border-color: var(--primary); }
.message-property-context { padding: 16px 20px; background: linear-gradient(135deg, rgba(11,46,82,0.04) 0%, rgba(212,175,55,0.06) 100%); border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.2s ease; display: flex; gap: 16px; align-items: center; }
.message-property-context:hover { border-color: #d4af37; box-shadow: inset 0 0 0 2px rgba(212,175,55,0.2); }
.message-property-context-label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.message-property-context-thumb { width: 64px; height: 64px; min-width: 64px; border-radius: 10px; object-fit: cover; }
.message-property-context-info { flex: 1; min-width: 0; }
.message-property-context-title { font-size: 1rem; font-weight: 600; color: var(--text-dark); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.message-property-context-meta { font-size: 0.85rem; color: var(--text-light); }
.message-property-context-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-top: 4px; }
.message-property-context-unavailable { padding: 16px 20px; background: #fef3c7; border-bottom: 1px solid #fcd34d; font-size: 0.9rem; color: #92400e; }
@media (max-width: 480px) {
  .message-property-context { padding: 12px 16px; gap: 12px; }
  .message-property-context-thumb { width: 48px; height: 48px; min-width: 48px; }
  .message-property-context-title { font-size: 0.9rem; white-space: normal; }
}
.message-bahai-suggestions { padding: 12px 20px; background: rgba(212,175,55,0.06); border-bottom: 1px solid rgba(212,175,55,0.2); }
.message-bahai-suggestions-label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.message-bahai-suggestions-label i { color: #d4af37; }

        if (!userDoc.exists()) return false;

// Google Maps Functions from old code
async function loadRuntimePublicConfig() {
  if (runtimeConfigLoaded) return;
  try {
    const response = await fetch(`${CHATBOT_BACKEND_URL}/api/public-config`);
    const contentType = (response.headers.get("content-type") || "").toLowerCase();
    if (!response.ok || !contentType.includes("application/json")) {
      throw new Error(`public-config unavailable (status ${response.status}, content-type: ${contentType || "unknown"})`);
    }
    const data = await response.json();
    if (data && data.success && data.google_maps_api_key) {
      GOOGLE_MAPS_API_KEY = (data.google_maps_api_key || "").trim();
    }
  } catch (error) {
    console.warn("Could not load public runtime config from backend:", error);
    GOOGLE_MAPS_API_KEY = LEGACY_GOOGLE_MAPS_API_KEY;
  } finally {
    if (!GOOGLE_MAPS_API_KEY) {
      GOOGLE_MAPS_API_KEY = LEGACY_GOOGLE_MAPS_API_KEY;
    }
    runtimeConfigLoaded = true;
  }
}

async function loadGoogleMapsAPI() {
  await loadRuntimePublicConfig();

  if (window.google && window.google.maps && typeof window.google.maps.Map === "function") {
    return Promise.resolve();
  }

  if (googleMapsLoadPromise) {
    return googleMapsLoadPromise;
  }

  googleMapsLoadPromise = new Promise((resolve, reject) => {
    if (window.google && window.google.maps && typeof window.google.maps.Map === "function") {
      resolve();
      return;
    }

    if (!GOOGLE_MAPS_API_KEY) {
      reject(new Error("Google Maps key is not configured. Set GOOGLE_MAPS_API_KEY in backend env."));
      return;
    }

    const existingScript = document.getElementById("googleMapsScript");
    if (existingScript) {
      existingScript.addEventListener("load", () => {
        if (window.google && window.google.maps && typeof window.google.maps.Map === "function") {
          resolve();
        } else {
          reject(new Error("Google Maps API loaded but Map constructor is unavailable"));
        }
      }, { once: true });
      existingScript.addEventListener("error", () => reject(new Error("Failed to load existing Google Maps script")), { once: true });
      return;
    }

    const script = document.createElement('script');
    script.id = "googleMapsScript";
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
    script.async = true;
    script.defer = true;
    script.onload = () => {
      if (window.google && window.google.maps && typeof window.google.maps.Map === "function") {
        resolve();
      } else {
        reject(new Error("Google Maps API failed to initialize"));
      }
    };
    script.onerror = () => reject(new Error("Failed to load Google Maps script"));
    document.head.appendChild(script);
  });

  return googleMapsLoadPromise;
}

function initPropertyMap(lat, lng, title) {
  const mapElement = document.getElementById("propertyMap");
  if (!mapElement) {
    console.error("Map element not found");
    return;
  }

  try {
    const latitude = parseFloat(lat);
    const longitude = parseFloat(lng);

    if (isNaN(latitude) || isNaN(longitude)) {
      console.error("Invalid coordinates:", lat, lng);
      showMapPlaceholder(lat, lng);
      return;
    }

    const map = new google.maps.Map(mapElement, {
      center: { lat: latitude, lng: longitude },
      zoom: 16,
      mapTypeControl: true,
      streetViewControl: true,
      fullscreenControl: true,
      gestureHandling: "greedy",
      scrollwheel: true,
      draggable: true
    });

    // Property marker
    new google.maps.Marker({
      position: { lat: latitude, lng: longitude },
      map: map,
      title: title || "Property Location",
      animation: google.maps.Animation.DROP
    });

    // Load nearby proof only when amenity was explicitly provided by user query flow.
    const proofEl = document.getElementById("nearbyProof");
    if (shouldLoadNearbyAmenityProof) {
      loadNearbyLandmarkProof(map, latitude, longitude);
    } else if (proofEl) {
      proofEl.innerHTML = "";
    }
  } catch (error) {
    console.error("Error initializing map:", error);
    showMapPlaceholder(lat, lng);
  }
}

async function loadNearbyLandmarkProof(map, latitude, longitude) {
  const proofEl = document.getElementById("nearbyProof");
  try {
    const buildNearbyUrl = (category, useStaticFallback) =>
      `${CHATBOT_BACKEND_URL}/api/nearby_landmarks?lat=${encodeURIComponent(latitude)}&lng=${encodeURIComponent(longitude)}&category=${encodeURIComponent(category)}&limit=200&max_distance_km=10&use_static_fallback=${useStaticFallback ? 1 : 0}`;

    // First try live places only, then retry with static fallback if needed.
    let response = await fetch(buildNearbyUrl(effectiveAmenityCategory, false));
    let data = await response.json();
    if (!data.success || !Array.isArray(data.results) || data.results.length === 0) {
      response = await fetch(buildNearbyUrl(effectiveAmenityCategory, true));
      data = await response.json();
    }

    if (!data.success || !Array.isArray(data.results) || data.results.length === 0) {
      if (proofEl) {
        const label = effectiveAmenityCategory === 'all' ? 'amenity' : formatLandmarkCategory(effectiveAmenityCategory).toLowerCase();
        proofEl.innerHTML = `<em>No live nearby ${label} proof available right now.</em>`;
      }
      return;
    }

    const infoWindow = new google.maps.InfoWindow();
    data.results.forEach((item) => {
      const marker = new google.maps.Marker({
        position: { lat: item.lat, lng: item.lng },
        map,
        icon: getLandmarkMarkerIcon(item.category),
        title: `${item.name} (${item.distance_km} km)`
      });
      marker.addListener("click", () => {
        infoWindow.setContent(
          `<strong>${item.name}</strong><br/>Category: ${formatLandmarkCategory(item.category)}<br/>Distance: ${item.distance_km} km`
        );
        infoWindow.open(map, marker);
      });
    });

    if (proofEl) {
      const titleText = effectiveAmenityCategory === 'all'
        ? `${data.results.length} nearby places found.`
        : `${data.results.length} nearby ${formatLandmarkCategory(effectiveAmenityCategory).toLowerCase()} places found.`;
      proofEl.innerHTML = `<div style="margin-bottom:6px;"><strong>${titleText}</strong></div>` +
        data.results
          .map(item => `<div>• <strong>${item.name}</strong> (${formatLandmarkCategory(item.category)}) - ${item.distance_km} km</div>`)
          .join("");
    }
  } catch (error) {
    console.warn("Could not load nearby landmark proof:", error);
    if (proofEl) proofEl.innerHTML = "<em>Unable to load nearby amenity proof.</em>";
  }
}

async function loadSimilarProperties(current) {
  if (!current) return [];
  try {
    const snap = await getDocs(collection(db, 'properties'));
    const all = [];
    snap.forEach(d => {
      const p = { id: d.id, ...d.data() };
      if (p.id === current.id) return;
      const isActive = !p.status || p.status === 'active' || p.status === 'available';
      if (isActive) all.push(p);
    });
    const score = (p) => {
      let s = 0;
      if (p.propertyType === current.propertyType) s += 30;
      if (p.propertyCategory === current.propertyCategory) s += 20;
      const loc = (current.location || '').split(',')[0];
      if (loc && (p.location || '').toLowerCase().includes(loc.toLowerCase())) s += 40;
      const cp = p.pricing || p.salePrice || p.monthlyRent || (p.annualRent || 0) / 12;
      const currPrice = current.pricing || current.salePrice || current.monthlyRent || (current.annualRent || 0) / 12;
      if (currPrice > 0 && cp > 0 && Math.abs(cp - currPrice) / currPrice < 0.4) s += 30;
      return s;
    };
    return all.map(p => ({ p, s: score(p) })).sort((a, b) => b.s - a.s).slice(0, 6).map(x => x.p);
  } catch (e) {
    console.warn('Could not load similar properties:', e);
    return [];
  }
}

function isVideoFile(url) {
  if (!url) return false;
  const videoExtensions = ['.mp4', '.avi', '.mov', '.wmv', '.flv', '.webm', '.mkv', '.m4v'];
  const urlLower = url.toLowerCase();
  return videoExtensions.some(ext => urlLower.includes(ext)) ||
         urlLower.includes('/videos/') ||
         urlLower.includes('video/');
}

function initializePropertyCalculator(listing) {
  const listingType = getListingType(listing);
  
  if (listingType === 'sale') {

function updateDownpaymentAmount() {
  const price = parseFloat(document.getElementById('calc-property-price').value) || 0;
  const downpaymentPercent = parseFloat(document.getElementById('calc-downpayment').value) || 20;
  const downpaymentAmount = (price * downpaymentPercent / 100);
  
  const downpaymentAmountEl = document.getElementById('downpayment-amount');
  if (downpaymentAmountEl) {
    downpaymentAmountEl.textContent = 
      `₱${downpaymentAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }
}

function calculateMortgage() {
  const price = parseFloat(document.getElementById('calc-property-price').value);
  const downpaymentPercent = parseFloat(document.getElementById('calc-downpayment').value);
  const loanTerm = parseInt(document.getElementById('calc-loan-term').value);
  const interestRate = parseFloat(document.getElementById('calc-interest-rate').value);
  
  if (!price || price <= 0) {
    showCalculatorError('Please enter a valid property price');
    return;
  }
  
  const downpaymentAmount = price * downpaymentPercent / 100;
  const loanAmount = price - downpaymentAmount;
  const monthlyRate = interestRate / 100 / 12;
  const numberOfPayments = loanTerm * 12;
  
  // Mortgage formula: M = P [ i(1 + i)^n ] / [ (1 + i)^n - 1]
  const monthlyPayment = loanAmount * 
    (monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments)) / 
    (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
  
  const totalPayment = monthlyPayment * numberOfPayments;
  const totalInterest = totalPayment - loanAmount;
  
  const results = `
    <div class="result-highlight">
      <div class="result-amount">₱${monthlyPayment.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      <div class="result-label">Monthly Payment</div>
    </div>
    
    <div class="result-details">
      <div class="result-item">
        <div class="result-item-label">Loan Amount</div>
        <div class="result-item-value">₱${loanAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Down Payment</div>
        <div class="result-item-value">₱${downpaymentAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${downpaymentPercent}%)</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Total Interest</div>
        <div class="result-item-value">₱${totalInterest.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Total Payment</div>
        <div class="result-item-value">₱${totalPayment.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
    </div>
    
    <div class="calc-note">
      *Calculation based on ${loanTerm} years at ${interestRate}% interest rate. Actual payments may vary based on credit score, additional fees, and lender terms.
    </div>
  `;
  
  showCalculatorResults(results, 'mortgage');
}

function calculateRentAffordability() {
  const monthlyRent = parseFloat(document.getElementById('calc-monthly-rent').value);
  const monthlyIncome = parseFloat(document.getElementById('calc-income').value);
  const otherExpenses = parseFloat(document.getElementById('calc-expenses').value) || 0;
  
  if (!monthlyRent || monthlyRent <= 0) {
    showCalculatorError('Please enter a valid monthly rent');
    return;
  }
  
  if (!monthlyIncome || monthlyIncome <= 0) {
    showCalculatorError('Please enter your monthly income');
    return;
  }
  
  const rentPercentage = (monthlyRent / monthlyIncome) * 100;
  const disposableIncome = monthlyIncome - monthlyRent - otherExpenses;
  
  let affordabilityStatus, statusText, statusColor, recommendation;
  
  if (rentPercentage <= 30) {
    affordabilityStatus = 'good';
    statusText = 'Within Budget ✓';
    statusColor = '#10b981';
    recommendation = 'This rent is comfortably within the recommended 30% of income.';
  } else if (rentPercentage <= 40) {
    affordabilityStatus = 'moderate';
    statusText = 'Moderate Budget ⚠';
    statusColor = '#f59e0b';
    recommendation = 'This rent exceeds the 30% guideline but may be manageable depending on other expenses.';
  } else {
    affordabilityStatus = 'stressed';
    statusText = 'Above Budget ✗';
    statusColor = '#ef4444';
    recommendation = 'This rent exceeds 40% of income, which may cause financial strain.';
  }
  
  const results = `
    <div class="result-highlight" style="border-left: 4px solid ${statusColor};">
      <div class="result-amount" style="color: ${statusColor};">${rentPercentage.toFixed(1)}%</div>
      <div class="result-label">of your income</div>
    </div>
    
    <div class="result-details">
      <div class="result-item">
        <div class="result-item-label">Monthly Rent</div>
        <div class="result-item-value">₱${monthlyRent.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Monthly Income</div>
        <div class="result-item-value">₱${monthlyIncome.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Disposable Income</div>
        <div class="result-item-value">₱${disposableIncome.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
    </div>
    
    <div class="affordability-status affordability-${affordabilityStatus}">
      ${statusText}
    </div>
    
    <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
      <div style="font-size: 13px; line-height: 1.4; opacity: 0.95;">
        ${recommendation}
      </div>
    </div>
    
    <div class="calc-note">
      *General guideline: Rent should not exceed 30% of your monthly income. Your disposable income after rent and other expenses is ₱${disposableIncome.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}.
    </div>
  `;
  
  showCalculatorResults(results, 'rent');
}

function calculateLeaseCost() {
  const annualRent = parseFloat(document.getElementById('calc-annual-rent').value);
  const leaseTerm = parseInt(document.getElementById('calc-lease-term').value);
  const annualIncrease = parseFloat(document.getElementById('calc-lease-increase').value);
  
  if (!annualRent || annualRent <= 0) {
    showCalculatorError('Please enter a valid annual rent');
    return;
  }
  
  let totalCost = 0;
  let currentRent = annualRent;
  let yearDetails = [];
  
  for (let year = 1; year <= leaseTerm; year++) {
    totalCost += currentRent;
    yearDetails.push({
      year: year,
      rent: currentRent,
      monthly: currentRent / 12
    });
    currentRent *= (1 + annualIncrease / 100);
  }
  
  const avgMonthlyCost = totalCost / leaseTerm / 12;
  const finalMonthlyRent = yearDetails[yearDetails.length - 1].monthly;
  
  const results = `
    <div class="result-highlight">
      <div class="result-amount">₱${totalCost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      <div class="result-label">Total ${leaseTerm}-Year Cost</div>
    </div>
    
    <div class="result-details">
      <div class="result-item">
        <div class="result-item-label">Average Monthly</div>
        <div class="result-item-value">₱${avgMonthlyCost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Final Monthly (Year ${leaseTerm})</div>
        <div class="result-item-value">₱${finalMonthlyRent.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Annual Increase</div>
        <div class="result-item-value">${annualIncrease}%</div>
      </div>
      <div class="result-item">
        <div class="result-item-label">Lease Term</div>
        <div class="result-item-value">${leaseTerm} years</div>
      </div>
    </div>
    
    <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">
        Year-by-Year Breakdown
      </div>
      <div style="max-height: 120px; overflow-y: auto; font-size: 12px;">
        ${yearDetails.map(y => `
          <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <span>Year ${y.year}:</span>
            <span>₱${y.rent.toLocaleString()}/yr (₱${y.monthly.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}/mo)</span>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div class="calc-note">
      *Assumes annual rent increase of ${annualIncrease}%. Final monthly rent in year ${leaseTerm} will be ₱${finalMonthlyRent.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}.
    </div>
  `;
  
  showCalculatorResults(results, 'lease');
}

// Save button functions
function setupSaveButton() {
  const updateSaveUI = (isSaved) => {
    const btn = document.getElementById('saveBtnFloat');
    if (!btn) return;
    btn.classList.toggle('saved', isSaved);
    const icon = btn.querySelector('i');
    if (icon) icon.className = isSaved ? 'fas fa-heart' : 'far fa-heart';
    const text = btn.querySelector('span');
    if (text) text.textContent = isSaved ? 'Saved' : 'Save Property';
  };

  const checkSaved = async () => {
    if (!auth.currentUser) return false;
    const q = query(collection(db, 'savedProperties'), where('userId', '==', auth.currentUser.uid), where('propertyId', '==', propertyId));
    const snap = await getDocs(q);
    return !snap.empty;
  };

  const toggleSave = async () => {
    if (!auth.currentUser) {
      window.location.href = '../login.html?redirect=buyer/new_property_details.html?id=' + propertyId;
      return;
    }
    try {
      const isSaved = await checkSaved();
      if (isSaved) {
        const q = query(collection(db, 'savedProperties'), where('userId', '==', auth.currentUser.uid), where('propertyId', '==', propertyId));
        const snap = await getDocs(q);
        if (!snap.empty) await deleteDoc(snap.docs[0].ref);
        updateSaveUI(false);
        showToast('Removed from saved');
      } else {
        await addDoc(collection(db, 'savedProperties'), { userId: auth.currentUser.uid, propertyId, savedAt: new Date(), createdAt: new Date() });
        updateSaveUI(true);
        showToast('Property saved!');
      }
      if (typeof window.updateSidebarStats === 'function') window.updateSidebarStats();
    } catch (e) {
      showToast('Error saving', true);
    }
  };

  // Initialize
  checkSaved().then(saved => updateSaveUI(saved));
  document.getElementById('saveBtnFloat')?.addEventListener('click', toggleSave);
}

function showToast(msg, isError = false) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;top:20px;right:20px;padding:14px 24px;border-radius:12px;z-index:9999;font-weight:600;background:${isError ? '#ef4444' : '#10b981'};color:white;box-shadow:0 10px 25px rgba(0,0,0,0.2);`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Message modal functions
function formatMessageTime(date) {
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);
  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  if (diffDays < 7) return `${diffDays}d ago`;
  return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function updateMessagingModal(userInfo, property) {

function loadMessages(conversationId, brokerId) {
  const messagesContainer = document.getElementById('messagesContainer');
  if (messageListener) { messageListener(); messageListener = null; }
  messagesContainer.innerHTML = '<div class="loading-messages"><div class="spinner"></div><p>Loading messages...</p></div>';
  try {
    const messagesQuery = query(collection(db, 'messages'), where('conversationId', '==', conversationId), orderBy('timestamp', 'asc'));
    messageListener = onSnapshot(messagesQuery,
      (snapshot) => {
        messagesContainer.innerHTML = '';
        if (snapshot.empty) {
          messagesContainer.innerHTML = '<div class="no-messages"><div style="font-size:48px;margin-bottom:16px;">💬</div><h3>No messages yet</h3><p>Start the conversation by sending a message below.</p></div>';
          return;
        }
        const currentUser = auth.currentUser;
        snapshot.forEach((d) => {
          const msg = d.data();
          const isSent = msg.senderId === currentUser.uid;
          const el = document.createElement('div');
          el.className = `message-bubble ${isSent ? 'sent' : 'received'}`;
          let ts = 'Just now';
          if (msg.timestamp) {
            const d = msg.timestamp.toDate ? msg.timestamp.toDate() : new Date();
            ts = formatMessageTime(d);
          }
          el.innerHTML = `<div class="message-bubble-content"><div>${(msg.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div><span class="message-time">${ts}</span></div>`;
          messagesContainer.appendChild(el);
        });
        setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 100);
      },
      (err) => {
        console.error(err);
        messagesContainer.innerHTML = '<div class="no-messages"><div style="font-size:48px;margin-bottom:16px;">💬</div><h3>Ready to chat</h3><p>Send your first message below.</p></div>';
      }
    );
  } catch (e) {
    console.error(e);
    messagesContainer.innerHTML = '<div class="no-messages"><div style="font-size:48px;margin-bottom:16px;">💬</div><h3>Ready to chat</h3><p>Send your first message below.</p></div>';
  }
}

async function sendMessage() {
  const messageInput = document.getElementById('messageInput');
  const text = messageInput.value.trim();
  const sendBtn = document.getElementById('sendMessageBtn');
  if (!text) { messageInput.focus(); return; }
  if (!currentListing?.id && !currentListing?.title) {
    alert('Property information is unavailable. Please close this modal and try again from the property page.');
    return;
  }
  if (!currentConversationId || !auth.currentUser) {
    alert('Unable to send message. Please refresh and try again.');
    return;
  }
  const parts = currentConversationId.split('_');
  const brokerId = parts.find(id => id !== auth.currentUser.uid);
  if (!brokerId) { alert('Unable to identify recipient.'); return; }
  const origHtml = sendBtn.innerHTML;
  sendBtn.innerHTML = '<div class="spinner" style="border:2px solid rgba(255,255,255,0.3);border-top:2px solid white;width:16px;height:16px;border-radius:50%;animation:spin 0.8s linear infinite;"></div>';
  sendBtn.disabled = true;
  messageInput.disabled = true;
  try {
    const convRef = doc(db, 'conversations', currentConversationId);
    const convSnap = await getDoc(convRef);
    await setDoc(convRef, {
      participants: [auth.currentUser.uid, brokerId],
      lastMessage: text.substring(0, 100),
      lastMessageTime: serverTimestamp(),
      lastSenderId: auth.currentUser.uid,
      unreadCount: { [brokerId]: (convSnap.exists() ? (convSnap.data().unreadCount?.[brokerId] || 0) + 1 : 1) },
      buyerId: auth.currentUser.uid,
      brokerId,
      propertyId: currentListing?.id || null,
      propertyTitle: currentListing?.title || null,
      buyerName: auth.currentUser.displayName || auth.currentUser.email,
      createdAt: convSnap.exists() ? convSnap.data().createdAt : serverTimestamp(),
      updatedAt: serverTimestamp()
    }, { merge: true });
    await addDoc(collection(db, 'messages'), {
      conversationId: currentConversationId,
      senderId: auth.currentUser.uid,
      receiverId: brokerId,
      text,
      timestamp: serverTimestamp(),
      read: false,
      type: 'text',
      propertyId: currentListing?.id || null,
      senderName: auth.currentUser.displayName || auth.currentUser.email
    });
    messageInput.value = '';
    messageInput.disabled = false;
    sendBtn.innerHTML = '✓ Sent';
    sendBtn.style.background = '#10b981';
    setTimeout(() => { sendBtn.innerHTML = origHtml; sendBtn.style.background = ''; sendBtn.disabled = false; }, 1500);
    setTimeout(() => { document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight; }, 100);
  } catch (e) {
    console.error(e);
    sendBtn.innerHTML = origHtml;
    sendBtn.disabled = false;
    messageInput.disabled = false;
    alert('Failed to send message. Please try again.');
  }
}

function closeMessageModal() {
  const modal = document.getElementById('messageModal');
  modal.classList.remove('show');
  document.body.style.overflow = 'auto';
  if (messageListener) { messageListener(); messageListener = null; }
  currentConversationId = null;
  document.getElementById('messageInput').value = '';
}

async function openMessageModal(userId, propId) {
  const currentUser = auth.currentUser;
  if (!currentUser) {
    window.location.href = '../login.html?redirect=buyer/new_property_details.html?id=' + propertyId;
    return;
  }
  let userInfo = currentUserInfo;
  if (userInfo?.displayName && userId === currentListing?.userId) {
    userInfo = { ...userInfo, email: userInfo.email || 'Not provided', phone: userInfo.phone || 'Not provided' };
  } else {
    userInfo = await loadUserInfo(userId);
  }
  currentConversationId = [currentUser.uid, userId].sort().join('_');
  updateMessagingModal(userInfo, currentListing);
  document.getElementById('messageModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  loadMessages(currentConversationId, userId);
  setTimeout(() => document.getElementById('messageInput').focus(), 300);
}

// window.contactBroker is kept for backward compatibility but we'll use handleContactClick for the button
window.contactBroker = openMessageModal;

document.getElementById('backBtn').addEventListener('click', function(e) {
  e.preventDefault();
  if (window.history.length > 1) {
    window.history.back();
  } else if (document.referrer && document.referrer.includes(window.location.hostname)) {
    window.location.href = document.referrer;
  } else {
    window.location.href = 'buyer_dashboard.html';
  }
});
document.getElementById('closeMessageModal').addEventListener('click', closeMessageModal);
document.getElementById('messageModal').addEventListener('click', (e) => { if (e.target.id === 'messageModal') closeMessageModal(); });
document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
document.getElementById('messageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
// BahAI suggestion chips: click to fill message input
document.getElementById('messageBahaiSuggestions').addEventListener('click', (e) => {
  const chip = e.target.closest('.message-bahai-chip');
  if (!chip) return;
  const msg = chip.getAttribute('data-msg');
  if (msg) { document.getElementById('messageInput').value = msg; document.getElementById('messageInput').focus(); }
});

onAuthStateChanged(auth, (user) => {
  if (typeof window.updateBuyerNavAuth === 'function') window.updateBuyerNavAuth(user);
  if (propertyId && !propertyLoadStarted) {
    propertyLoadStarted = true;
    loadProperty();
  }
});

if (propertyId && !propertyLoadStarted) {
  propertyLoadStarted = true;
  loadProperty();
}
</script>

loadBuyerSidebar('new_property_details.html');
