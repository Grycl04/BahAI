<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Properties - BahAI Real Estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #0b2e52;
            --primary-dark: #071e38;
            --primary-light: #1e3a5f;
            --secondary: #d4af37;
            --accent: #d4af37;
            --accent-dark: #b8860b;
            --text-dark: #1a202c;
            --text-light: #718096;
            --bg-light: #f1f5f9;
            --bg-white: #ffffff;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --card-hover-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --border-radius-sm: 12px;
            --rent-color: #10b981;
            --sale-color: #3b82f6;
            --lease-color: #10b981;
            --danger: #ef4444;
            --success: #059669;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f1f5f9;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: var(--border-radius-sm);
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
        }
        @media (max-width: 1024px) {
            .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
        }

        .container {
            flex: 1;
            margin-left: 0;
            padding-top: 150px;
            max-width: 100%;
            padding: 30px;
            transition: margin-left 0.3s ease;
        }
        @media (max-width: 1024px) {
            .container { margin-left: 0; }
        }

        /* Hero Section - matches buyer dashboard */
        .hero-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: var(--border-radius);
            padding: 50px 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="white"/></svg>');
            background-size: cover;
            opacity: 0.1;
        }
        .hero-section h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
            position: relative;
            z-index: 1;
        }
        .hero-section p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .hero-stats {
            display: flex;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }
        .hero-stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hero-stat-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #d4af37;
        }
        .hero-stat-value { font-size: 1.5rem; font-weight: 700; }
        .hero-stat-label { font-size: 0.9rem; opacity: 0.85; }
        .recommendation-note {
            background: rgba(212, 175, 55, 0.15);
            padding: 20px;
            border-radius: var(--border-radius-sm);
            border-left: 4px solid var(--accent);
            max-width: 420px;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }
        .recommendation-note strong {
            color: #d4af37;
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .recommendation-note span { opacity: 0.95; }

        /* Page header: clear purpose for saved properties (margin-top clears fixed nav) */
        .saved-page-header {
            margin-top: 36px;
            margin-bottom: 28px;
        }
        .saved-page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .saved-page-header p {
            font-size: 1rem;
            color: var(--text-light);
            margin: 0;
        }


        /* Stats Section */
        .liked-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-white);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Listings Grid - match buyer_dashboard */
        .listing-card-wrapper { transition: all 0.3s ease; }
        .listing-card-wrapper:hover { transform: translateY(-5px); }
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .listing-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .listing-card:hover { box-shadow: var(--card-hover-shadow); }

        .card-link-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            cursor: pointer;
        }

        .listing-card-image-container {
            position: relative;
            height: 220px;
            overflow: hidden;
        }
        .listing-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .listing-card:hover .listing-image { transform: scale(1.05); }

        .listing-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            z-index: 2;
        }
        .listing-type-badge.type-rent,
        .listing-type-badge.rent,
        .listing-type-badge.type-lease,
        .listing-type-badge.lease { background: #10b981; }
        .listing-type-badge.type-sale,
        .listing-type-badge.sale { background: #3b82f6; }

        /* Recommended by BahAI badge */
        .listing-bahai-badge {
            position: absolute;
            top: 15px;
            right: 55px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            z-index: 2;
        }

        .remove-saved-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: auto;
            height: auto;
            padding: 0;
            border-radius: 0;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            box-shadow: none;
            transition: transform 0.2s ease;
        }
        .remove-saved-btn .save-icon {
            color: #d4af37;
            line-height: 1;
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
            transition: color 0.2s ease, filter 0.2s ease;
        }
        .remove-saved-btn:hover { transform: scale(1.08); }
        .remove-saved-btn:hover .save-icon {
            color: #b8860b;
            filter: drop-shadow(0 2px 5px rgba(184, 134, 11, 0.38));
        }

        .listing-content { padding: 18px; }
        .listing-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 15px;
        }
        .listing-header > div:first-child { flex: 1; min-width: 0; overflow: hidden; }
        .listing-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            max-height: 3.6em;
        }
        .listing-location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-light);
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .listing-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            white-space: normal !important;
            word-break: break-word;
            text-align: right;
            min-width: fit-content;
            flex-shrink: 0;
            max-width: 45%;
        }
        .price-rent { color: var(--primary-dark); }
        .price-sale { color: var(--primary-dark); }
        .price-lease { color: var(--primary-dark); }

        .listing-details {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        .detail {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-light);
            font-size: 0.9rem;
            flex: 1 1 0;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .detail i { flex-shrink: 0; }

        .listing-broker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }
        .broker-avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .broker-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .broker-info { flex: 1; }
        .broker-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .broker-contact {
            font-size: 0.8rem;
            color: var(--text-light);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .listing-status {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 12px;
        }
        .listing-status.status-active,
        .status-active { background: #10b981 !important; color: white !important; }
        .listing-status.status-pending,
        .status-pending { background: var(--accent) !important; color: white !important; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--bg-white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--accent);
            opacity: 0.6;
        }

        .empty-state h2 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-light);
            margin-bottom: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        /* Next actions section: Compare & Ask BahAI */
        .next-actions-section {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 24px 28px;
            margin-bottom: 32px;
            box-shadow: var(--card-shadow);
        }
        .next-actions-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 16px;
        }
        .next-actions-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .next-action-btn {
            padding: 12px 20px;
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: 2px solid rgba(212,175,55,0.4);
            background: rgba(212,175,55,0.08);
            color: var(--primary);
        }
        .next-action-btn:hover {
            background: rgba(212,175,55,0.18);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .browse-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(11, 46, 82, 0.35);
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            border: 4px solid var(--bg-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Similar Properties Section */
        .similar-properties {
            background: var(--bg-white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--accent); margin-right: 4px; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-white);
            border-radius: var(--border-radius);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease;
            box-sizing: border-box;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 30px 40px;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .modal-title-section h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: white;
            line-height: 1.3;
        }

        .modal-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .modal-price-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .modal-price {
            font-size: 32px;
            font-weight: 700;
            color: white;
        }

        .modal-status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 30px 40px;
        }

        .modal-image-gallery {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .main-modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
        }

        .modal-thumbnails {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-thumbnail {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .modal-thumbnail:hover,
        .modal-thumbnail.active {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .modal-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .detail-label {
            color: var(--text-light);
            font-size: 14px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }

        .amenities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .amenity-tag {
            background: var(--bg-light);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-dark);
            border: 1px solid var(--border);
        }

        .modal-description {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        /* BahAI floating button - matches dashboard/search */
        .bahai-assistant {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 900;
        }
        .bahai-assistant-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            box-shadow: var(--shadow-lg);
            transition: all 0.2s;
            border: 2px solid rgba(212,175,55,0.5);
        }
        .bahai-assistant-btn:hover {
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .bahai-assistant { bottom: 16px; right: 16px; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar (loaded by script) -->
    <div id="sidebar-container"></div>

    <div class="container">
        <!-- Page header: clear purpose -->
        <header class="saved-page-header">
            <h1>Saved Properties</h1>
            <p>Properties you're interested in — curated by you and BahAI</p>
        </header>

        <!-- Saved Properties Grid -->
        <div class="listings-grid" id="likedPropertiesContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading your liked properties...</p>
            </div>
        </div>

        <!-- Similar Properties Section -->
        <div class="similar-properties" id="similarSuggestions" style="display: none;">
            <h2 class="section-title"><i class="fas fa-search"></i> Similar Properties You Might Like</h2>
            <div class="listings-grid" id="similarPropertiesContainer">
                <!-- Similar properties will be loaded here -->
            </div>
        </div>
    </div>

    <!-- BahAI floating assistant - matches dashboard -->
    <div class="bahai-assistant" aria-label="BahAI quick access">
        <a href="buyer_dashboard.html#ai-chatbot-section" class="bahai-assistant-btn" id="bahaiAssistantBtn">
            <i class="fas fa-robot"></i>
            <span>Ask BahAI</span>
        </a>
    </div>

    <!-- Modal for Property Details -->
    <div class="modal-overlay" id="propertyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-section">
                    <h2 id="modalTitle">Property Details</h2>
                    <div class="modal-subtitle">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="modalLocation">Loading location...</span>
                    </div>
                </div>
                <div class="modal-price-section">
                    <div class="modal-price" id="modalPrice">₱0</div>
                    <div class="modal-status" id="modalStatus">Active</div>
                </div>
                <button class="close-modal" id="closeModal" aria-label="Close"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-body" id="modalBody">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            getDoc,
            doc,
            deleteDoc,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        // Firebase Configuration (same as your dashboard)
        const firebaseConfig = {
            apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
            authDomain: "bahai-1b76d.firebaseapp.com",
            projectId: "bahai-1b76d",
            storageBucket: "bahai-1b76d.firebasestorage.app",
            messagingSenderId: "646878644941",
            appId: "1:646878644941:web:5b4ccc3412250337587784"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDB = db;

        window.performLogout = async function() {
            try {
                await signOut(auth);
                localStorage.removeItem('userData');
                sessionStorage.removeItem('userData');
                window.location.href = '../login.html';
            } catch (e) {
                console.error('Logout error:', e);
                window.location.href = '../login.html';
            }
        };

        // Global variables
        let userSavedProperties = [];
        let userMap = new Map();
        let allProperties = [];
        let currentModalProperty = null;

        // Helper functions for listing types (same as dashboard)
        function getListingType(listing) {
            if (listing.listingType === 'lease' || listing.type === 'lease') return 'lease';
            if (listing.listingType === 'rent' || listing.type === 'rent') return 'rent';
            if (listing.listingType === 'sale' || listing.type === 'sale') return 'sale';
            if (listing.monthlyRent !== undefined && listing.monthlyRent !== null && listing.monthlyRent > 0) return 'rent';
            if (listing.annualRent !== undefined && listing.annualRent !== null && listing.annualRent > 0) return 'lease';
            if ((listing.pricing !== undefined && listing.pricing !== null && listing.pricing > 0) ||
                (listing.salePrice !== undefined && listing.salePrice !== null && listing.salePrice > 0)) return 'sale';
            return 'sale';
        }

        function getDisplayPrice(listing) {
            const type = getListingType(listing);
            switch (type) {
                case 'rent': return `₱${(listing.monthlyRent || 0).toLocaleString()}/month`;
                case 'lease': return `₱${(listing.annualRent || 0).toLocaleString()}/year`;
                case 'sale': default: return `₱${(listing.pricing || listing.salePrice || 0).toLocaleString()}`;
            }
        }

        function getPriceClass(listing) {
            const type = getListingType(listing);
            switch (type) {
                case 'rent': return 'price-rent';
                case 'lease': return 'price-lease';
                case 'sale': default: return 'price-sale';
            }
        }

        function getTypeBadgeClass(listing) {
            const type = getListingType(listing);
            switch (type) {
                case 'rent': return 'type-rent';
                case 'lease': return 'type-lease';
                case 'sale': default: return 'type-sale';
            }
        }

        function getTypeBadgeText(listing) {
            const type = getListingType(listing);
            switch (type) {
                case 'rent': return 'FOR RENT';
                case 'lease': return 'FOR LEASE';
                case 'sale': default: return 'FOR SALE';
            }
        }

        // Toast notification function (Moved to global scope)
        window.showToast = function(message, type = 'success') {
            // Remove existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Authentication check
        onAuthStateChanged(auth, async (user) => {
            if (typeof window.updateBuyerNavAuth === 'function') window.updateBuyerNavAuth(user);
            if (!user) {
                window.location.href = "../login.html?redirect=" + encodeURIComponent(window.location.pathname || "buyer/liked_properties.html");
                return;
            }
            
            console.log('User authenticated:', user.uid);
            await loadLikedProperties(user.uid);
        });

        // Main function to load liked properties
        async function loadLikedProperties(userId) {
            const container = document.getElementById('likedPropertiesContainer');
            
            try {
                console.log('Loading saved properties for user:', userId);
                
                // Try the ordered query first
                let savedQuery;
                try {
                    savedQuery = query(
                        collection(db, "savedProperties"),
                        where("userId", "==", userId),
                        orderBy("savedAt", "desc")
                    );
                } catch (indexError) {
                    console.log('Index not ready, using unordered query:', indexError);
                    // Fallback to unordered query
                    savedQuery = query(
                        collection(db, "savedProperties"),
                        where("userId", "==", userId)
                    );
                }
                
                const savedSnapshot = await getDocs(savedQuery);
                
                if (savedSnapshot.empty) {
                    showEmptyState();
                    updateStats([]);
                    return;
                }
                
                console.log('Saved docs found:', savedSnapshot.docs.length);
                savedSnapshot.forEach((doc, index) => {
                    console.log(`Doc ${index}:`, doc.id, doc.data());
                });
                
                const propertyPromises = [];
                const savedDocsMap = new Map();
                
                savedSnapshot.forEach((savedDoc) => {
                    const savedData = savedDoc.data();
                    console.log('Processing saved data:', savedData);
                    
                    if (savedData.propertyId) {
                        savedDocsMap.set(savedData.propertyId, savedDoc.id);
                        
                        propertyPromises.push(
                            getDoc(doc(db, "properties", savedData.propertyId))
                                .then(propertyDoc => {
                                    if (propertyDoc.exists()) {
                                        const propData = propertyDoc.data();
                                        return {
                                            property: {
                                                id: propertyDoc.id,
                                                savedId: savedDoc.id,
                                                ...propData,
                                                source: savedData.source,
                                                aiRecommended: savedData.aiRecommended === true || savedData.source === 'ai'
                                            },
                                            savedAt: savedData.savedAt
                                        };
                                    } else {
                                        console.warn(`Property ${savedData.propertyId} not found`);
                                        return null;
                                    }
                                })
                                .catch(error => {
                                    console.error(`Error fetching property ${savedData.propertyId}:`, error);
                                    return null;
                                })
                        );
                    } else {
                        console.warn('Saved document missing propertyId:', savedDoc.id);
                    }
                });
                
                console.log('Property promises created:', propertyPromises.length);
                
                if (propertyPromises.length === 0) {
                    console.log('No valid property promises to process');
                    showEmptyState();
                    updateStats([]);
                    return;
                }
                
                let propertyResults;
                try {
                    propertyResults = await Promise.all(propertyPromises);
                    console.log('Property results received:', propertyResults);
                } catch (error) {
                    console.error('Error in Promise.all:', error);
                    propertyResults = [];
                }
                
                if (!propertyResults || !Array.isArray(propertyResults)) {
                    console.error('propertyResults is not an array:', propertyResults);
                    propertyResults = [];
                }
                
                userSavedProperties = propertyResults
                    .filter(result => result !== null && result.property !== null)
                    .map(result => result.property);
                
                console.log(`Found ${userSavedProperties.length} liked properties`);
                
                if (!savedQuery._query || !savedQuery._query.orderBy || savedQuery._query.orderBy.length === 0) {
                    userSavedProperties.sort((a, b) => {
                        const dateA = a.savedAt?.toDate ? a.savedAt.toDate() : new Date(a.savedAt);
                        const dateB = b.savedAt?.toDate ? b.savedAt.toDate() : new Date(b.savedAt);
                        return dateB - dateA;
                    });
                }
                
                if (userSavedProperties.length > 0) {
                    const userIds = new Set(userSavedProperties.map(p => p.userId));
                    for (const userId of userIds) {
                        await loadUserData(userId);
                    }
                    
                    displayLikedProperties(userSavedProperties);
                    updateStats(userSavedProperties);
                    await loadSimilarProperties(userSavedProperties);
                } else {
                    showEmptyState();
                    updateStats([]);
                }
                
            } catch (error) {
                console.error("Error loading liked properties:", error);
                
                if (error.message && error.message.includes("requires an index")) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="fas fa-cog"></i></div>
                            <h2>Database Index Required</h2>
                            <p>Please create a Firestore index for your saved properties.</p>
                            <p style="font-size: 12px; background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; margin: 15px 0;">
                                <strong>Quick fix:</strong><br>
                                1. Go to Firebase Console<br>
                                2. Click the Firestore Database<br>
                                3. Go to Indexes tab<br>
                                4. Create composite index for "savedProperties" collection<br>
                                Fields: userId (Asc), savedAt (Desc)
                            </p>
                            <a href="buyer_dashboard.html" class="browse-btn"><i class="fas fa-arrow-left"></i> Return to Dashboard</a>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                            <h2>Error Loading Properties</h2>
                            <p>There was an error loading your liked properties. Please try again.</p>
                            <pre style="text-align: left; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; font-size: 12px; max-width: 100%; overflow: auto;">
${error.stack || error.message}
                            </pre>
                            <button class="browse-btn" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> Retry</button>
                        </div>
                    `;
                }
            }
        }

        // Load user data (broker/owner info)
        async function loadUserData(userId) {
            if (userMap.has(userId)) return;
            
            try {
                const userDoc = await getDoc(doc(db, "users", userId));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    userMap.set(userId, {
                        displayName: userData.fullName || userData.email?.split('@')[0] || `User ${userId.substring(0, 8)}`,
                        email: userData.email || 'Email not available',
                        phone: userData.phone || 'Phone not available',
                        role: userData.role || 'user',
                        photoURL: userData.photoURL || userData.profilePhotoURL || null
                    });
                    return;
                }
                
                const brokerDoc = await getDoc(doc(db, "brokers", userId));
                if (brokerDoc.exists()) {
                    const brokerData = brokerDoc.data();
                    userMap.set(userId, {
                        displayName: brokerData.fullName || `Broker ${userId.substring(0, 8)}`,
                        email: brokerData.email || 'Email not available',
                        phone: brokerData.phone || 'Phone not available',
                        role: brokerData.role || 'broker',
                        photoURL: brokerData.photoURL || brokerData.profilePhoto || brokerData.profileImage || null
                    });
                    return;
                }
                
                userMap.set(userId, {
                    displayName: `User ${userId.substring(0, 8)}`,
                    email: 'Email not available',
                    phone: 'Phone not available',
                    role: 'user',
                    photoURL: null
                });
                
            } catch (error) {
                console.error(`Error loading user ${userId}:`, error);
                userMap.set(userId, {
                    displayName: `User ${userId.substring(0, 8)}`,
                    email: 'Email not available',
                    phone: 'Phone not available',
                    role: 'user',
                    photoURL: null
                });
            }
        }

        function getRoleDisplayText(role) {
            const roleMap = { 'landlord': 'Property Owner', 'seller': 'Property Seller', 'broker': 'Licensed Broker', 'agent': 'Property Agent', 'admin': 'Administrator' };
            return roleMap[role] || 'Posted by';
        }

        // Display liked properties with decision-focused cards (same design as buyer_dashboard)
        function displayLikedProperties(properties) {
            const container = document.getElementById('likedPropertiesContainer');
            
            if (!properties || properties.length === 0) {
                showEmptyState();
                return;
            }
            
            container.innerHTML = properties.map(property => {
                const userInfo = userMap.get(property.userId) || {
                    displayName: `User ${property.userId ? property.userId.substring(0, 8) : 'Unknown'}`,
                    email: 'N/A',
                    phone: 'N/A',
                    role: 'user'
                };
                
                const userInitials = userInfo.displayName.split(' ').map(n => n[0]).join('').toUpperCase() || 'UU';
                const listingType = getListingType(property);
                const displayPrice = getDisplayPrice(property);
                const priceClass = getPriceClass(property);
                const typeBadgeClass = getTypeBadgeClass(property);
                const typeBadgeText = getTypeBadgeText(property);
                const showBahaiBadge = property.aiRecommended === true || property.source === 'ai';
                
                let mainPhoto;
                if (property.photos && property.photos.length > 0) {
                    mainPhoto = property.photos[0];
                } else if (property.imageUrls && property.imageUrls.length > 0) {
                    mainPhoto = property.imageUrls[0];
                } else {
                    mainPhoto = 'https://via.placeholder.com/400x220/0b2e52/white?text=No+Image';
                }
                
                const bedrooms = property.bedrooms ?? 0;
                const bathrooms = property.bathrooms || 0;
                const area = property.floorArea || property.totalArea || 'N/A';

                const title = property.title || 'Untitled Property';
                const truncatedTitle = title.length > 50 ? title.substring(0, 50) + '...' : title;
                const locationDisplay = property.location || property.address || 'Location not specified';
                const truncatedAddress = locationDisplay.length > 40 ? locationDisplay.substring(0, 40) + '...' : locationDisplay;
                const brokerName = userInfo.displayName;
                const truncatedBrokerName = brokerName.length > 20 ? brokerName.substring(0, 20) + '...' : brokerName;

                const brokerAvatarHtml = userInfo.photoURL
                    ? `<img src="${userInfo.photoURL}" alt="${(userInfo.displayName || '').replace(/"/g, '&quot;')}" onerror="var p=this.parentElement;p.innerHTML=p.getAttribute('data-fallback')||'U'">`
                    : userInitials;
                const brokerAvatarWrapper = userInfo.photoURL
                    ? `<div class="broker-avatar" data-fallback="${(userInitials || 'U').replace(/"/g, '&quot;')}" aria-label="Broker avatar">${brokerAvatarHtml}</div>`
                    : `<div class="broker-avatar" aria-label="Broker avatar">${userInitials}</div>`;

                let statusText = property.status || 'available';
                let statusClass = 'status-active';
                let showStatus = true;
                if (statusText.toLowerCase() === 'active' || statusText.toLowerCase() === 'available' || statusText.toLowerCase() === 'published') {
                    statusText = '';
                    statusClass = '';
                    showStatus = false;
                } else if (statusText.toLowerCase() === 'pending') {
                    statusClass = 'status-pending';
                }

                return `
<div class="listing-card-wrapper">
    <div class="listing-card" data-listing-id="${property.id}">
        <a href="new_property_details.html?id=${property.id}" class="card-link-overlay" aria-label="View ${title.replace(/"/g, '&quot;')}"></a>
        <div class="listing-card-image-container">
            <button type="button" class="remove-saved-btn" onclick="event.preventDefault();event.stopPropagation();window.removeFromLiked('${property.savedId}', '${property.id}')" title="Remove from saved" aria-label="Remove from saved">
                <i class="fas fa-heart save-icon" aria-hidden="true"></i>
            </button>
            <img src="${mainPhoto}" alt="${(property.title || 'Property').replace(/"/g, '&quot;')}" class="listing-image">
            <div class="listing-type-badge ${typeBadgeClass}">${typeBadgeText}</div>
            ${showBahaiBadge ? '<span class="listing-bahai-badge">Recommended by BahAI</span>' : ''}
        </div>
        <div class="listing-content">
            <div class="listing-header">
                <div style="flex: 1; min-width: 0;">
                    <h3 class="listing-title" title="${title.replace(/"/g, '&quot;')}">${truncatedTitle.replace(/"/g, '&quot;')}</h3>
                </div>
                <div class="listing-price ${priceClass}">${displayPrice}</div>
            </div>
            <div class="listing-location">
                <i class="fas fa-map-marker-alt" style="flex-shrink: 0;"></i>
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${locationDisplay.replace(/"/g, '&quot;')}">${truncatedAddress.replace(/"/g, '&quot;')}</span>
            </div>
            <div class="listing-details">
                <div class="detail"><i class="fas fa-bed"></i> ${bedrooms}<span class="detail-unit">${bedrooms === 'Studio' ? '' : ' beds'}</span></div>
                <div class="detail"><i class="fas fa-bath"></i> ${bathrooms}<span class="detail-unit"> baths</span></div>
                <div class="detail"><i class="fas fa-ruler-combined"></i> ${area}<span class="detail-unit"> sqm</span></div>
            </div>
            <div class="listing-broker">
                ${brokerAvatarWrapper}
                <div class="broker-info">
                    <div class="broker-name" title="${brokerName.replace(/"/g, '&quot;')}">${truncatedBrokerName.replace(/"/g, '&quot;')}</div>
                    <div class="broker-contact">${getRoleDisplayText(userInfo.role)} · ${property.propertyType || 'Property'}</div>
                </div>
            </div>
            ${showStatus ? `<div class="listing-status ${statusClass}">${statusText}</div>` : ''}
        </div>
    </div>
</div>
                `;
            }).join('');
        }

        // Show property modal with full details
        window.showPropertyModal = async function(propertyId) {
            console.log('Opening modal for property:', propertyId);
            
            let property = userSavedProperties.find(p => p.id === propertyId);
            
            if (!property) {
                console.log('Property not in liked list, checking all properties...');
                property = allProperties.find(p => p.id === propertyId);
            }
            
            if (!property) {
                console.log('Property not in cache, fetching from Firestore...');
                try {
                    const propertyDoc = await getDoc(doc(db, "properties", propertyId));
                    if (propertyDoc.exists()) {
                        property = {
                            id: propertyDoc.id,
                            ...propertyDoc.data()
                        };
                        
                        if (!allProperties.find(p => p.id === propertyId)) {
                            allProperties.push(property);
                        }
                        
                        if (property.userId && !userMap.has(property.userId)) {
                            await loadUserData(property.userId);
                        }
                    }
                } catch (error) {
                    console.error('Error fetching property from Firestore:', error);
                }
            }
            
            if (!property) {
                console.error('Property not found:', propertyId);
                showToast('Property not found or has been removed', 'error');
                return;
            }
            
            currentModalProperty = property;
            const userInfo = userMap.get(property.userId) || {
                displayName: `User ${property.userId ? property.userId.substring(0, 8) : 'Unknown'}`,
                email: 'N/A',
                phone: 'N/A',
                role: 'user'
            };
            
            const listingType = getListingType(property);
            const displayPrice = getDisplayPrice(property);
            const typeBadgeText = getTypeBadgeText(property);
            
            document.getElementById('modalTitle').textContent = property.title || 'Untitled Property';
            document.getElementById('modalLocation').textContent = property.location || 'Location not specified';
            document.getElementById('modalPrice').textContent = displayPrice;
            document.getElementById('modalStatus').textContent = typeBadgeText;
            document.getElementById('modalStatus').style.background = 
                listingType === 'rent' ? 'var(--rent-color)' : 
                listingType === 'lease' ? 'var(--lease-color)' : 
                'var(--sale-color)';
            
            const photos = property.photos || property.imageUrls || [];
            const mainPhoto = photos.length > 0 ? photos[0] : 
                            'https://via.placeholder.com/800x400/0b2e52/white?text=No+Image';
            
            const bedrooms = property.bedrooms || (listingType === 'rent' && property.propertyType === 'studio' ? 'Studio' : 0);
            const bathrooms = property.bathrooms || 0;
            const squareFootage = property.floorArea || property.totalArea || property.squareFootage || 'N/A';
            
            let pricingDetails = '';
            if (listingType === 'rent') {
                pricingDetails = `
                    <div class="detail-row">
                        <span class="detail-label">Monthly Rent:</span>
                        <span class="detail-value" style="color: var(--rent-color);">₱${(property.monthlyRent || 0).toLocaleString()}</span>
                    </div>
                    ${property.securityDeposit ? `
                    <div class="detail-row">
                        <span class="detail-label">Security Deposit:</span>
                        <span class="detail-value">₱${property.securityDeposit.toLocaleString()}</span>
                    </div>
                    ` : ''}
                    ${property.minimumStay ? `
                    <div class="detail-row">
                        <span class="detail-label">Minimum Stay:</span>
                        <span class="detail-value">${property.minimumStay} month(s)</span>
                    </div>
                    ` : ''}
                `;
            } else if (listingType === 'lease') {
                pricingDetails = `
                    <div class="detail-row">
                        <span class="detail-label">Annual Rent:</span>
                        <span class="detail-value" style="color: var(--lease-color);">₱${(property.annualRent || 0).toLocaleString()}</span>
                    </div>
                    ${property.securityBond ? `
                    <div class="detail-row">
                        <span class="detail-label">Security Bond:</span>
                        <span class="detail-value">₱${property.securityBond.toLocaleString()}</span>
                    </div>
                    ` : ''}
                    ${property.leaseDuration ? `
                    <div class="detail-row">
                        <span class="detail-label">Lease Duration:</span>
                        <span class="detail-value">${property.leaseDuration} year(s)</span>
                    </div>
                    ` : ''}
                `;
            } else {
                pricingDetails = `
                    <div class="detail-row">
                        <span class="detail-label">Sale Price:</span>
                        <span class="detail-value" style="color: var(--sale-color);">₱${(property.pricing || property.salePrice || 0).toLocaleString()}</span>
                    </div>
                `;
            }
            
            let amenitiesHtml = '';
            if (property.amenities && property.amenities.length > 0) {
                amenitiesHtml = `
                    <div class="amenities-list">
                        ${property.amenities.map(amenity => `
                            <span class="amenity-tag">${amenity}</span>
                        `).join('')}
                    </div>
                `;
            } else {
                amenitiesHtml = '<p style="color: var(--text-light); font-style: italic;">No amenities listed</p>';
            }
            
            let thumbnailsHtml = '';
            if (photos.length > 1) {
                thumbnailsHtml = photos.map((photo, index) => `
                    <img src="${photo}" 
                         class="modal-thumbnail ${index === 0 ? 'active' : ''}" 
                         onclick="window.changeModalImage('${photo}', this)"
                         alt="Property image ${index + 1}">
                `).join('');
            }
            
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-image-gallery">
                    <img src="${mainPhoto}" id="mainModalImage" class="main-modal-image" 
                         onclick="window.openFullscreenImage('${mainPhoto}')">
                    ${photos.length > 1 ? `
                    <div class="modal-thumbnails">
                        ${thumbnailsHtml}
                    </div>
                    ` : ''}
                </div>
                
                <div class="modal-description">
                    <p>${property.description || 'No description available for this property.'}</p>
                </div>
                
                <div class="modal-details-grid">
                    <div class="modal-section">
                        <h3>📋 Property Details</h3>
                        <div class="detail-row">
                            <span class="detail-label">Property Type:</span>
                            <span class="detail-value">${property.propertyType || 'Not specified'}</span>
                        </div>
                        ${property.propertyCategory ? `
                        <div class="detail-row">
                            <span class="detail-label">Category:</span>
                            <span class="detail-value">${property.propertyCategory}</span>
                        </div>
                        ` : ''}
                        <div class="detail-row">
                            <span class="detail-label">Bedrooms:</span>
                            <span class="detail-value">${bedrooms} ${bedrooms === 'Studio' ? '' : 'beds'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Bathrooms:</span>
                            <span class="detail-value">${bathrooms} baths</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Area:</span>
                            <span class="detail-value">${squareFootage} sqm</span>
                        </div>
                    </div>
                    
                    <div class="modal-section">
                        <h3>💰 Pricing Details</h3>
                        ${pricingDetails}
                    </div>
                </div>
                
                <div class="modal-section">
                    <h3>🎯 Amenities</h3>
                    ${amenitiesHtml}
                </div>
                
                ${property.leaseType || property.renewalOption || property.paymentTerms ? `
                <div class="modal-section">
                    <h3>📝 Lease Terms</h3>
                    ${property.leaseType ? `
                    <div class="detail-row">
                        <span class="detail-label">Lease Type:</span>
                        <span class="detail-value">${property.leaseType}</span>
                    </div>
                    ` : ''}
                    ${property.renewalOption ? `
                    <div class="detail-row">
                        <span class="detail-label">Renewal Option:</span>
                        <span class="detail-value">${property.renewalOption}</span>
                    </div>
                    ` : ''}
                    ${property.paymentTerms ? `
                    <div class="detail-row">
                        <span class="detail-label">Payment Terms:</span>
                        <span class="detail-value">${property.paymentTerms}</span>
                    </div>
                    ` : ''}
                </div>
                ` : ''}
                
                <div class="modal-section">
                    <h3>👤 ${userInfo.role === 'landlord' ? 'Property Owner' : 'Broker'} Information</h3>
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                        <div class="broker-avatar" style="width: 50px; height: 50px; font-size: 18px;">
                            ${userInfo.displayName.split(' ').map(n => n[0]).join('').toUpperCase()}
                        </div>
                        <div>
                            <div style="font-weight: 600; color: var(--text-dark); font-size: 16px;">
                                ${userInfo.displayName}
                            </div>
                            <div style="color: var(--text-light); font-size: 14px;">
                                ${userInfo.role === 'landlord' ? 'Property Owner' : 
                                  userInfo.role === 'broker' ? 'Licensed Broker' : 
                                  userInfo.role === 'agent' ? 'Property Agent' : 'Posted by'}
                            </div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email:</span>
                        <span class="detail-value">${userInfo.email}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone:</span>
                        <span class="detail-value">${userInfo.phone}</span>
                    </div>
                </div>
            `;
            
            document.getElementById('propertyModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        };

        // Change modal image when thumbnail is clicked
        window.changeModalImage = function(imageSrc, thumbnailElement) {
            document.getElementById('mainModalImage').src = imageSrc;
            
            document.querySelectorAll('.modal-thumbnail').forEach(thumb => {
                thumb.classList.remove('active');
            });
            thumbnailElement.classList.add('active');
        };

        // Open fullscreen image
        window.openFullscreenImage = function(imageSrc) {
            const fullscreenDiv = document.createElement('div');
            fullscreenDiv.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.9);
                z-index: 2000;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            const fullscreenImg = document.createElement('img');
            fullscreenImg.src = imageSrc;
            fullscreenImg.style.cssText = `
                max-width: 90%;
                max-height: 90%;
                object-fit: contain;
            `;
            
            fullscreenDiv.appendChild(fullscreenImg);
            fullscreenDiv.onclick = () => fullscreenDiv.remove();
            document.body.appendChild(fullscreenDiv);
        };

        // Close property modal
        window.closePropertyModal = function() {
            document.getElementById('propertyModal').classList.remove('show');
            document.body.style.overflow = 'auto';
            currentModalProperty = null;
        };

        // Remove property from liked list
        window.removeFromLiked = async function(savedId, propertyId) {
            if (!confirm("Remove this property from your liked list?")) return;
            
            try {
                await deleteDoc(doc(db, "savedProperties", savedId));
                
                userSavedProperties = userSavedProperties.filter(p => p.id !== propertyId);
                
                displayLikedProperties(userSavedProperties);
                updateStats(userSavedProperties);
                
                if (typeof window.updateSidebarStats === 'function') window.updateSidebarStats();
                
                showToast('Property removed from liked list', 'success');
                
                if (userSavedProperties.length === 0) {
                    showEmptyState();
                }
                
                if (currentModalProperty && currentModalProperty.id === propertyId) {
                    window.closePropertyModal();
                }
                
            } catch (error) {
                console.error("Error removing property:", error);
                showToast('Error removing property', 'error');
            }
        };

        // Show empty state: guided and intelligent
        function showEmptyState() {
            const container = document.getElementById('likedPropertiesContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-heart"></i></div>
                    <h2>You haven't saved any properties yet</h2>
                    <p>BahAI can help you find properties you'll like. Start browsing or ask for personalized recommendations.</p>
                    <a href="buyer_dashboard.html#ai-chatbot-section" class="browse-btn"><i class="fas fa-robot"></i> Ask BahAI for Recommendations</a>
                    <a href="buyer_dashboard.html" class="browse-btn" style="margin-top: 12px; background: transparent; border: 2px solid var(--primary); color: var(--primary);"><i class="fas fa-search"></i> Browse Properties</a>
                </div>
            `;
            
            document.getElementById('similarSuggestions').style.display = 'none';
        }

        // Update statistics (analytics removed)
        function updateStats(properties) {
            // Stats display removed
        }

        // Load similar properties based on user's saved properties
        async function loadSimilarProperties(savedProperties) {
            if (!savedProperties || savedProperties.length === 0) {
                document.getElementById('similarSuggestions').style.display = 'none';
                return;
            }
            
            try {
                const propertiesQuery = query(collection(db, "properties"));
                const snapshot = await getDocs(propertiesQuery);
                
                allProperties = [];
                snapshot.forEach(doc => {
                    const property = { id: doc.id, ...doc.data() };
                    const isActive = property.status === 'active' || 
                                    property.status === 'available' || 
                                    property.status === 'Active' ||
                                    (property.status === undefined && property.isActive !== false);
                    const isAlreadySaved = savedProperties.some(sp => sp.id === property.id);
                    
                    if (isActive && !isAlreadySaved) {
                        allProperties.push(property);
                    }
                });
                
                const similarProperties = findSimilarProperties(savedProperties, allProperties);
                
                if (similarProperties.length > 0) {
                    const userIds = new Set(similarProperties.map(p => p.userId));
                    for (const userId of userIds) {
                        if (!userMap.has(userId)) {
                            await loadUserData(userId);
                        }
                    }
                    
                    displaySimilarProperties(similarProperties);
                    document.getElementById('similarSuggestions').style.display = 'block';
                } else {
                    document.getElementById('similarSuggestions').style.display = 'none';
                }
                
            } catch (error) {
                console.error("Error loading similar properties:", error);
                document.getElementById('similarSuggestions').style.display = 'none';
            }
        }

        // Algorithm to find similar properties
        function findSimilarProperties(savedProperties, allProperties) {
            if (!savedProperties || savedProperties.length === 0 || !allProperties || allProperties.length === 0) return [];
            
            const preferences = {
                propertyTypes: new Set(),
                priceRanges: [],
                locations: new Set()
            };
            
            savedProperties.forEach(property => {
                if (property.propertyType) preferences.propertyTypes.add(property.propertyType);
                if (property.location) preferences.locations.add(property.location.split(',')[0].trim());
                
                const price = property.pricing || property.salePrice || property.monthlyRent || property.annualRent || 0;
                if (price > 0) preferences.priceRanges.push(price);
            });
            
            const avgPrice = preferences.priceRanges.length > 0 
                ? preferences.priceRanges.reduce((a, b) => a + b, 0) / preferences.priceRanges.length 
                : 0;
            
            const scoredProperties = allProperties.map(property => {
                let score = 0;
                
                if (property.propertyType && preferences.propertyTypes.has(property.propertyType)) {
                    score += 30;
                }
                
                if (property.location) {
                    const locationMatch = Array.from(preferences.locations).some(loc => 
                        property.location.toLowerCase().includes(loc.toLowerCase())
                    );
                    if (locationMatch) score += 40;
                }
                
                const propertyPrice = property.pricing || property.salePrice || property.monthlyRent || property.annualRent || 0;
                if (avgPrice > 0 && propertyPrice > 0) {
                    const priceDiff = Math.abs(propertyPrice - avgPrice) / avgPrice;
                    if (priceDiff < 0.3) score += 30 - (priceDiff * 100);
                }
                
                return { property, score };
            });
            
            return scoredProperties
                .sort((a, b) => b.score - a.score)
                .slice(0, 6)
                .map(item => item.property);
        }

        // Display similar properties
        function displaySimilarProperties(properties) {
            const container = document.getElementById('similarPropertiesContainer');
            
            if (!properties || properties.length === 0) return;
            
            properties.forEach(property => {
                if (!allProperties.find(p => p.id === property.id)) {
                    allProperties.push(property);
                }
            });
            
            container.innerHTML = properties.map(property => {
                const userInfo = userMap.get(property.userId) || {
                    displayName: `User ${property.userId ? property.userId.substring(0, 8) : 'Unknown'}`,
                    email: 'N/A',
                    phone: 'N/A',
                    role: 'user'
                };
                
                const userInitials = userInfo.displayName.split(' ').map(n => n[0]).join('').toUpperCase() || 'UU';
                const listingType = getListingType(property);
                const displayPrice = getDisplayPrice(property);
                const priceClass = getPriceClass(property);
                const typeBadgeClass = getTypeBadgeClass(property);
                const typeBadgeText = getTypeBadgeText(property);
                
                let mainPhoto;
                if (property.photos && property.photos.length > 0) {
                    mainPhoto = property.photos[0];
                } else if (property.imageUrls && property.imageUrls.length > 0) {
                    mainPhoto = property.imageUrls[0];
                } else {
                    mainPhoto = 'https://via.placeholder.com/400x220/0b2e52/white?text=No+Image';
                }
                
                const bedrooms = property.bedrooms || (listingType === 'rent' && property.propertyType === 'studio' ? 'Studio' : 0);
                const bathrooms = property.bathrooms || 0;
                const title = property.title || 'Untitled Property';
                const truncatedTitle = title.length > 50 ? title.substring(0, 50) + '...' : title;
                const locationDisplay = property.location || property.address || 'Location not specified';
                const truncatedLocation = locationDisplay.length > 40 ? locationDisplay.substring(0, 40) + '...' : locationDisplay;
                
                return `
                <div class="listing-card-wrapper">
                    <div class="listing-card" data-listing-id="${property.id}">
                        <a href="new_property_details.html?id=${property.id}" class="card-link-overlay" aria-label="View ${title.replace(/"/g, '&quot;')}"></a>
                        <div class="listing-card-image-container">
                            <img src="${mainPhoto}" alt="${(property.title || 'Property').replace(/"/g, '&quot;')}" class="listing-image">
                            <div class="listing-type-badge ${typeBadgeClass}">${typeBadgeText}</div>
                        </div>
                        <div class="listing-content">
                            <div class="listing-header">
                                <div style="flex: 1; min-width: 0;">
                                    <h3 class="listing-title" title="${title.replace(/"/g, '&quot;')}">
                                        ${truncatedTitle.replace(/"/g, '&quot;')}
                                    </h3>
                                </div>
                                <div class="listing-price ${priceClass}">${displayPrice}</div>
                            </div>
                            <div class="listing-location">
                                <i class="fas fa-map-marker-alt" style="flex-shrink: 0;"></i>
                                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${locationDisplay.replace(/"/g, '&quot;')}">
                                    ${truncatedLocation.replace(/"/g, '&quot;')}
                                </span>
                            </div>
                            <div class="listing-details">
                                <div class="detail">
                                    <i class="fas fa-bed"></i> ${bedrooms} ${bedrooms === 'Studio' ? '' : 'beds'}
                                </div>
                                <div class="detail">
                                    <i class="fas fa-bath"></i> ${bathrooms} baths
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Modal event listeners
        document.getElementById('closeModal').addEventListener('click', window.closePropertyModal);
        document.getElementById('propertyModal').addEventListener('click', function(e) {
            if (e.target === this) window.closePropertyModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') window.closePropertyModal();
        });
    </script>

    <script src="../sidebar-user.js"></script>
    <script src="buyer-sidebar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadBuyerSidebar('liked_properties.html');
        });
    </script>
