<script>
// Immediate guest setup (runs when sidebar loads, before Firebase)
// Only setup login button - do NOT overwrite nav links here. Links stay as messages.html etc.
// initializeSidebar will set links to login redirect ONLY when user is confirmed guest.
(function() {
  const btn = document.getElementById('logoutBtn');
  if (btn && btn.classList.contains('login-btn')) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopImmediatePropagation();
      const redirect = encodeURIComponent(window.location.pathname || 'buyer/buyer_dashboard.html');
      window.location.href = '../login.html?redirect=' + redirect;
    });
  }
})();

// Import Firebase modules if not already imported
async function initializeSidebar() {
  // Wait for Firebase globals
  if (!window.firebaseApp || !window.firebaseAuth || !window.firebaseDB) {
    console.log('Firebase not available yet, waiting...');
    setTimeout(initializeSidebar, 100);
    return;
  }

  try {
    // Import Firebase modules
    const { getAuth, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js");
    const { getFirestore, getDoc, doc, collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js");
    
    // Get the Firebase app instance from the main page
    const app = window.firebaseApp;
    if (!app) {
      console.error('Firebase app not found');
      return;
    }
    
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // Load user info from Firebase
    async function loadUserInfo() {
      try {
        const currentUser = auth.currentUser;
        const userNameEl = document.getElementById('userName');
        const userRoleEl = document.getElementById('userRole');
        const userAvatarEl = document.getElementById('userAvatar');
        
        if (!currentUser) {
          // Guest user - browsing without account
          if (userNameEl) userNameEl.textContent = 'Guest';
          if (userRoleEl) {
            userRoleEl.textContent = 'Browsing without account';
            userRoleEl.classList.add('guest-role');
          }
          if (userAvatarEl) {
            userAvatarEl.innerHTML = '<i class="fas fa-user" style="font-size: 16px; color: #0b2e52;"></i>';
            userAvatarEl.classList.add('guest-avatar');
          }
          updateSidebarForGuest();
          return;
        }
        
        userRoleEl?.classList.remove('guest-role');
        userAvatarEl?.classList.remove('guest-avatar');
        
        // Default values
        let userName = currentUser.displayName || currentUser.email || 'User';
        let userRole = 'Buyer';
        let photoURL = currentUser.photoURL || null; // Firebase Auth (Google/social login)
        
        // Try to get user data from Firestore
        try {
          const userDoc = await getDoc(doc(db, "users", currentUser.uid));
          if (userDoc.exists()) {
            const userData = userDoc.data();
            userName = userData.fullName || userData.email || userName;
            userRole = userData.role || userData.userType || userRole;
            // Firestore photoURL (from settings upload) overrides Auth photoURL
            photoURL = userData.photoURL || userData.profilePhotoURL || photoURL;
          }
        } catch (error) {
          console.log('Could not load user from Firestore:', error);
        }
        
        if (userNameEl) userNameEl.textContent = userName;
        
        if (userRoleEl) {
          const roleMap = {
            'landlord': 'Property Owner',
            'broker': 'Licensed Broker',
            'seller': 'Property Seller',
            'admin': 'Administrator',
            'agent': 'Property Agent',
            'user': 'Buyer'
          };
          userRoleEl.textContent = roleMap[userRole] || 'Buyer';
        }
        
        if (userAvatarEl) {
          const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || 'U';
          if (photoURL) {
            const img = document.createElement('img');
            img.src = photoURL;
            img.alt = 'Profile';
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
            img.onerror = function() { userAvatarEl.innerHTML = '<span style="font-weight: 600;">' + initials + '</span>'; };
            userAvatarEl.innerHTML = '';
            userAvatarEl.appendChild(img);
          } else {
            userAvatarEl.innerHTML = '<span style="font-weight: 600;">' + initials + '</span>';
          }
        }
        
        updateSidebarForLoggedIn();
        
      } catch (error) {
        console.error('Error loading user info:', error);
      }
    }
    
    function updateSidebarForGuest() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        const newBtn = logoutBtn.cloneNode(true);
        newBtn.innerHTML = '<div class="logout-icon"><i class="fas fa-sign-in-alt"></i></div><span class="logout-text">Login / Sign Up</span>';
        newBtn.classList.add('login-btn');
        newBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopImmediatePropagation();
          const redirect = encodeURIComponent(window.location.pathname || 'buyer/buyer_dashboard.html');
          window.location.href = '../login.html?redirect=' + redirect;
        });
        logoutBtn.replaceWith(newBtn);
      }
      ['messagesLink', 'savedLink', 'settingsLink'].forEach(id => {
        const link = document.getElementById(id);
        if (link && link.dataset.guestRedirect) {
          link.href = '../login.html?redirect=' + encodeURIComponent('buyer/' + link.dataset.guestRedirect);
          link.title = id === 'messagesLink' ? 'Login to access Messages' : id === 'savedLink' ? 'Login to save properties' : 'Login to access Profile';
        }
      });
    }
    
    async function updateSidebarForLoggedIn() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        const newBtn = logoutBtn.cloneNode(true);
        newBtn.innerHTML = '<div class="logout-icon"><i class="fas fa-sign-out-alt"></i></div><span class="logout-text">Log Out</span>';
        newBtn.classList.remove('login-btn');
        newBtn.addEventListener('click', async function(e) {
          e.preventDefault();
          if (confirm('Are you sure you want to log out?')) {
            if (typeof window.performLogout === 'function') {
              window.performLogout();
            } else {
              try {
                const { signOut } = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js");
                await signOut(auth);
                window.location.href = '../login.html';
              } catch (err) {
                window.location.href = '../login.html';
              }
            }
          }
        });
        logoutBtn.replaceWith(newBtn);
      }
      ['messagesLink', 'savedLink', 'settingsLink'].forEach(id => {
        const link = document.getElementById(id);
        if (link && link.dataset.guestRedirect) {
          link.href = link.dataset.guestRedirect;
          link.title = '';
        }
      });
    }
    
    // Load saved count for nav badge
    async function loadStats() {
      try {
        const currentUser = auth.currentUser;
        const savedBadge = document.getElementById('savedBadge');
        if (!savedBadge) return;
        
        if (!currentUser) {
          savedBadge.textContent = '';
          return;
        }
        
        const savedRef = collection(db, 'savedProperties');
        const savedQuery = query(savedRef, where('userId', '==', currentUser.uid));
        const savedSnapshot = await getDocs(savedQuery);
        savedBadge.textContent = savedSnapshot.size > 0 ? savedSnapshot.size : '';
      } catch (error) {
        console.log('Could not load saved count:', error);
      }
    }
    
    function resetStats() {
      const savedBadge = document.getElementById('savedBadge');
      if (savedBadge) savedBadge.textContent = '';
    }
    
    // Initialize when auth state changes (login, logout, etc.)
    onAuthStateChanged(auth, async (user) => {
      await loadUserInfo();  // Updates profile to Guest when logged out
      if (user) {
        await loadStats();
      } else {
        resetStats();
      }
    });
    
    // Initialize now if user is already logged in
    if (auth.currentUser) {
      await loadUserInfo();
      await loadStats();
    }
    
    // Highlight current page
    function highlightCurrentPage() {
      const currentPath = window.location.pathname.split('/').pop() || 'buyer_dashboard.html';
      const links = document.querySelectorAll('.sidebar-link');
      
      links.forEach(link => {
        const href = link.getAttribute('href');
        if (href === currentPath) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }
    
    highlightCurrentPage();
    
    // Refresh stats periodically
    setInterval(loadStats, 60000); // Every 60 seconds
    
  } catch (error) {
    console.error('Error initializing sidebar:', error);
    // Fallback to localStorage method
    loadUserInfoFallback();
    loadStatsFallback();
  }
}

// Fallback functions if Firebase fails
function loadUserInfoFallback() {
  try {
    const userData = JSON.parse(localStorage.getItem('userData')) || 
                    JSON.parse(sessionStorage.getItem('userData'));
    
    if (userData) {
      const userNameEl = document.getElementById('userName');
      const userRoleEl = document.getElementById('userRole');
      const userAvatarEl = document.getElementById('userAvatar');
      
      if (userNameEl) {
        userNameEl.textContent = userData.fullName || userData.email || 'User';
      }
      
      if (userRoleEl) {
        const roleMap = {
          'landlord': 'Property Owner',
          'broker': 'Licensed Broker',
          'seller': 'Property Seller',
          'admin': 'Administrator',
          'user': 'Buyer'
        };
        userRoleEl.textContent = roleMap[userData.role] || 'Buyer';
      }
      
      if (userAvatarEl && userData.fullName) {
        const initials = userData.fullName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        userAvatarEl.innerHTML = `<span style="font-weight: 600;">${initials}</span>`;
      }
    }
  } catch (error) {
    console.log('Fallback: Could not load user info:', error);
  }
}

function loadStatsFallback() {
  try {
    const savedProperties = JSON.parse(localStorage.getItem('savedProperties') || '[]');
    const savedBadge = document.getElementById('savedBadge');
    if (savedBadge) savedBadge.textContent = savedProperties.length > 0 ? savedProperties.length : '';
  } catch (error) {
    console.log('Fallback: Could not load stats:', error);
  }
}

// Initialize sidebar - run immediately (sidebar is loaded dynamically, DOMContentLoaded has already fired)
(function initSidebarDOM() {
  initializeSidebar();
  
  // Overlay click to close sidebar (mobile/tablet)
  const overlay = document.getElementById('sidebarOverlay');
  if (overlay) {
    overlay.addEventListener('click', function() {
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) sidebar.classList.remove('active');
    });
  }
  
  // Close sidebar on link click (mobile/tablet)
  document.addEventListener('click', function(e) {
    if (window.innerWidth <= 1024 && e.target.closest('.sidebar-link')) {
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) sidebar.classList.remove('active');
    }
  });
  
  // Make stats updater available globally
  window.updateSidebarStats = async function() {
    if (!window.firebaseApp) {
      loadStatsFallback();
      return;
    }
    try {
      const { getAuth } = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js");
      const { getFirestore, collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js");
      const app = window.firebaseApp;
      const auth = getAuth(app);
      const db = getFirestore(app);
      const currentUser = auth.currentUser;
      const savedBadge = document.getElementById('savedBadge');
      if (!savedBadge) return;
      
      if (!currentUser) {
        savedBadge.textContent = '';
      } else {
        const savedRef = collection(db, 'savedProperties');
        const savedQuery = query(savedRef, where('userId', '==', currentUser.uid));
        const savedSnapshot = await getDocs(savedQuery);
        savedBadge.textContent = savedSnapshot.size > 0 ? savedSnapshot.size : '';
      }
    } catch (error) {
      loadStatsFallback();
    }
  };
})();

// Export initialization function for main pages to call
window.initializeSidebar = initializeSidebar;
</script>
