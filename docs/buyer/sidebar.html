<script>
(function() {
  var currentPath = window.location.pathname.split('/').pop() || 'buyer_dashboard.html';
  document.querySelectorAll('.top-nav-link.sidebar-link').forEach(function(link) {
    var href = link.getAttribute('href');
    if (href === currentPath) link.classList.add('active');
    else link.classList.remove('active');
  });

  var trigger = document.getElementById('topNavProfileTrigger');
  var dropdown = document.getElementById('topNavDropdown');
  var avatarEl = document.getElementById('topNavAvatar');
  var nameEl = document.getElementById('topNavProfileName');
  var profileLink = document.getElementById('topNavProfileLink');
  var logoutBtn = document.getElementById('topNavLogoutBtn');
  var loginLink = document.getElementById('topNavLoginLink');
  var messagesBadgeEl = document.getElementById('topNavMessagesBadge');
  var messagesBadgeUnsubscribe = null;
  var firestoreApi = null;

  if (!trigger || !dropdown) return;

  trigger.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = dropdown.classList.toggle('open');
    trigger.setAttribute('aria-expanded', isOpen);
    if (isOpen) {
      document.body.classList.add('top-nav-dropdown-open');
    } else {
      document.body.classList.remove('top-nav-dropdown-open');
    }
  });

  document.addEventListener('click', function() {
    dropdown.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('top-nav-dropdown-open');
  });

  dropdown.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  function setMessagesBadgeCount(count) {
    if (!messagesBadgeEl) return;
    var value = Number(count || 0);
    if (value > 0) {
      messagesBadgeEl.textContent = value > 99 ? '99+' : String(value);
      messagesBadgeEl.classList.add('show');
    } else {
      messagesBadgeEl.textContent = '0';
      messagesBadgeEl.classList.remove('show');
    }
  }

  function stopMessagesBadgeListener() {
    if (typeof messagesBadgeUnsubscribe === 'function') {
      messagesBadgeUnsubscribe();
      messagesBadgeUnsubscribe = null;
    }
    setMessagesBadgeCount(0);
  }

  function ensureFirestoreApi() {
    if (firestoreApi) return Promise.resolve(firestoreApi);
    return import('https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js').then(function(mod) {
      firestoreApi = mod;
      return mod;
    });
  }

  function startMessagesBadgeListener(user) {
    if (!user || !user.uid || !messagesBadgeEl) {
      stopMessagesBadgeListener();
      return;
    }

    var maxAttempts = 80;
    var attempts = 0;

    function tryStart() {
      if (!window.firebaseDB) {
        attempts += 1;
        if (attempts <= maxAttempts) {
          setTimeout(tryStart, 150);
        }
        return;
      }

      if (typeof messagesBadgeUnsubscribe === 'function') {
        messagesBadgeUnsubscribe();
        messagesBadgeUnsubscribe = null;
      }

      ensureFirestoreApi()
        .then(function(fs) {
          var conversationsRef = fs.collection(window.firebaseDB, 'conversations');
          var q = fs.query(
            conversationsRef,
            fs.where('participants', 'array-contains', user.uid)
          );

          messagesBadgeUnsubscribe = fs.onSnapshot(q, function(snapshot) {
            var totalUnread = 0;
            snapshot.forEach(function(conversationDoc) {
              var data = conversationDoc.data() || {};
              var unread = data.unreadCount && data.unreadCount[user.uid];
              totalUnread += Number(unread || 0);
            });
            setMessagesBadgeCount(totalUnread);
          }, function() {
            setMessagesBadgeCount(0);
          });
        })
        .catch(function() {
          setMessagesBadgeCount(0);
        });
    }

    tryStart();
  }

  function setLoginMode() {
    if (nameEl) nameEl.textContent = 'Guest';
    if (avatarEl) {
      avatarEl.innerHTML = '<i class="fas fa-user"></i>';
      avatarEl.style.background = 'rgba(255,255,255,0.2)';
      avatarEl.style.color = 'white';
    }
    if (profileLink) {
      profileLink.href = '../login.html?redirect=' + encodeURIComponent('buyer/settings.html');
      profileLink.style.display = 'flex';
    }
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (loginLink) loginLink.style.display = 'flex';
  }

  function setLogoutMode(userData) {
    var name = (userData && (userData.fullName || userData.displayName || userData.email)) || 'User';
    if (nameEl) nameEl.textContent = name;
    if (avatarEl) {
      var photoURL = userData && (userData.photoURL || userData.profilePhotoURL);
      if (photoURL) {
        avatarEl.innerHTML = '<img src="' + photoURL.replace(/"/g, '&quot;') + '" alt="Profile">';
      } else {
        var initials = (name + '').split(' ').map(function(n) { return n ? n[0] : ''; }).join('').toUpperCase().substring(0, 2) || 'U';
        avatarEl.innerHTML = '<span style="font-weight:600;font-size:14px;">' + initials + '</span>';
        avatarEl.style.background = 'linear-gradient(135deg, #d4af37 0%, #b8860b 100%)';
        avatarEl.style.color = '#0b2e52';
      }
    }
    if (profileLink) {
      profileLink.href = 'settings.html';
      profileLink.style.display = 'flex';
    }
    if (logoutBtn) logoutBtn.style.display = 'flex';
    if (loginLink) loginLink.style.display = 'none';
  }

  function doLogout(e) {
    e.preventDefault();
    if (confirm('Are you sure you want to log out?')) {
      if (typeof window.performLogout === 'function') {
        window.performLogout();
      } else {
        window.location.href = '../login.html';
      }
    }
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', doLogout);
  }

  if (loginLink) {
    loginLink.href = '../login.html?redirect=' + encodeURIComponent(window.location.pathname + (window.location.search || ''));
  }

  [profileLink, logoutBtn, loginLink].forEach(function(el) {
    if (el) el.addEventListener('click', function() {
      dropdown.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('top-nav-dropdown-open');
    });
  });

  function updateAuthState(user) {
    if (user) {
      var userData = null;
      try { userData = JSON.parse(localStorage.getItem('userData') || 'null'); } catch (e) {}
      setLogoutMode(userData || { fullName: user.displayName || user.email, email: user.email, photoURL: user.photoURL });
      startMessagesBadgeListener(user);
    } else {
      setLoginMode();
      stopMessagesBadgeListener();
    }
  }

  window.updateBuyerNavAuth = updateAuthState;

  if (window.firebaseAuth) {
    window.firebaseAuth.onAuthStateChanged(updateAuthState);
    if (window.firebaseAuth.currentUser) updateAuthState(window.firebaseAuth.currentUser);
  } else {
    var userData = null;
    try { userData = JSON.parse(localStorage.getItem('userData') || 'null'); } catch (e) {}
    if (userData && userData.email) setLogoutMode(userData);
    else setLoginMode();

    var checkCount = 0;
    var checkAuth = setInterval(function() {
      if (window.firebaseAuth) {
        clearInterval(checkAuth);
        window.firebaseAuth.onAuthStateChanged(updateAuthState);
      }
      if (++checkCount > 50) clearInterval(checkAuth);
    }, 100);
  }

  var toggle = document.getElementById('topNavToggle');
  var menu = document.getElementById('topNavMenu');
  if (toggle && menu) {
    toggle.addEventListener('click', function() {
      menu.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (window.innerWidth <= 1024 && !toggle.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove('open');
      }
    });
    document.querySelectorAll('.top-nav-link').forEach(function(link) {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 1024) menu.classList.remove('open');
      });
    });
  }
})();
</script>
