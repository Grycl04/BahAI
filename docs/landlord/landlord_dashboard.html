<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Landlord Dashboard - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../buyer/style.css">
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
        --primary-light: #1e3a5f;
        --primary-dark: #071e38;
        --secondary-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
        --accent-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
        --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        --card-hover-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        --border-radius: 16px;
        --border-radius-sm: 12px;
        --border-radius-lg: 24px;
        --text-dark: #1a202c;
        --text-light: #718096;
    }

    body {
      background: #f1f5f9;
      overflow-x: hidden;
    }

    .mobile-menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      background: var(--primary-gradient);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: var(--border-radius-sm);
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--card-hover-shadow);
    }

    /* Mobile overlay (activated in mobile breakpoint like broker dashboard) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .container {
      flex: 1;
      margin-left: 280px;
      padding: 30px;
      transition: margin-left 0.3s ease;
    }

    /* Hero Section - same as broker dashboard */
    .hero-section {
        background: var(--primary-gradient);
        color: white;
        border-radius: var(--border-radius-lg);
        padding: 50px 40px;
        margin-bottom: 40px;
        position: relative;
        overflow: hidden;
    }
    .hero-section::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="white"/></svg>');
        background-size: cover;
        opacity: 0.1;
    }
    .hero-section h1 { font-size: 2.8rem; font-weight: 700; margin-bottom: 15px; line-height: 1.2; max-width: 800px; }
    .hero-section p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin-bottom: 20px; }
    .hero-stats { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
    .hero-stat-item { display: flex; align-items: center; gap: 10px; }
    .hero-stat-icon {
        font-size: 1.5rem;
        background: rgba(255,255,255,0.2);
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .hero-stat-value { font-size: 1.5rem; font-weight: 700; }
    .hero-stat-label { font-size: 0.9rem; opacity: 0.8; }

    /* Search Section - same as broker dashboard */
    .search-section {
        background: white;
        border-radius: var(--border-radius);
        padding: 35px;
        margin-bottom: 40px;
        box-shadow: var(--card-shadow);
        border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .search-title {
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .search-title i { color: #d4af37; font-size: 1.2rem; }
    .search-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
        margin-bottom: 30px;
    }
    .search-group { display: flex; flex-direction: column; gap: 8px; }
    .search-label {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-dark);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .search-select, .search-input {
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        background: white;
    }
    .search-select:focus, .search-input:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }
    .search-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
        flex-wrap: wrap;
    }
    .search-button {
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 16px 32px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 200px;
        justify-content: center;
    }
    .search-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
    }
    .reset-button {
        background: white;
        color: var(--text-dark);
        border: 2px solid #e5e7eb;
        padding: 16px 32px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 200px;
        justify-content: center;
    }
    .reset-button:hover {
        background: #f9fafb;
        border-color: #d4af37;
        transform: translateY(-2px);
    }

    /* Section title - same as broker */
    .section-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .section-title i { color: #d4af37; font-size: 1.3rem; }

    /* Properties section & listings grid - same as broker */
    .properties-section { margin-bottom: 40px; }
    .properties-section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        flex-wrap: wrap;
        gap: 15px;
    }
    .listings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        margin-top: 25px;
    }
    .listing-card-wrapper { transition: all 0.3s ease; }
    .listing-card-wrapper:hover { transform: translateY(-5px); }
    .listing-card {
        position: relative;
        background: white;
        border-radius: var(--border-radius);
        overflow: hidden;
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
        border: 1px solid rgba(0, 0, 0, 0.05);
        height: 100%;
    }
    .listing-card:hover { box-shadow: var(--card-hover-shadow); }
    .listing-card-image-container {
        position: relative;
        height: 220px;
        overflow: hidden;
    }
    .listing-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .listing-card:hover .listing-image { transform: scale(1.05); }
    .listing-type-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: white;
        z-index: 2;
    }
    .listing-type-badge.rent { background: #10b981; }
    .listing-type-badge.lease { background: #10b981; }
    .listing-type-badge.sale { background: #3b82f6; }
    .listing-content { padding: 25px; }
    .listing-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
        gap: 15px;
    }
    .listing-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        max-height: 3.6em;
    }
    .listing-location {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-light);
        font-size: 0.9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .listing-price {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary-dark);
        white-space: normal !important;
        word-break: break-word;
        text-align: right;
        min-width: fit-content;
        flex-shrink: 0;
        max-width: 45%;
    }
    .listing-header > div:first-child { flex: 1; min-width: 0; overflow: hidden; }
    .listing-details {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }
    .detail {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-light);
        font-size: 0.9rem;
    }
    .listing-broker {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
    }
    .broker-avatar {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 50%;
        background: var(--primary-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.9rem;
        overflow: hidden;
        flex-shrink: 0;
    }
    .broker-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .broker-info { flex: 1; }
    .broker-name {
        font-weight: 600;
        color: var(--text-dark);
        font-size: 0.95rem;
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .broker-contact {
        font-size: 0.8rem;
        color: var(--text-light);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .listing-status {
        display: inline-block;
        padding: 6px 15px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 20px;
    }
    .status-active, .listing-status.status-active,
    .status-available, .listing-status.status-available {
        background: #10b981 !important;
        color: white !important;
    }
    .status-pending, .listing-status.status-pending {
        background: var(--accent-gradient) !important;
        color: white !important;
    }
    .status-sold, .listing-status.status-sold,
    .status-rented, .listing-status.status-rented {
        background: #ef4444 !important;
        color: white !important;
    }
    .card-link-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        opacity: 0;
        cursor: pointer;
    }
    .add-button {
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        white-space: nowrap;
    }
    .add-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
    }
    .loading-state, .error-state, .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--card-shadow);
    }
    .empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .empty-state h3 { font-size: 20px; margin-bottom: 10px; color: var(--text-dark); }
    .spinner {
        border: 4px solid rgba(212, 175, 55, 0.2);
        border-top: 4px solid #d4af37;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .error-icon { font-size: 48px; margin-bottom: 20px; color: #ef4444; }

    /* Tablet */
    @media (max-width: 1024px) {
        .container { margin-left: 0; padding: 24px; padding-top: 70px; }
        .mobile-menu-toggle { display: flex !important; align-items: center; justify-content: center; }
        .hero-stats { gap: 20px; flex-wrap: wrap; }
        .hero-section { padding: 24px 28px; }
        .hero-section h1 { font-size: 2.2rem; }
        .hero-section p { font-size: 1rem; max-width: 100%; }
        .search-section { padding: 24px 22px; }
        .search-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .search-button, .reset-button { min-width: 0; padding-inline: 20px; }
        .listings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .listing-card-image-container { height: 210px; }
        .listing-details { gap: 16px; }
        .listing-details .detail { flex: 1 1 45%; min-width: 150px; }
    }

    /* Large Mobile */
    /* Large Mobile - sidebar hidden / overlay (match broker dashboard) */
    @media (max-width: 768px) {
        .container { margin-left: 0; padding: 16px; padding-top: 56px; }
        .mobile-menu-toggle { display: flex !important; }
        .listings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .hero-section h1 { font-size: 1.6rem; }
        .hero-section { padding: 16px 18px; margin-bottom: 20px; }
        .hero-section p { font-size: 0.9rem; margin-bottom: 14px; }
        .hero-stats { flex-direction: column; gap: 14px; margin-top: 18px; }
        .hero-stat-item { width: 100%; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        .hero-stat-item:last-child { border-bottom: none; }
        .hero-stat-value { font-size: 1.3rem; }
        .hero-stat-label { font-size: 0.85rem; }
        .hero-stat-icon { width: 44px; height: 44px; font-size: 1.2rem; }
        .search-section { padding: 18px 16px; margin-bottom: 20px; }
        .search-grid { grid-template-columns: 1fr; gap: 14px; margin-bottom: 18px; }
        .search-title { font-size: 1.1rem; margin-bottom: 18px; }
        .search-actions { flex-direction: column; align-items: stretch; margin-top: 24px; gap: 12px; }
        .search-button, .reset-button { width: 100%; min-width: unset; justify-content: center; }
        .properties-section { margin-bottom: 30px; }
        .properties-section-header { flex-direction: column; align-items: stretch; gap: 15px; }
        .properties-section-header .search-button { width: 100%; justify-content: center; }

        /* Sidebar slides over content on mobile */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            max-width: 80%;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        body.sidebar-open { overflow: hidden; }
        body.sidebar-open .sidebar { transform: translateX(0); z-index: 1001; }
        body.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }

        .section-title { font-size: 1.25rem; }
        .listing-content { padding: 10px; }
        .listing-header { flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; }
        .listing-price { text-align: left; max-width: none; width: 100%; }
        .listing-details { flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding-bottom: 10px; }
        .listing-card-image-container { height: 150px; }
        .listing-type-badge { padding: 4px 10px; font-size: 10px; border-radius: 16px; top: 8px; left: 8px; }
        /* Match broker dashboard: hide profile row to shorten cards on mobile */
        .listing-broker { display: none; }
    }

    /* Small Mobile */
    /* Small Mobile (match broker dashboard) */
    @media (max-width: 480px) {
        .container { padding: 12px; padding-top: 54px; }
        .mobile-menu-toggle { top: 12px; left: 12px; width: 44px; height: 44px; font-size: 20px; }
        .hero-section { padding: 14px 14px; margin-bottom: 18px; }
        .hero-section h1 { font-size: 1.35rem; }
        .hero-section p { font-size: 0.85rem; margin-bottom: 12px; }
        .hero-stat-value { font-size: 1.1rem; }
        .hero-stat-label { font-size: 0.78rem; }
        .hero-stat-icon { width: 36px; height: 36px; font-size: 1rem; }
        .search-section { padding: 14px 12px; margin-bottom: 18px; }
        .search-title { font-size: 1rem; margin-bottom: 16px; }
        .search-button, .reset-button { padding: 12px 12px; font-size: 0.9rem; }
        .section-title { font-size: 1.15rem; }
        .section-title i { font-size: 1.1rem; }
        .listing-content { padding: 12px; }
        .listing-title { font-size: 0.95rem; line-height: 1.25; max-height: 3.1em; }
        .listing-price { font-size: 0.95rem; }
        .listing-details { gap: 8px; margin-bottom: 10px; padding-bottom: 10px; }
        .detail { font-size: 0.8rem; flex: 1 1 100%; }
        .listing-type-badge { padding: 3px 8px; font-size: 9px; border-radius: 14px; top: 6px; left: 6px; }
        .listing-card-image-container { height: 120px; }
    }
</style>
</head>

<body>
<!-- Mobile Menu Toggle -->
<button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Include Sidebar -->
<div id="sidebar-container"></div>

<!-- Main -->
<div class="container">
  <!-- Hero Section - same design as broker dashboard -->
  <div class="hero-section">
    <h1>Landlord Dashboard</h1>
    <p>Manage your listings and browse all property listings from brokers and owners across the platform</p>
    <div class="hero-stats">
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-building"></i></div>
        <div>
          <div class="hero-stat-value" id="totalListings">0</div>
          <div class="hero-stat-label">Total Active Listings</div>
        </div>
      </div>
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-calendar-plus"></i></div>
        <div>
          <div class="hero-stat-value" id="newToday">0</div>
          <div class="hero-stat-label">New Today</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter Section - same design as broker dashboard -->
  <div class="search-section">
    <div class="search-title">
      <i class="fas fa-filter"></i>
      Filter Properties
    </div>
    <div class="search-grid">
      <div class="search-group">
        <label class="search-label">
          <i class="fas fa-home"></i>
          Property Type
        </label>
        <select class="search-select" id="filterType">
          <option value="">All Types</option>
          <option value="House">House</option>
          <option value="Condo">Condo</option>
          <option value="Apartment">Apartment</option>
          <option value="Land">Land</option>
          <option value="Commercial">Commercial</option>
        </select>
      </div>
      <div class="search-group">
        <label class="search-label">
          <i class="fas fa-handshake"></i>
          Listing Type
        </label>
        <select class="search-select" id="filterListingType">
          <option value="">All Listings</option>
          <option value="sale">For Sale</option>
          <option value="rent">For Rent</option>
          <option value="lease">For Lease</option>
        </select>
      </div>
      <div class="search-group">
        <label class="search-label">
          <i class="fas fa-peso-sign"></i>
          Price Range
        </label>
        <select class="search-select" id="filterPrice">
          <option value="">Any Price</option>
          <option value="0-1000000">Under ₱1M</option>
          <option value="1000000-5000000">₱1M - ₱5M</option>
          <option value="5000000-10000000">₱5M - ₱10M</option>
          <option value="10000000-999999999">Over ₱10M</option>
        </select>
      </div>
      <div class="search-group">
        <label class="search-label">
          <i class="fas fa-map-marker-alt"></i>
          Location
        </label>
        <input type="text" class="search-input" id="filterLocation" list="municipalitiesList" placeholder="Type to search municipalities...">
        <datalist id="municipalitiesList">
          <option value="Agoncillo">Agoncillo</option>
          <option value="Alitagtag">Alitagtag</option>
          <option value="Balayan">Balayan</option>
          <option value="Balete">Balete</option>
          <option value="Bauan">Bauan</option>
          <option value="Calatagan">Calatagan</option>
          <option value="Cuenca">Cuenca</option>
          <option value="Ibaan">Ibaan</option>
          <option value="Laurel">Laurel</option>
          <option value="Lemery">Lemery</option>
          <option value="Lian">Lian</option>
          <option value="Lobo">Lobo</option>
          <option value="Mabini">Mabini</option>
          <option value="Malvar">Malvar</option>
          <option value="Mataasnakahoy">Mataasnakahoy</option>
          <option value="Nasugbu">Nasugbu</option>
          <option value="Padre Garcia">Padre Garcia</option>
          <option value="Rosario">Rosario</option>
          <option value="San Jose">San Jose</option>
          <option value="San Juan">San Juan</option>
          <option value="San Luis">San Luis</option>
          <option value="San Nicolas">San Nicolas</option>
          <option value="San Pascual">San Pascual</option>
          <option value="Santa Teresita">Santa Teresita</option>
          <option value="Taal">Taal</option>
          <option value="Talisay">Talisay</option>
          <option value="Taysan">Taysan</option>
          <option value="Tingloy">Tingloy</option>
          <option value="Tuy">Tuy</option>
          <option value="Batangas City">Batangas City</option>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

const firebaseConfig = {

let allListings = [];

// Helper to safely extract a photo url from various profile shapes
function getPhotoFromData(data) {
  if (!data || typeof data !== 'object') return null;
  const url =
    data.photoURL ||
    data.profilePhotoURL ||
    data.profilePhoto ||
    data.profileImage ||
    data.imageURL ||
    data.photoUrl ||
    data.imageUrl ||
    data.avatarURL ||
    data.avatar ||
    null;

  if (url && typeof url === 'string' && url.trim().length > 0) return url.trim();

  // Fallback: any key that looks like photo/image/avatar
  for (const key of Object.keys(data)) {
    const k = key.toLowerCase();
    if ((k.includes('photo') || k.includes('image') || k.includes('avatar')) && typeof data[key] === 'string') {
      const v = data[key].trim();
      if (v.length > 10 && (v.startsWith('http') || v.startsWith('//'))) return v;
    }
  }
  return null;
}

// Helper function to get role display text
function getRoleDisplayText(role) {
  const roleMap = {
    'landlord': 'Property Owner',
    'seller': 'Property Seller', 
    'broker': 'Licensed Broker',
    'agent': 'Property Agent',
    'admin': 'Administrator',
    'user': 'User'
  };
  return roleMap[role] || 'Posted by';
}

// Helper function to get price based on listing type
function getPriceInfo(listing) {
  const type = listing.type || listing.listingType || 'rent';
  let price = 0;
  let label = '';
  
  switch(type.toLowerCase()) {
    case 'sale':
      price = listing.salePrice || listing.pricing || listing.price || 0;
      label = `₱${price.toLocaleString()}`;
      break;
    case 'lease':
      price = listing.annualRent || listing.monthlyRent * 12 || listing.rent || 0;
      label = `₱${price.toLocaleString()}/year`;
      break;
    case 'rent':
      price = listing.monthlyRent || listing.rent || 0;
      label = `₱${price.toLocaleString()}/month`;
      break;
    default:
      price = listing.pricing || listing.price || listing.monthlyRent || listing.annualRent || 0;
      label = `₱${price.toLocaleString()}`;
  }
  
  return { price, label };
}

// Helper function to get listing type display
function getListingTypeDisplay(listing) {
  const type = listing.type || listing.listingType || 'rent';
  switch(type.toLowerCase()) {
    case 'sale': return 'For Sale';
    case 'lease': return 'For Lease';
    case 'rent': return 'For Rent';
    default: return 'Property';
  }
}

// Main function to load ALL listings (same as broker dashboard)
async function loadAllListings() {
  const container = document.getElementById('listingsContainer');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading properties...</p></div>';
  
  try {
    console.log('🔍 Fetching all properties...');
    
    // Query ALL properties from Firestore (no filter)
    const propertiesRef = collection(db, "properties");
    const snapshot = await getDocs(propertiesRef);
    
    allListings = [];
    const userIds = new Set();
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      const listing = {
        id: doc.id,
        ...data
      };
      
      // Only include listings that are active/available
      const status = (data.status || '').toLowerCase();
      if (status === 'active' || status === 'available' || status === 'published' || 
          !data.status || data.status === true || data.status === 'true') {
        allListings.push(listing);
        
        // Collect user IDs for lookup
        if (data.agentId) userIds.add(data.agentId);
        if (data.userId) userIds.add(data.userId);
        if (data.ownerId) userIds.add(data.ownerId);
        if (data.brokerId) userIds.add(data.brokerId);
        if (data.listedBy) userIds.add(data.listedBy);
      }
    });
    
    console.log(`✅ Loaded ${allListings.length} active properties`);
    
    // Load user data for all collected user IDs
    await loadUserData(Array.from(userIds));
    
    if (allListings.length === 0) {
      displayNoListings();
      const countEl = document.getElementById('propertiesCount');
      if (countEl) countEl.textContent = 'No active properties';
    } else {
      displayListings(allListings);
      updateStats(allListings);
    }
    
  } catch (error) {
    console.error('❌ Error loading listings:', error);
    displayError(error);
  }
}

// Load user data for multiple user IDs (same as broker - includes photoURL)
async function loadUserData(userIds) {
  userMap.clear();
  
  if (userIds.length === 0) {
    console.log('ℹ️ No user IDs to load');
    return;
  }
  
  console.log(`👥 Loading user data for ${userIds.length} users...`);
  
  const userPromises = userIds.map(async (userId) => {
    try {
      let userData = null;
      // Try agents collection first (so listing cards get agent profile/photo)
      let agentData = null;
      const agentDoc = await getDoc(doc(db, "agents", userId));
      if (agentDoc.exists()) {
        agentData = agentDoc.data();
      } else {
        // Some records store authUid instead of using doc id
        const agentsQuery = query(collection(db, "agents"), where("authUid", "==", userId));
        const agentSnapshot = await getDocs(agentsQuery);
        if (!agentSnapshot.empty) agentData = agentSnapshot.docs[0].data();
      }

      if (agentData) {
        userMap.set(userId, {
          displayName: agentData.fullName || agentData.name || agentData.displayName || `Agent ${userId.substring(0, 8)}`,
          email: agentData.email || 'Email not available',
          phone: agentData.phone || agentData.phoneNumber || 'Phone not available',
          role: agentData.role || agentData.userType || 'agent',
          photoURL: getPhotoFromData(agentData)
        });
        return;
      }

      const brokerDoc = await getDoc(doc(db, "brokers", userId));
      if (brokerDoc.exists()) {
        userData = brokerDoc.data();
        userMap.set(userId, {
          displayName: userData.fullName || userData.name || userData.displayName || `User ${userId.substring(0, 8)}`,
          email: userData.email || 'Email not available',
          phone: userData.phone || userData.phoneNumber || 'Phone not available',
          role: userData.role || 'broker',
          photoURL: getPhotoFromData(userData)
        });
        return;
      }

      const userDoc = await getDoc(doc(db, "users", userId));
      if (userDoc.exists()) {
        userData = userDoc.data();
        userMap.set(userId, {
          displayName: userData.fullName || userData.displayName || userData.name || `User ${userId.substring(0, 8)}`,
          email: userData.email || 'Email not available',
          phone: userData.phone || userData.phoneNumber || 'Phone not available',
          role: userData.role || userData.userType || 'user',
          photoURL: getPhotoFromData(userData)
        });
        return;
      }

      userMap.set(userId, {
        displayName: `User ${userId.substring(0, 8)}`,
        email: 'Email not available',
        phone: 'Phone not available',
        role: 'user',
        photoURL: null
      });
    } catch (error) {
      console.error(`Error loading user ${userId}:`, error);
      userMap.set(userId, {
        displayName: `User ${userId.substring(0, 8)}`,
        email: 'Email not available',
        phone: 'Phone not available',
        role: 'user',
        photoURL: null
      });
    }
  });
  
  await Promise.all(userPromises);
  console.log(`✅ Loaded ${userMap.size} user profiles`);
}

// Display listings in the grid (same card structure as broker dashboard)
function displayListings(listings) {
  const container = document.getElementById('listingsContainer');
  
  if (listings.length === 0) {
    displayNoListings();
    return;
  }
  
  container.innerHTML = listings.map(listing => {
    const userId = listing.agentId || listing.userId || listing.ownerId || listing.brokerId || listing.listedBy || 'unknown';
    const userInfo = userMap.get(userId) || {
      displayName: `User ${userId.substring(0, 8)}`,
      email: 'N/A',
      phone: 'N/A',
      role: 'user',
      photoURL: null
    };
    
    const priceInfo = getPriceInfo(listing);
    const listingType = getListingTypeDisplay(listing);
    const rawType = (listing.type || listing.listingType || 'rent').toLowerCase();
    const badgeClass = (rawType === 'sale') ? 'sale' : (rawType === 'rent' || rawType === 'lease') ? 'rent' : 'sale';
    
    let imageUrl = 'https://via.placeholder.com/400x200/0b2e52/white?text=No+Image';
    if (listing.photos && listing.photos.length > 0) {
      imageUrl = listing.photos[0];
    } else if (listing.imageUrls && listing.imageUrls.length > 0) {
      imageUrl = listing.imageUrls[0];
    } else if (listing.latitude && listing.longitude) {
      imageUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${listing.latitude},${listing.longitude}&zoom=15&size=400x200&markers=color:red%7C${listing.latitude},${listing.longitude}&key=${GOOGLE_MAPS_API_KEY}`;
    }
    
    const initials = userInfo.displayName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || 'UU';
    const avatarHtml = (userInfo.photoURL)
      ? `<img src="${(userInfo.photoURL || '').replace(/"/g, '&quot;')}" alt="${(userInfo.displayName || '').replace(/"/g, '&quot;')}" onerror="this.parentElement.innerHTML='${initials}'">`
      : initials;
    
    let statusText = listing.status || 'active';
    let statusClass = 'status-active';
    let showStatus = false;

    if (statusText.toLowerCase() === 'active' || statusText.toLowerCase() === 'available' || 
        statusText.toLowerCase() === 'published' || statusText === true || statusText === 'true') {
      statusText = '';
      statusClass = '';
      showStatus = false;
    } else if (statusText.toLowerCase() === 'pending') {
      statusClass = 'status-pending';
      showStatus = true;
    } else {
      showStatus = true;
    }
    
    return `
    <div class="listing-card-wrapper">
      <div class="listing-card" data-listing-id="${listing.id}">
        <a href="property_details.html?id=${listing.id}" class="card-link-overlay" aria-label="View ${listing.title}"></a>
        <div class="listing-card-image-container">
          <span class="listing-type-badge ${badgeClass}">${listingType}</span>
          <img src="${imageUrl}" alt="${listing.title}" class="listing-image">
        </div>
        <div class="listing-content">
          <div class="listing-header">
            <div style="flex: 1; min-width: 0;">
              <h3 class="listing-title">${listing.title || 'Untitled Property'}</h3>
            </div>
            <div class="listing-price">${priceInfo.label}</div>
          </div>
          <div class="listing-location">
            <i class="fas fa-map-marker-alt" style="flex-shrink: 0;"></i>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${listing.address || listing.location || 'Location not specified'} · ${listingType}</span>
          </div>
          <div class="listing-details">
            <div class="detail"><i class="fas fa-bed"></i> ${listing.bedrooms || 0} beds</div>
            <div class="detail"><i class="fas fa-bath"></i> ${listing.bathrooms || 0} baths</div>
            <div class="detail"><i class="fas fa-ruler-combined"></i> ${listing.floorArea || listing.totalArea || listing.squareFootage || 'N/A'} ${typeof (listing.floorArea || listing.totalArea) === 'number' ? 'sqm' : ''}</div>
          </div>
          <div class="listing-broker">
            <div class="broker-avatar">${avatarHtml}</div>
            <div class="broker-info">
              <div class="broker-name">${userInfo.displayName}</div>
              <div class="broker-contact">
                ${getRoleDisplayText(userInfo.role)} · ${listing.propertyType || 'Property'}
              </div>
            </div>
          </div>
          ${showStatus ? `<div class="listing-status ${statusClass}">${statusText}</div>` : ''}
        </div>
      </div>
    </div>
    `;
  }).join('');
}

// Update dashboard statistics
function updateStats(listings) {
  const total = listings.length;
  
  // Count new listings from today
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const newToday = listings.filter(listing => {
    if (!listing.createdAt) return false;
    
    try {
      let listingDate;
      if (listing.createdAt.toDate) {
        listingDate = listing.createdAt.toDate();
      } else if (listing.createdAt.seconds) {
        listingDate = new Date(listing.createdAt.seconds * 1000);
      } else if (typeof listing.createdAt === 'string') {
        listingDate = new Date(listing.createdAt);
      } else if (typeof listing.createdAt === 'number') {
        listingDate = new Date(listing.createdAt);
      } else {
        return false;
      }
      return listingDate >= today;
    } catch (e) {
      return false;
    }
  }).length;
  
  document.getElementById('totalListings').textContent = total;
  document.getElementById('newToday').textContent = newToday;
  const countEl = document.getElementById('propertiesCount');
  if (countEl) countEl.textContent = `${total} propert${total === 1 ? 'y' : 'ies'} on the platform`;
}

// Apply filters to listings
function applyFilters() {
  const typeFilter = document.getElementById('filterType').value.toLowerCase();
  const listingTypeFilter = document.getElementById('filterListingType').value.toLowerCase();
  const priceFilter = document.getElementById('filterPrice').value;
  const locationFilter = document.getElementById('filterLocation').value.toLowerCase();
  
  const filtered = allListings.filter(listing => {
    // Property type filter
    if (typeFilter && listing.propertyType && !listing.propertyType.toLowerCase().includes(typeFilter)) {
      return false;
    }
    
    // Listing type filter
    if (listingTypeFilter) {
      const listingType = (listing.type || listing.listingType || '').toLowerCase();
      if (listingType !== listingTypeFilter) return false;
    }
    
    // Price filter
    if (priceFilter) {
      const [min, max] = priceFilter.split('-').map(Number);
      const priceInfo = getPriceInfo(listing);
      if (priceInfo.price < min || priceInfo.price > max) return false;
    }
    
    // Location filter
    if (locationFilter) {
      const location = (listing.address || listing.location || '').toLowerCase();
      if (!location.includes(locationFilter)) return false;
    }
    
    return true;
  });
  
  if (filtered.length === 0) {
    document.getElementById('listingsContainer').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <h3>No Properties Match Your Filters</h3>
        <p>Try adjusting your search criteria to see more results.</p>
      </div>
    `;
    const countEl = document.getElementById('propertiesCount');
    if (countEl) countEl.textContent = 'No properties match your filters';
  } else {
    displayListings(filtered);
    const countEl = document.getElementById('propertiesCount');
    if (countEl) countEl.textContent = `${filtered.length} propert${filtered.length === 1 ? 'y' : 'ies'} matching filters`;
  }
}

// Event Listeners
document.getElementById('applyFilters').addEventListener('click', applyFilters);
document.getElementById('resetFilters').addEventListener('click', function() {
  document.getElementById('filterType').value = '';
  document.getElementById('filterListingType').value = '';
  document.getElementById('filterPrice').value = '';
  document.getElementById('filterLocation').value = '';
  displayListings(allListings);
  updateStats(allListings);
});

// Load current landlord profile from users collection and update sidebar (landlords are in users, NOT brokers)
async function loadCurrentUserProfile(user) {
  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) return;
    const userData = userSnap.data();
    const profileData = {
      fullName: userData.fullName || userData.displayName || userData.name || ((userData.firstName || '') + ' ' + (userData.lastName || '')).trim() || user.email?.split('@')[0] || 'Property Owner',
      email: userData.email || user.email,
      role: userData.role || 'landlord',
      photoURL: userData.photoURL || userData.profilePhotoURL || userData.profilePhoto || userData.profileImage || user.photoURL
    };
    try { localStorage.setItem('userData', JSON.stringify(profileData)); } catch (e) {}
    if (typeof window.updateSidebarUserProfile === 'function') window.updateSidebarUserProfile(profileData);
  } catch (e) { console.warn('Could not load landlord profile:', e); }
}

onAuthStateChanged(auth, async (user) => {

    window.location.href = "../login.html";
  } else {

    await loadCurrentUserProfile(user);
    loadAllListings();
  }
});

window.performLogout = async function() {
  try {
    await signOut(auth);
    localStorage.removeItem('userData');
    sessionStorage.removeItem('userData');
    window.location.href = "../login.html";
  } catch (e) {
    console.error('Logout error:', e);
    window.location.href = "../login.html";
  }
};
