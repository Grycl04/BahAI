<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Schedule Viewing - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
    :root {
      --primary: #0b2e52;
      --primary-dark: #001F3F;
      --primary-light: #002f3f;
      --secondary: #1976d2;
      --accent: #ff9800;
      --text-dark: #1a202c;
      --text-light: #718096;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 30px;
      border: 1px solid var(--border);
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .page-header p {
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.4;
    }

    .participant-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-light);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .participant-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }

    .participant-details h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .participant-details p {
      font-size: 13px;
      color: var(--text-light);
    }

    .property-info {
      background: var(--bg-light);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .property-info:hover {
      background: var(--bg-white);
      box-shadow: var(--shadow);
    }

    .property-info h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .property-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .property-detail {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text-light);
    }

    .property-detail i {
      color: var(--primary);
      font-size: 12px;
    }

    .scheduling-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 30px;
    }

    .schedule-section {
      background: var(--bg-white);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .schedule-section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .schedule-section h2 i {
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--text-dark);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 46, 82, 0.1);
    }

    .form-control.error {
      border-color: var(--error);
    }

    .error-message {
      color: var(--error);
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .flatpickr-input {
      background: white !important;
    }

    .time-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .time-slot {
      padding: 10px;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--bg-white);
    }

    .time-slot:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .time-slot.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .time-slot.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--bg-light);
    }

    .time-slot.disabled:hover {
      transform: none;
      border-color: var(--border);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-confirmed {
      background: #d1fae5;
      color: #065f46;
    }

    .status-declined {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-rescheduled {
      background: #dbeafe;
      color: #1e40af;
    }

    .schedule-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
    }

    .action-btn.primary {
      background: var(--primary);
      color: white;
    }

    .action-btn.primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .action-btn.secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:hover {
      background: var(--border);
    }

    .action-btn.success {
      background: var(--success);
      color: white;
    }

    .action-btn.success:hover {
      background: #0da271;
      transform: translateY(-2px);
    }

    .action-btn.warning {
      background: var(--warning);
      color: white;
    }

    .action-btn.warning:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    .action-btn.error {
      background: var(--error);
      color: white;
    }

    .action-btn.error:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .alternative-times {
      margin-top: 15px;
    }

    .alternative-time {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alternative-time .time {
      font-weight: 500;
      color: var(--primary);
    }

    .alternative-time .status {
      font-size: 11px;
      font-weight: 600;
    }

    .schedule-history {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .history-item {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .history-date {
      font-weight: 600;
      font-size: 13px;
      color: var(--primary);
    }

    .history-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .history-details {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 5px;
    }

    .history-note {
      font-size: 12px;
      color: var(--text-dark);
      font-style: italic;
      padding: 5px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
    }

    .availability-calendar {
      margin-top: 15px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-nav {
      display: flex;
      gap: 5px;
    }

    .calendar-nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav-btn:hover {
      background: var(--bg-light);
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .calendar-day {
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .calendar-day:hover {
      background: var(--bg-light);
    }

    .calendar-day.selected {
      background: var(--primary);
      color: white;
    }

    .calendar-day.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: var(--bg-light);
    }

    .calendar-day.today {
      border: 2px solid var(--accent);
    }

    .calendar-day-header {
      text-align: center;
      padding: 5px 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--success);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
      animation: slideInRight 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    .toast.error {
      background: var(--error);
    }

    .toast.warning {
      background: var(--warning);
    }

    .toast.info {
      background: var(--info);
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .spinner {
      border: 4px solid var(--bg-light);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-light);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      
      .scheduling-container {
        grid-template-columns: 1fr;
      }
      
      .participant-info {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      
      .property-details {
        grid-template-columns: 1fr;
        gap: 5px;
      }
      
      .time-slots {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .schedule-actions {
        flex-direction: column;
        gap: 10px;
      }
      
      .action-btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      
      .page-header h1 {
        font-size: 22px;
      }
      
      .time-slots {
        grid-template-columns: 1fr;
      }
      
      .calendar-days {
        grid-template-columns: repeat(7, 1fr);
        font-size: 10px;
      }
    }
</style>
</head>

<body>
<div class="container">
  <div class="page-header">
    <h1><i class="fas fa-calendar-check"></i> Schedule Property Viewing</h1>
    <p>Propose, confirm, or reschedule property viewing appointments</p>
  </div>

  <div class="participant-info" id="participantInfo">
    <div class="participant" id="buyerInfo">
      <div class="participant-avatar" id="buyerAvatar">BU</div>
      <div class="participant-details">
        <h3 id="buyerName">Loading...</h3>
        <p id="buyerRole">Buyer</p>
      </div>
    </div>
    
    <div style="text-align: center;">
      <i class="fas fa-exchange-alt" style="color: var(--primary);"></i>
    </div>
    
    <div class="participant" id="brokerInfo">
      <div class="participant-avatar" id="brokerAvatar">BR</div>
      <div class="participant-details">
        <h3 id="brokerName">Loading...</h3>
        <p id="brokerRole">Broker/Agent</p>
      </div>
    </div>
  </div>

  <div class="property-info" id="propertyInfo">
    <h3 id="propertyTitle">Loading property details...</h3>
    <div class="property-details" id="propertyDetails">
      <div class="property-detail"><i class="fas fa-map-marker-alt"></i> <span id="propertyLocation">Loading...</span></div>
      <div class="property-detail"><i class="fas fa-tag"></i> <span id="propertyPrice">Loading...</span></div>
      <div class="property-detail"><i class="fas fa-home"></i> <span id="propertyType">Loading...</span></div>
    </div>
  </div>

  <div id="schedulingContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading scheduling information...</p>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  getDocs, 
  getDoc, 
  doc, 
  addDoc, 
  updateDoc, 
  setDoc,
  deleteDoc,
  onSnapshot, 
  serverTimestamp,
  orderBy,
  writeBatch,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.firebasestorage.app",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Global variables
let currentUser = null;
let currentUserRole = null;
let otherParticipant = null;
let otherParticipantRole = null;
let propertyId = null;
let propertyData = null;
let conversationId = null;
let selectedDate = null;
let selectedTime = null;
let currentSchedule = null;
let alternativeDates = [];

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  initPage();
});

// Initialize the page
async function initPage() {
  console.log('🚀 Initializing scheduling page...');
  
  // Get URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const buyerId = urlParams.get('buyerId');
  const brokerId = urlParams.get('brokerId');
  propertyId = urlParams.get('propertyId');
  const brokerName = urlParams.get('brokerName');
  const buyerName = urlParams.get('buyerName');
  const propertyName = urlParams.get('propertyName');
  
  // Wait for auth state
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    
    currentUser = user;
    
    // Load current user data
    await loadCurrentUserData();
    
    // Determine roles and other participant
    if (currentUserRole === 'buyer') {
      otherParticipant = brokerId || urlParams.get('brokerId');
      otherParticipantRole = 'broker';
    } else {
      otherParticipant = buyerId || urlParams.get('buyerId');
      otherParticipantRole = 'buyer';
    }
    
    // Update UI with URL parameters if available
    if (brokerName) {
      document.getElementById('brokerName').textContent = decodeURIComponent(brokerName);
      document.getElementById('brokerAvatar').textContent = getInitials(decodeURIComponent(brokerName));
    }
    
    if (buyerName) {
      document.getElementById('buyerName').textContent = decodeURIComponent(buyerName);
      document.getElementById('buyerAvatar').textContent = getInitials(decodeURIComponent(buyerName));
    }
    
    if (propertyName) {
      document.getElementById('propertyTitle').textContent = decodeURIComponent(propertyName);
    }
    
    // Load all data
    await loadAllData();
  });
}

// Load current user data
async function loadCurrentUserData() {
  try {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      const userData = userDoc.data();
      currentUserRole = userData.role || 'buyer';
      
      // Update UI with current user info
      const displayName = extractUserName(userData);
      const avatarElement = currentUserRole === 'buyer' ? 
        document.getElementById('buyerAvatar') : document.getElementById('brokerAvatar');
      const nameElement = currentUserRole === 'buyer' ? 
        document.getElementById('buyerName') : document.getElementById('brokerName');
      const roleElement = currentUserRole === 'buyer' ? 
        document.getElementById('buyerRole') : document.getElementById('brokerRole');
      
      avatarElement.textContent = getInitials(displayName);
      nameElement.textContent = displayName;
      roleElement.textContent = currentUserRole === 'buyer' ? 'Buyer' : 
                               currentUserRole === 'broker' ? 'Licensed Broker' : 
                               currentUserRole === 'landlord' ? 'Property Owner' : 'Contact';
    }
  } catch (error) {
    console.error('Error loading current user data:', error);
  }
}

// Load all data
async function loadAllData() {
  try {
    // Load other participant data
    if (otherParticipant) {
      await loadParticipantData(otherParticipant, otherParticipantRole);
    }
    
    // Load property data
    if (propertyId) {
      await loadPropertyData();
    }
    
    // Find or create conversation ID
    conversationId = [currentUser.uid, otherParticipant].sort().join('_');
    
    // Load existing schedule
    await loadExistingSchedule();
    
    // Render appropriate interface based on user role and schedule status
    renderSchedulingInterface();
    
  } catch (error) {
    console.error('Error loading data:', error);
    showError('Failed to load data: ' + error.message);
  }
}

// Load participant data
async function loadParticipantData(participantId, role) {
  try {
    const userDoc = await getDoc(doc(db, "users", participantId));
    if (userDoc.exists()) {
      const userData = userDoc.data();
      const displayName = extractUserName(userData);
      
      const avatarElement = role === 'buyer' ? 
        document.getElementById('buyerAvatar') : document.getElementById('brokerAvatar');
      const nameElement = role === 'buyer' ? 
        document.getElementById('buyerName') : document.getElementById('brokerName');
      const roleElement = role === 'buyer' ? 
        document.getElementById('buyerRole') : document.getElementById('brokerRole');
      
      avatarElement.textContent = getInitials(displayName);
      nameElement.textContent = displayName;
      roleElement.textContent = role === 'buyer' ? 'Buyer' : 
                               role === 'broker' ? 'Licensed Broker' : 
                               role === 'landlord' ? 'Property Owner' : 'Contact';
    }
  } catch (error) {
    console.error('Error loading participant data:', error);
  }
}

// Load property data
async function loadPropertyData() {
  try {
    const propertyDoc = await getDoc(doc(db, "properties", propertyId));
    if (propertyDoc.exists()) {
      propertyData = propertyDoc.data();
      
      // Update UI
      document.getElementById('propertyTitle').textContent = propertyData.title || 'Untitled Property';
      document.getElementById('propertyLocation').textContent = 
        propertyData.location || propertyData.address || 'Location not specified';
      
      // Format price
      const price = propertyData.pricing || propertyData.monthlyRent || propertyData.price || 0;
      const isRental = propertyData.type === 'rent' || (price < 1000000);
      const priceDisplay = isRental ? `₱${price.toLocaleString()}/month` : `₱${price.toLocaleString()}`;
      document.getElementById('propertyPrice').textContent = priceDisplay;
      
      document.getElementById('propertyType').textContent = 
        propertyData.propertyType || propertyData.type || 'Property';
    }
  } catch (error) {
    console.error('Error loading property data:', error);
  }
}

// Load existing schedule
async function loadExistingSchedule() {
  try {
    const schedulesRef = collection(db, 'schedules');
    const q = query(
      schedulesRef,
      where('conversationId', '==', conversationId),
      where('propertyId', '==', propertyId),
      orderBy('createdAt', 'desc')
    );
    
    const snapshot = await getDocs(q);
    
    if (!snapshot.empty) {
      // Get the most recent schedule
      currentSchedule = snapshot.docs[0].data();
      currentSchedule.id = snapshot.docs[0].id;
      
      // Also get all alternative dates
      alternativeDates = [];
      snapshot.docs.forEach(doc => {
        const schedule = doc.data();
        if (schedule.status === 'alternative') {
          alternativeDates.push({
            id: doc.id,
            ...schedule
          });
        }
      });
      
      console.log('📅 Loaded existing schedule:', currentSchedule);
    }
  } catch (error) {
    console.error('Error loading schedule:', error);
  }
}

// Initialize date picker
function initializeDatePicker() {
  // Initialize any flatpickr instances
  const dateInputs = document.querySelectorAll('.flatpickr-input');
  dateInputs.forEach(input => {
    flatpickr(input, {
      minDate: 'today',
      dateFormat: 'Y-m-d',
      onChange: function(selectedDates, dateStr, instance) {
        selectedDate = dateStr;
        // Clear any error
        input.classList.remove('error');
      }
    });
  });
  
  // Generate calendar if needed
  generateAvailabilityCalendar();
}

// Generate availability calendar
function generateAvailabilityCalendar() {
  const calendarEl = document.getElementById('availabilityCalendar');
  if (!calendarEl) return;
  
  const today = new Date();
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();
  
  // Get days in month
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  
  // Generate calendar HTML
  let calendarHTML = `
    <div class="calendar-header">
      <span style="font-weight: 600;">${today.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</span>
      <div class="calendar-nav">
        <button class="calendar-nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
        <button class="calendar-nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    
    <div class="calendar-days">
      <div class="calendar-day-header">Sun</div>
      <div class="calendar-day-header">Mon</div>
      <div class="calendar-day-header">Tue</div>
      <div class="calendar-day-header">Wed</div>
      <div class="calendar-day-header">Thu</div>
      <div class="calendar-day-header">Fri</div>
      <div class="calendar-day-header">Sat</div>
  `;
  
  // Add empty cells for days before first day of month
  for (let i = 0; i < firstDay; i++) {
    calendarHTML += `<div class="calendar-day disabled"></div>`;
  }
  
  // Add days of month
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = day === today.getDate() && currentMonth === today.getMonth();
    const isSelected = selectedDate === dateStr;
    const isPast = new Date(dateStr) < new Date(today.toDateString());
    
    calendarHTML += `
      <div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${isPast ? 'disabled' : ''}"
           data-date="${dateStr}">
        ${day}
      </div>
    `;
  }
  
  calendarHTML += `</div>`;
  calendarEl.innerHTML = calendarHTML;
  
  // Add event listeners for calendar days
  document.querySelectorAll('.calendar-day:not(.disabled)').forEach(day => {
    day.addEventListener('click', function() {
      selectedDate = this.dataset.date;
      
      // Update selected state
      document.querySelectorAll('.calendar-day').forEach(d => {
        d.classList.remove('selected');
      });
      this.classList.add('selected');
      
      // Update date input if exists
      const dateInput = document.getElementById('proposedDate') || document.getElementById('alternativeDate');
      if (dateInput) {
        dateInput.value = selectedDate;
      }
    });
  });
}

// Attach event listeners
function attachEventListeners() {
  // Time slot selection
  document.querySelectorAll('.time-slot:not(.disabled)').forEach(slot => {
    slot.addEventListener('click', function() {
      // Remove selected class from all slots
      document.querySelectorAll('.time-slot').forEach(s => {
        s.classList.remove('selected');
      });
      
      // Add selected class to clicked slot
      this.classList.add('selected');
      selectedTime = this.dataset.time;
      
      // Clear time error
      const timeError = document.getElementById('timeError') || document.getElementById('altTimeError');
      if (timeError) {
        timeError.classList.remove('show');
      }
    });
  });
  
  // Propose schedule button (for buyers)
  const proposeBtn = document.getElementById('proposeBtn');
  if (proposeBtn) {
    proposeBtn.addEventListener('click', proposeSchedule);
  }
  
  // Cancel button
  const cancelBtn = document.getElementById('cancelBtn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() {
      if (window.opener) {
        window.close();
      } else {
        window.history.back();
      }
    });
  }
  
  // Broker action buttons
  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', confirmSchedule);
  }
  
  const declineBtn = document.getElementById('declineBtn');
  if (declineBtn) {
    declineBtn.addEventListener('click', declineSchedule);
  }
  
  const suggestAltBtn = document.getElementById('suggestAltBtn');
  if (suggestAltBtn) {
    suggestAltBtn.addEventListener('click', function() {
      document.getElementById('alternativeSection').style.display = 'block';
      initializeDatePicker();
    });
  }
  
  const cancelAltBtn = document.getElementById('cancelAltBtn');
  if (cancelAltBtn) {
    cancelAltBtn.addEventListener('click', function() {
      document.getElementById('alternativeSection').style.display = 'none';
    });
  }
  
  const submitAltBtn = document.getElementById('submitAltBtn');
  if (submitAltBtn) {
    submitAltBtn.addEventListener('click', suggestAlternative);
  }
  
  // New proposal button
  const newProposalBtn = document.getElementById('newProposalBtn');
  if (newProposalBtn) {
    newProposalBtn.addEventListener('click', function() {
      renderSchedulingInterface();
    });
  }
  
  // Accept alternative button
  const acceptAltBtn = document.getElementById('acceptAltBtn');
  if (acceptAltBtn && !acceptAltBtn.onclick) {
    acceptAltBtn.addEventListener('click', acceptAlternative);
  }
  
  // Decline alternative button
  const declineAltBtn = document.getElementById('declineAltBtn');
  if (declineAltBtn) {
    declineAltBtn.addEventListener('click', declineAlternative);
  }
  
  // Reschedule button
  const rescheduleBtn = document.getElementById('rescheduleBtn');
  if (rescheduleBtn) {
    rescheduleBtn.addEventListener('click', rescheduleAppointment);
  }
  
  // Cancel appointment button
  const cancelAppointmentBtn = document.getElementById('cancelAppointmentBtn');
  if (cancelAppointmentBtn) {
    cancelAppointmentBtn.addEventListener('click', cancelAppointment);
  }
  
  // Request cancellation button
  const requestCancelBtn = document.getElementById('requestCancelBtn');
  if (requestCancelBtn) {
    requestCancelBtn.addEventListener('click', requestCancellation);
  }
}

// Propose schedule (buyer)
async function proposeSchedule() {
  // Validate inputs
  const dateInput = document.getElementById('proposedDate');
  const timeSlots = document.querySelectorAll('#timeSlots .time-slot.selected');
  
  if (!dateInput || !dateInput.value) {
    showError('Please select a date');
    dateInput.classList.add('error');
    return;
  }
  
  if (timeSlots.length === 0) {
    showError('Please select a time slot');
    document.getElementById('timeError').classList.add('show');

// ==================== UTILITY FUNCTIONS ====================

// Extract user name from user data
function extractUserName(userData) {
  if (!userData) return 'Unknown User';
  
  if (userData.fullName && userData.fullName.trim()) {
    return userData.fullName.trim();
  }
  if (userData.displayName && userData.displayName.trim()) {
    return userData.displayName.trim();
  }
  if (userData.name && userData.name.trim()) {
    return userData.name.trim();
  }
  if (userData.firstName || userData.lastName) {
    const firstName = userData.firstName || '';
    const lastName = userData.lastName || '';
    return `${firstName} ${lastName}`.trim();
  }
  if (userData.email) {
    return userData.email.split('@')[0];
  }
  
  return 'Unknown User';
}

// Get initials from name
function getInitials(name) {
  if (!name || name.trim() === '') return '??';
  
  const words = name.trim().split(/\s+/);
  
  if (words.length === 0) return '??';
  
  if (words.length === 1) {
    return words[0].substring(0, 2).toUpperCase();
  } else {
    return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
  }
}

// Format time for display
function formatTime(timeStr) {
  if (!timeStr) return '';
  
  const [hours, minutes] = timeStr.split(':').map(Number);
  const period = hours >= 12 ? 'PM' : 'AM';
  const displayHours = hours % 12 || 12;
  
  return `${displayHours}:${minutes.toString().padStart(2, '0')} ${period}`;
}

// Show toast notification
function showToast(message, type = 'success') {
  const toastContainer = document.getElementById('toastContainer');
  
  // Remove existing toast
  const existingToast = document.querySelector('.toast');
  if (existingToast) {
    existingToast.remove();
  }
  
  // Create new toast
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <i class="fas fa-${type === 'success' ? 'check-circle' : 
                     type === 'error' ? 'exclamation-circle' : 
                     type === 'warning' ? 'exclamation-triangle' : 
                     'info-circle'}"></i>
    <span>${message}</span>
  `;
  
  toastContainer.appendChild(toast);
  
  // Auto-remove after 3 seconds
  setTimeout(() => {
    toast.style.animation = 'slideOutRight 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Show error message
function showError(message) {
  showToast(message, 'error');
}
