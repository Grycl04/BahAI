<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Property Details - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
    :root {
      --primary: #0b2e52;
      --primary-dark: #071e38;
      --primary-light: #1e3a5f;
      --primary-gradient: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
      --accent: #d4af37;
      --accent-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      --text-dark: #1a202c;
      --text-light: #64748b;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: var(--text-dark); display: flex; min-height: 100vh; overflow-x: hidden; }

    .mobile-menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 1001;
      background: var(--primary-gradient); color: white; border: none; width: 50px; height: 50px;
      border-radius: 12px; font-size: 24px; cursor: pointer; align-items: center; justify-content: center; }
    .sidebar-overlay { display: none; }
    .container { flex: 1; margin-left: 280px; padding: 24px; transition: margin-left 0.3s ease; }

    .back-button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; margin-bottom: 24px;
      background: white; border: 2px solid var(--border); border-radius: var(--radius); color: var(--text-dark);
      font-weight: 600; text-decoration: none; transition: all 0.2s; cursor: pointer; }
    .back-button:hover { border-color: var(--primary); color: var(--primary); }

    /* Gallery Hero - same as buyer new_property_details */
    .gallery-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--primary); margin-bottom: 24px; }
    .gallery-hero .main-media-wrap { width: 100%; height: 420px; position: relative; }
    .gallery-hero .main-media-wrap img, .gallery-hero .main-media-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-hero .main-media-wrap video { background: #000; }
    .gallery-badges { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; flex-wrap: wrap; z-index: 2; }
    .badge { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-sale { background: var(--accent); color: white; }
    .badge-rent { background: #059669; color: white; }
    .badge-lease { background: #0ea5e9; color: white; }
    .badge-active { background: white; color: var(--primary); }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .gallery-image-count { position: absolute; bottom: 60px; right: 20px; background: rgba(0,0,0,0.6); color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 2; }
    .image-navigation { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; transform: translateY(-50%); z-index: 2; }
    .image-nav-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.9); border: none; color: var(--text-dark); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
    .image-nav-btn:hover { background: white; transform: scale(1.1); }
    .image-nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .gallery-thumbs { display: flex; gap: 8px; padding: 12px; background: rgba(0,0,0,0.5); overflow-x: auto; }
    .gallery-thumbs .thumb-item { width: 80px; height: 60px; border-radius: 8px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; flex-shrink: 0; overflow: hidden; position: relative; }
    .gallery-thumbs .thumb-item:hover, .gallery-thumbs .thumb-item.active { opacity: 1; border: 2px solid white; }
    .gallery-thumbs .thumb-item img, .gallery-thumbs .thumb-item video { width: 100%; height: 100%; object-fit: cover; }
    .video-badge { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }

    /* Content Grid - same as buyer */
    .content-grid { display: grid; grid-template-columns: 1fr 420px; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

    /* Cards */
    .card { background: white; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .card-title { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    /* Property Header */
    .prop-header { margin-bottom: 24px; }
    .prop-title { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; line-height: 1.3; }
    .prop-location { display: flex; align-items: center; gap: 8px; color: var(--text-light); font-size: 15px; margin-bottom: 16px; }
    .prop-price { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
    .prop-stats { display: flex; flex-wrap: wrap; gap: 24px; }
    .stat { display: flex; align-items: center; gap: 10px; }
    .stat i { color: var(--primary); font-size: 18px; }
    .stat span { font-weight: 600; color: var(--text-dark); }

    /* Detail Rows */
    .detail-grid { display: grid; gap: 12px; }
    .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px; background: var(--bg-light); border-radius: var(--radius); }
    .detail-label { font-size: 13px; color: var(--text-light); font-weight: 500; }
    .detail-value { font-size: 15px; font-weight: 600; color: var(--text-dark); text-align: right; }

    /* Contact Card */
    .contact-card { background: var(--primary-gradient); color: white; border-radius: var(--radius-lg); padding: 28px; display: flex; flex-direction: column; width: 100%; }
    .contact-header { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
    .contact-profile { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
    .contact-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; overflow: hidden; flex-shrink: 0; }
    .contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .contact-profile-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .contact-role { font-size: 16px; opacity: 0.95; margin-bottom: 4px; }
    .contact-methods { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; flex: 1; }
    .contact-method { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: rgba(255,255,255,0.1); border-radius: var(--radius); font-size: 16px; min-height: 56px; }
    .contact-method i { width: 24px; text-align: center; font-size: 18px; flex-shrink: 0; }
    .contact-btn { width: 100%; padding: 16px 24px; border-radius: var(--radius); border: none; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; background: white; color: var(--primary); transition: all 0.2s; text-decoration: none; }
    .contact-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

    /* Amenities */
    .amenities-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .amenity-chip { padding: 8px 16px; background: var(--bg-light); border-radius: 20px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }

    /* Description */
    .desc-text { font-size: 15px; line-height: 1.7; color: var(--text-dark); white-space: pre-wrap; }

    /* Map */
    .map-container { height: 280px; border-radius: var(--radius); overflow: hidden; background: var(--bg-light); }
    #propertyMap { width: 100%; height: 100%; min-height: 280px; }

    /* Mortgage Calculator */
    .calc-widget { background: white; border-radius: var(--radius-lg); padding: 20px; margin-top: 20px; box-shadow: var(--shadow); }
    .calc-widget h3 { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .calc-input-group { margin-bottom: 12px; }
    .calc-input-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-light); margin-bottom: 4px; }
    .calc-input-group input[type="number"], .calc-input-group select { width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; }
    .calc-input-group input[type="range"] { width: 100%; height: 6px; margin: 4px 0; }
    .calc-range-row { display: flex; align-items: center; gap: 10px; }
    .calc-range-row .range-val { font-size: 13px; font-weight: 600; color: var(--primary); min-width: 40px; }
    .calc-btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius); font-weight: 600; font-size: 14px; cursor: pointer; background: var(--primary-gradient); color: white; margin-top: 8px; }
    .calc-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .calc-results { background: var(--primary-gradient); color: white; padding: 16px; border-radius: var(--radius); margin-top: 12px; font-size: 13px; }
    .calc-results .monthly { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .calc-results .note { font-size: 11px; opacity: 0.9; margin-top: 8px; }

    .trust-note { font-size: 0.8rem; color: var(--text-light); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
    .trust-note i { color: var(--success); }

    /* Loading & Error */
    .loading-state { text-align: center; padding: 80px 20px; color: var(--text-light); }
    .loading-state .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { text-align: center; padding: 100px 20px; background: var(--bg-white); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .error-icon { font-size: 48px; margin-bottom: 20px; color: var(--danger); }
    .financing-options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .financing-badge { background: var(--bg-light); padding: 6px 12px; border-radius: 20px; font-size: 13px; color: var(--text-dark); border: 1px solid var(--border); }

    /* Toast Styles */
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .container { margin-left: 0; padding: 24px; padding-top: 70px; }
      .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
      .content-grid { grid-template-columns: 1fr; gap: 20px; }
      .gallery-hero .main-media-wrap { height: 380px; }
      .prop-title { font-size: 26px; }
      .prop-price { font-size: 28px; }
    }
    @media (max-width: 768px) {
      .container { padding: 16px; padding-top: 64px; }
      .container > div:first-child { position: fixed; top: 20px; right: 16px; z-index: 1001; margin: 0; }
      .back-button { padding: 10px 18px; font-size: 0.9rem; margin-bottom: 0; }
      .gallery-hero { margin-bottom: 18px; border-radius: var(--radius); }
      .gallery-hero .main-media-wrap { height: 280px; }
      .gallery-badges { top: 12px; left: 12px; gap: 8px; }
      .badge { padding: 6px 12px; font-size: 11px; }
      .gallery-image-count { bottom: 50px; right: 12px; padding: 5px 10px; font-size: 11px; }
      .image-navigation { padding: 0 12px; }
      .image-nav-btn { width: 44px; height: 44px; font-size: 18px; }
      .gallery-thumbs { padding: 10px; gap: 6px; }
      .gallery-thumbs .thumb-item { width: 64px; height: 48px; }
      .card { padding: 18px; margin-bottom: 16px; border-radius: var(--radius); }
      .card-title { font-size: 16px; margin-bottom: 12px; }
      .prop-header { margin-bottom: 18px; }
      .prop-title { font-size: 22px; margin-bottom: 10px; line-height: 1.25; }
      .prop-location { font-size: 14px; margin-bottom: 12px; }
      .prop-price { font-size: 26px; margin-bottom: 16px; }
      .prop-stats { gap: 16px; }
      .stat i { font-size: 16px; }
      .stat span { font-size: 14px; }
      .detail-row { padding: 10px 14px; }
      .detail-label { font-size: 12px; }
      .detail-value { font-size: 14px; }
      .contact-card { padding: 20px; border-radius: var(--radius); }
      .contact-header { font-size: 18px; margin-bottom: 18px; }
      .contact-profile { flex-direction: column; text-align: center; gap: 14px; margin-bottom: 18px; }
      .contact-avatar { width: 64px; height: 64px; font-size: 20px; }
      .contact-name { font-size: 18px; }
      .contact-role { font-size: 14px; }
      .contact-method { padding: 12px 14px; font-size: 14px; min-height: 48px; }
      .contact-btn { padding: 14px 20px; font-size: 15px; min-height: 48px; }
      .amenity-chip { padding: 6px 12px; font-size: 12px; }
      .desc-text { font-size: 14px; line-height: 1.6; }
      .map-container { height: 220px; }
      #propertyMap { min-height: 220px; }
      .calc-widget { padding: 16px; margin-top: 16px; }
      .calc-widget h3 { font-size: 14px; margin-bottom: 10px; }
      .calc-results .monthly { font-size: 18px; }
      .loading-state { padding: 50px 16px; }
      .error-state { padding: 60px 16px; }
      /* Mobile sidebar overlay */
      .sidebar { position: fixed; top: 0; left: 0; width: 260px; max-width: 80%; height: 100vh; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 1000; }
      .sidebar-overlay { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      body.sidebar-open { overflow: hidden; }
      body.sidebar-open .sidebar { transform: translateX(0); z-index: 1001; }
      body.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }
    }
    @media (max-width: 480px) {
      .container { padding: 12px; padding-top: 58px; }
      .mobile-menu-toggle { top: 12px; left: 12px; width: 44px; height: 44px; font-size: 20px; }
      .container > div:first-child { top: 12px; right: 12px; }
      .back-button { padding: 10px 14px; font-size: 0.85rem; }
      .gallery-hero .main-media-wrap { height: 240px; }
      .gallery-badges { top: 8px; left: 8px; }
      .badge { padding: 5px 10px; font-size: 10px; }
      .image-nav-btn { width: 40px; height: 40px; font-size: 16px; }

      .stat i { font-size: 14px; }

<!-- Mobile Menu Toggle -->
<button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>

<!-- Include Sidebar -->
<div id="sidebar-container"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Main Content -->
<div class="container">
    <!-- Back Button - Will be dynamically updated -->
    <div>
        <button id="backButton" class="back-button">
            <i class="fas fa-arrow-left"></i> Back
        </button>
    </div>

    <!-- Property Details Container -->
    <div id="propertyDetailsContainer">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading property details...</p>

        </div>
    </div>
</div>

<!-- Sidebar User Profile (needed for agent/broker sidebar) -->
<script src="../sidebar-user.js"></script>
<!-- Sidebar Loader Script -->
<script>
// Mobile menu functionality
var mobileMenuBtn = document.getElementById('mobileMenuToggle');
if (mobileMenuBtn) {
    mobileMenuBtn.addEventListener('click', function() {
        document.body.classList.toggle('sidebar-open');
    });
}
var overlayEl = document.getElementById('sidebarOverlay');
if (overlayEl) {
    overlayEl.addEventListener('click', function() {
        document.body.classList.remove('sidebar-open');
    });
}
window.addEventListener('resize', function() {
    if (window.innerWidth > 768) document.body.classList.remove('sidebar-open');
});

// Simple logout function
function setupLogoutButton() {
    const logoutBtn = document.getElementById("logoutBtn");
    if (!logoutBtn) {
        console.warn("Logout button not found, retrying...");
        setTimeout(setupLogoutButton, 100);
        return;
    }

    // Remove existing event listeners
    const newLogoutBtn = logoutBtn.cloneNode(true);
    logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);

    // Add new event listener
    newLogoutBtn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();

        if (confirm("Are you sure you want to log out?")) {
            // Check if performLogout function exists (from main script)
            if (typeof window.performLogout === 'function') {
                window.performLogout();
            } else {
                // Fallback to simple redirect
                window.location.href = "login.html";
            }
        }
    });

    console.log('Logout button initialized successfully');
}

// Function to load sidebar based on user role
async function loadSidebarBasedOnRole(userRole) {
    let sidebarFile = 'sidebar.html'; // Default
    
    if (userRole === 'agent') {
        sidebarFile = 'agent_sidebar.html';
    } else if (userRole === 'broker') {
        sidebarFile = 'sidebar.html';
    }
    // For other roles (admin, landlord, user) use default sidebar
    
    try {
        const response = await fetch(sidebarFile);
        if (!response.ok) {
            throw new Error('Failed to load sidebar: ' + response.status);
        }
        const html = await response.text();
        document.getElementById('sidebar-container').innerHTML = html;
        
        if (typeof window.updateSidebarUserProfile === 'function') {
            window.updateSidebarUserProfile();
        }
        setupLogoutButton();
        
        console.log(`✅ Loaded sidebar: ${sidebarFile} for role: ${userRole}`);
    } catch (error) {
        console.error('Error loading sidebar:', error);
        // Fallback to default sidebar
        try {
            const fallbackResponse = await fetch('sidebar.html');
            const fallbackHtml = await fallbackResponse.text();
            document.getElementById('sidebar-container').innerHTML = fallbackHtml;
            if (typeof window.updateSidebarUserProfile === 'function') {
                window.updateSidebarUserProfile();
            }
            setupLogoutButton();
        } catch (fallbackError) {
            console.error('Failed to load fallback sidebar:', fallbackError);
            document.getElementById('sidebar-container').innerHTML = 
                '<div class="sidebar" style="padding: 20px; background: var(--bg-light); color: #ef4444;">' +
                '<p>Unable to load navigation. Please refresh the page.</p>' +
                '</div>';
        }
    }
}

// Function to update back button based on user role with history back fallback
function updateBackButton(userRole) {
    const backButton = document.getElementById('backButton');
    
    // Remove any existing event listeners by cloning the button
    const newBackButton = backButton.cloneNode(true);
    backButton.parentNode.replaceChild(newBackButton, backButton);
    
    // Add click event listener
    newBackButton.addEventListener('click', function(e) {
        e.preventDefault();
        
        // First, try to go back in history
        if (window.history.length > 1) {
            window.history.back();
        } else {
            // If no history, fall back to dashboard based on role
            let fallbackUrl = '../index.html';
            let fallbackText = 'Back to Home';
            
            if (userRole === 'agent') {
                fallbackUrl = 'agent_dashboard.html';
                fallbackText = 'Back to Agent Dashboard';
            } else if (userRole === 'broker') {
                fallbackUrl = 'broker_dashboard.html';
                fallbackText = 'Back';
            } else if (userRole === 'landlord') {
                fallbackUrl = '../landlord/landlord_dashboard.html';
                fallbackText = 'Back to Landlord Dashboard';
            } else if (userRole === 'admin') {
                fallbackUrl = '../admin/admin_dashboard.html';
                fallbackText = 'Back to Admin Dashboard';
            }
            
            // Show a fallback message
            const shouldGoToFallback = confirm(`Cannot go back in history. Go to ${fallbackText}?`);
            if (shouldGoToFallback) {
                window.location.href = fallbackUrl;
            }
        }
    });
    
    // Update button text based on role for visual reference
    let buttonText = 'Back';
    if (userRole === 'agent') {
        buttonText = 'Back';
    } else if (userRole === 'broker') {
        buttonText = 'Back';
    } else if (userRole === 'landlord') {
        buttonText = 'Back';
    } else if (userRole === 'admin') {
        buttonText = 'Back';
    }
    
    newBackButton.innerHTML = `<i class="fas fa-arrow-left"></i> ${buttonText}`;
    newBackButton.id = 'backButton'; // Restore the ID
}
</script>

<!-- Main Application Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

function initMortgageCalc(l, type) {
  if (type === 'sale') {
    const downEl = document.getElementById('calc-down');
    const downVal = document.getElementById('calc-down-val');
    if (downEl && downVal) downEl.addEventListener('input', () => { downVal.textContent = downEl.value + '%'; });
    const btn = document.getElementById('calc-mortgage-btn');
    const price = l.pricing || l.salePrice;
    if (btn) btn.addEventListener('click', () => {
      const priceInput = document.getElementById('calc-price');
      if (priceInput && price && !priceInput.value) priceInput.value = price;
      calculateMortgage();
    });
    if (price) setTimeout(() => calculateMortgage(), 200);
  } else if (type === 'rent') {
    const btn = document.getElementById('calc-rent-btn');
    if (btn) btn.addEventListener('click', calculateRentAffordability);
  }
}

function calculateMortgage() {
  const priceEl = document.getElementById('calc-price');
  const downEl = document.getElementById('calc-down');
  const termEl = document.getElementById('calc-term');
  const rateEl = document.getElementById('calc-rate');
  const resultsEl = document.getElementById('calc-results-mortgage');
  if (!priceEl || !resultsEl) return;
  const price = parseFloat(priceEl.value) || 0;
  if (price <= 0) {
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<span style="color:#fecaca;">Enter a valid price</span>';
    return;
  }
  const downPct = parseFloat(downEl?.value) || 20;
  const term = parseInt(termEl?.value) || 15;
  const rate = parseFloat(rateEl?.value) || 6.5;
  const downAmt = price * downPct / 100;
  const loan = price - downAmt;
  const r = rate / 100 / 12;
  const n = term * 12;
  const monthly = loan * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  const totalInt = monthly * n - loan;
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = `
    <div class="monthly">₱${monthly.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}<span style="font-size:12px;font-weight:400;">/mo</span></div>
    <div>Down: ₱${downAmt.toLocaleString(0)} (${downPct}%)</div>
    <div>Total interest: ₱${totalInt.toLocaleString(0)}</div>
    <div class="note">Estimate only. Actual terms may vary.</div>
  `;
}

function calculateRentAffordability() {
  const rentEl = document.getElementById('calc-rent');
  const incomeEl = document.getElementById('calc-income');
  const resultsEl = document.getElementById('calc-results-rent');
  if (!rentEl || !incomeEl || !resultsEl) return;
  const rent = parseFloat(rentEl.value) || 0;
  const income = parseFloat(incomeEl.value) || 0;
  if (rent <= 0 || income <= 0) {
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<span style="color:#fecaca;">Enter rent and income</span>';
    return;
  }
  const pct = (rent / income * 100).toFixed(1);
  const status = pct <= 30 ? 'Within budget ✓' : pct <= 40 ? 'Moderate' : 'May be tight';
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = `
    <div class="monthly">${pct}% of income</div>
    <div>${status}</div>
    <div class="note">Rent under 30% of income is recommended.</div>
  `;
}

function getRoleDisplayText(role) {
    const roleMap = {
        'landlord': 'Property Owner',
        'seller': 'Property Seller',
        'broker': 'Licensed Broker',
        'agent': 'Property Agent',
        'admin': 'Administrator'
    };
    return roleMap[role] || 'Posted by';
}

function getListingType(listing) {
    if (listing.listingType === 'lease' || listing.type === 'lease') {
        return 'lease';
    }
    if (listing.listingType === 'rent' || listing.type === 'rent') {
        return 'rent';
    }
    if (listing.listingType === 'sale' || listing.type === 'sale') {
        return 'sale';
    }
    if (listing.monthlyRent !== undefined && listing.monthlyRent !== null && listing.monthlyRent > 0) {
        return 'rent';
    }
    if (listing.annualRent !== undefined && listing.annualRent !== null && listing.annualRent > 0) {
        return 'lease';
    }
    if ((listing.pricing !== undefined && listing.pricing !== null && listing.pricing > 0) ||
        (listing.salePrice !== undefined && listing.salePrice !== null && listing.salePrice > 0)) {
        return 'sale';
    }
    return 'sale';
}

function getDisplayPrice(listing) {
    const type = getListingType(listing);
    switch (type) {
        case 'rent':
            return '₱' + (listing.monthlyRent || 0).toLocaleString() + '/month';
        case 'lease':
            const annualRent = listing.annualRent || 0;
            return '₱' + annualRent.toLocaleString() + '/year';
        case 'sale':
        default:
            return '₱' + (listing.pricing || listing.salePrice || 0).toLocaleString();
    }
}

function getTypeBadgeText(listing) {
    const type = getListingType(listing);
    switch (type) {
        case 'rent':
            return 'FOR RENT';
        case 'lease':
            return 'FOR LEASE';
        case 'sale':
        default:
            return 'FOR SALE';
    }
}

function getCompleteAddress(listing) {
    if (listing.address && (listing.address.includes('.') || listing.address.length > 20)) {
        return listing.address;
    }
    
    const addressParts = [];
    
    if (listing.location) {
        addressParts.push(listing.location);
    } else if (listing.address) {
        addressParts.push(listing.address);
    }
    
    if (listing.city) {
        addressParts.push(listing.city);
    }
    
    if (listing.province && listing.province.toLowerCase() !== 'calabarzon') {
        addressParts.push(listing.province);
    }
    
    if (listing.city && (!listing.province || listing.province.toLowerCase() === 'calabarzon')) {
        addressParts.push('Philippines');
    }
    
    if (addressParts.length === 0) {
        return 'Location not specified';
    }
    
    return addressParts.join('. ');
}

// Check if URL is a video
function isVideoFile(url) {
    if (!url) return false;
    const videoExtensions = ['.mp4', '.avi', '.mov', '.wmv', '.flv', '.webm', '.mkv', '.m4v'];
    const urlLower = url.toLowerCase();
    
    return videoExtensions.some(ext => urlLower.includes(ext)) ||
           urlLower.includes('/videos/') ||
           urlLower.includes('video/');
}

function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

// --- GOOGLE MAPS FUNCTIONS ---

async function loadGoogleMapsAPI() {
    return new Promise((resolve, reject) => {
        if (window.google && window.google.maps) {
            resolve();
            return;
        }

        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
        script.async = true;
        script.defer = true;
        script.onload = () => {
            if (window.google && window.google.maps) {
                resolve();
            } else {
                reject(new Error("Google Maps API failed to initialize"));
            }
        };
        script.onerror = () => reject(new Error("Failed to load Google Maps script"));
        document.head.appendChild(script);
    });
}

function initPropertyMap(lat, lng, title) {
    const mapElement = document.getElementById("propertyMap");
    if (!mapElement) {
        console.error("Map element not found");
        return;
    }

    try {
        const latitude = parseFloat(lat);
        const longitude = parseFloat(lng);

        if (isNaN(latitude) || isNaN(longitude)) {
            console.error("Invalid coordinates:", lat, lng);
            showMapPlaceholder(lat, lng);
            return;
        }

        const map = new google.maps.Map(mapElement, {
            center: { lat: latitude, lng: longitude },
            zoom: 16,
            mapTypeControl: true,
            streetViewControl: true,
            fullscreenControl: true
        });

        // Add marker
        new google.maps.Marker({
            position: { lat: latitude, lng: longitude },
            map: map,
            title: title || "Property Location",
            animation: google.maps.Animation.DROP
        });
    } catch (error) {
        console.error("Error initializing map:", error);
        showMapPlaceholder(lat, lng);
    }
}

function showMapPlaceholder(lat, lng) {
    const mapElement = document.getElementById("propertyMap");

}

// --- MEDIA NAVIGATION FUNCTIONS ---

function initializeMediaNavigation(mediaArray) {
    mediaUrls = mediaArray;
    currentMediaIndex = 0;

    if (mediaArray.length <= 1) {
    const nav = document.querySelector('.image-navigation');
    const counter = document.querySelector('.gallery-image-count');
    if (nav) nav.style.display = 'none';
    if (counter) counter.style.display = 'none';
        return;
    }

    const nav = document.querySelector('.image-navigation');
    const counter = document.querySelector('.image-counter');
    if (nav) nav.style.display = 'flex';
    if (counter) counter.style.display = 'block';

    updateMediaCounter();

    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');

    if (prevBtn) {
        prevBtn.addEventListener('click', () => navigateMedia(-1));
        prevBtn.disabled = currentMediaIndex === 0;
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => navigateMedia(1));
        nextBtn.disabled = currentMediaIndex === mediaUrls.length - 1;
    }

    document.addEventListener('keydown', handleKeyboardNavigation);

    document.querySelectorAll('.thumb-item, .thumbnail').forEach((thumb, index) => {
        thumb.addEventListener('click', () => goToMedia(index));
    });

    function navigateMedia(direction) {
        const newIndex = currentMediaIndex + direction;
        if (newIndex >= 0 && newIndex < mediaUrls.length) {
            goToMedia(newIndex);
        }
    }

    function goToMedia(index) {
        if (index < 0 || index >= mediaUrls.length) return;

        currentMediaIndex = index;
        const mediaUrl = mediaUrls[index];
        const isVideo = isVideoFile(mediaUrl);

        const mainImage = document.getElementById('mainPropertyImage');
        const mainVideo = document.getElementById('mainPropertyVideo');

        if (isVideo) {
            // Show video, hide image
            mainImage.style.display = 'none';
            mainVideo.style.display = 'block';
            mainVideo.src = mediaUrl;
            mainVideo.load(); // Load the video
        } else {
            // Show image, hide video
            mainVideo.style.display = 'none';
            mainImage.style.display = 'block';
            mainImage.src = mediaUrl;
        }

        // Update thumbnail selection
        document.querySelectorAll('.thumb-item, .thumbnail').forEach((thumb, i) => {
            if (i === index) {
                thumb.classList.add('active');
                thumb.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'center'
                });
            } else {
                thumb.classList.remove('active');
            }
        });

        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');

        if (prevBtn) prevBtn.disabled = index === 0;
        if (nextBtn) nextBtn.disabled = index === mediaUrls.length - 1;

        updateMediaCounter();
    }

    function updateMediaCounter() {
        const counter = document.querySelector('.gallery-image-count');
        if (counter) {
            counter.textContent = `${currentMediaIndex + 1} / ${mediaUrls.length}`;
        }
    }

    function handleKeyboardNavigation(e) {
        if (e.key === 'ArrowLeft') {
            navigateMedia(-1);
        } else if (e.key === 'ArrowRight') {
            navigateMedia(1);
        }
    }
}

async function loadPropertyDetails() {
    if (!propertyId) {
        displayError("No property ID provided");
        return;
    }

    try {
        const propertyDoc = await getDoc(doc(db, "properties", propertyId));
        if (!propertyDoc.exists()) {
            displayError("Property not found");
            return;
        }
        
        currentListing = {
            id: propertyDoc.id,
            ...propertyDoc.data()
        };

        let userInfo = {
            displayName: 'User ' + (currentListing.userId ? currentListing.userId.substring(0, 8) : 'Unknown'),
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        };

        if (currentListing.userId) {
            try {
                const agentDoc = await getDoc(doc(db, "agents", currentListing.userId));
                if (agentDoc.exists()) {
                    const d = agentDoc.data();
                    userInfo.displayName = d.fullName || d.name || d.email?.split('@')[0] || 'Agent';
                    userInfo.email = d.email || 'Email not available';
                    userInfo.phone = d.phone || 'Phone not available';
                    userInfo.role = d.userType || d.role || 'agent';
                    userInfo.photoURL = d.photoURL || d.profilePhoto || d.profileImage || d.imageURL || null;
                } else {
                    const userDoc = await getDoc(doc(db, "users", currentListing.userId));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        userInfo.displayName = userData.fullName || userData.email?.split('@')[0] || 'User ' + currentListing.userId.substring(0, 8);
                        userInfo.email = userData.email || 'Email not available';
                        userInfo.phone = userData.phone || 'Phone not available';
                        userInfo.role = userData.role || 'user';
                        userInfo.photoURL = userData.photoURL || userData.profilePhoto || userData.profileImage || null;
                    } else {
                        const brokerDoc = await getDoc(doc(db, "brokers", currentListing.userId));
                        if (brokerDoc.exists()) {
                            const brokerData = brokerDoc.data();
                            userInfo.displayName = brokerData.fullName || 'Broker ' + currentListing.userId.substring(0, 8);
                            userInfo.email = brokerData.email || 'Email not available';
                            userInfo.phone = brokerData.phone || 'Phone not available';
                            userInfo.role = 'broker';
                            userInfo.photoURL = brokerData.photoURL || brokerData.profilePhoto || brokerData.profileImage || null;
                        }
                    }
                }
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }

        displayPropertyDetails(currentListing, userInfo);
    } catch (error) {
        console.error("Error loading property details:", error);
        displayError("Error loading property details");
    }
}

            ${listing.lotArea ? `<div class="stat"><i class="bi bi-map"></i><span>${listing.lotArea} sqm Lot</span></div>` : ''}
          </div>
        </div>

        ${listing.description ? `
        <div class="card">
          <h3 class="card-title"><i class="fas fa-align-left"></i> Description</h3>
          <div class="desc-text">${listing.description}</div>

        ${rentLeaseItems.length ? renderDetailSection(listingType === 'rent' ? 'Rent Information' : 'Lease Information', 'file-text', rentLeaseItems) : ''}
        ${locationItems.length ? renderDetailSection('Location', 'geo-alt', locationItems) : ''}

        ${listing.financingOptions && listing.financingOptions.length > 0 ? `
        <div class="card">
          <h3 class="card-title"><i class="fas fa-university"></i> Financing Options</h3>
          <div class="financing-options">
            ${listing.financingOptions.map(o => `<span class="financing-badge">${o}</span>`).join('')}

        ` : ''}

        ${amenities.length ? `
        <div class="card">
          <h3 class="card-title"><i class="fas fa-star"></i> Amenities & Features</h3>
          <div class="amenities-grid">
            ${amenities.map(a => `<span class="amenity-chip"><i class="fas fa-check"></i> ${a}</span>`).join('')}

        </div>
        ` : ''}

        ${listing.latitude && listing.longitude ? `
        <div class="card">
          <h3 class="card-title"><i class="fas fa-map"></i> Map</h3>
          <div class="map-container" id="mapWrap">
            <div id="propertyMap"></div>
          </div>
        </div>
        ` : ''}

        ${listingType === 'lease' && listing.restrictions ? `
        <div class="card">
          <h3 class="card-title"><i class="fas fa-file-contract"></i> Restrictions & Conditions</h3>
          <div class="desc-text">${listing.restrictions}</div>
          ${listing.maintenance ? `<div style="margin-top:12px;"><strong>Maintenance:</strong> ${labels.maintenance[listing.maintenance] || listing.maintenance}</div>` : ''}
        </div>
        ` : ''}

        <div class="trust-note"><i class="fas fa-check-circle"></i> Verified listing</div>
      </div>

      <div>
        <div class="contact-card">
          <div class="contact-header"><i class="fas fa-user"></i> Contact ${userInfo.role === 'landlord' ? 'Owner' : userInfo.role === 'agent' ? 'Agent' : 'Broker'}</div>
          <div class="contact-profile">
            <div class="contact-avatar">${avatarHtml}</div>
            <div class="contact-profile-info">
              <div class="contact-name">${userInfo.displayName || 'Contact'}</div>
              <div class="contact-role">${roleText}</div>
            </div>
          </div>
          <div class="contact-methods">
            <div class="contact-method"><i class="fas fa-envelope"></i> <span>${userInfo.email || 'Not provided'}</span></div>
            <div class="contact-method"><i class="fas fa-phone"></i> <span>${userInfo.phone || 'Not provided'}</span></div>
          </div>
          ${(typeof window.firebaseAuth !== 'undefined' && window.firebaseAuth.currentUser && window.firebaseAuth.currentUser.uid === listing.userId) ? `<a href="edit_property.html?id=${listing.id}" class="contact-btn"><i class="fas fa-edit"></i> Edit Property</a>` : ''}
        </div>
        ${listingType === 'sale' ? `
        <div class="calc-widget">
          <h3><i class="fas fa-calculator"></i> Mortgage Calculator</h3>
          <div class="calc-input-group">
            <label>Property Price (₱)</label>
            <input type="number" id="calc-price" placeholder="0" min="0" value="${listing.pricing || listing.salePrice || ''}">
          </div>
          <div class="calc-input-group">
            <label>Down Payment</label>
            <div class="calc-range-row">
              <input type="range" id="calc-down" min="0" max="50" value="20">
              <span class="range-val" id="calc-down-val">20%</span>
            </div>
          </div>
          <div class="calc-input-group">
            <label>Term / Rate</label>
            <div style="display:flex;gap:10px;">
              <select id="calc-term" style="flex:1;">
                <option value="5">5 yrs</option>
                <option value="10">10 yrs</option>
                <option value="15" selected>15 yrs</option>
                <option value="20">20 yrs</option>
                <option value="30">30 yrs</option>
              </select>
              <select id="calc-rate" style="flex:1;">
                <option value="5">5%</option>
                <option value="6">6%</option>
                <option value="6.5" selected>6.5%</option>
                <option value="7">7%</option>
                <option value="8">8%</option>
                <option value="10">10%</option>
              </select>
            </div>
          </div>
          <button class="calc-btn" id="calc-mortgage-btn">Calculate</button>
          <div class="calc-results" id="calc-results-mortgage" style="display:none;"></div>
        </div>
        ` : listingType === 'rent' ? `
        <div class="calc-widget">
          <h3><i class="fas fa-calculator"></i> Rent Affordability</h3>
          <div class="calc-input-group">
            <label>Monthly Rent (₱)</label>
            <input type="number" id="calc-rent" placeholder="0" min="0" value="${listing.monthlyRent || ''}">
          </div>
          <div class="calc-input-group">
            <label>Monthly Income (₱)</label>
            <input type="number" id="calc-income" placeholder="0" min="0">
          </div>
          <button class="calc-btn" id="calc-rent-btn">Check</button>
          <div class="calc-results" id="calc-results-rent" style="display:none;"></div>
        </div>
        ` : ''}
      </div>
    </div>`;
    
    container.innerHTML = html;
    
    // Initialize components
    initializeMediaNavigation(allMedia);
    setupButtonEventListeners(listing, userInfo);
    initMortgageCalc(listing, listingType);

    // Preload video if first media is video
    if (isFirstVideo) {
        const video = document.getElementById('mainPropertyVideo');
        video.src = firstMedia;
    }

    // Load Google Maps
    if (listing.latitude && listing.longitude) {
        setTimeout(async () => {
            try {
                await loadGoogleMapsAPI();
                initPropertyMap(listing.latitude, listing.longitude, listing.title);
            } catch (error) {
                console.error("Failed to load Google Maps:", error);
                showMapPlaceholder(listing.latitude, listing.longitude);
            }
        }, 500);
    }
}

function setupButtonEventListeners(listing, userInfo) {
    // Contact buttons removed
}

function displayError(message) {
    const container = document.getElementById('propertyDetailsContainer');
    
    // Use currentUserRole to determine back link
    let backLink = 'profile.html';
    let backText = 'Back to Dashboard';
    
    if (currentUserRole === 'agent') {
        backLink = 'agent_dashboard.html';
        backText = 'Back to Agent Dashboard';
    } else if (currentUserRole === 'broker') {
        backLink = 'broker_dashboard.html';
        backText = 'Back to Broker Dashboard';
    }
    
    container.innerHTML = `
    <div class="error-state">
        <div class="error-icon">⚠️</div>
        <h3 style="color: var(--danger); margin-bottom: 15px;">${message}</h3>
        <p style="color: var(--text-light); margin-bottom: 30px;">Please try again or go back to the dashboard.</p>
        <a href="${backLink}" class="back-button">
            <i class="fas fa-arrow-left"></i>
            ${backText}
        </a>
    </div>`;
}

// Load user profile for sidebar (agents, brokers, users)
async function loadSidebarUserProfile(user) {
    try {
        // Try agents collection first
        const agentDoc = await getDoc(doc(db, "agents", user.uid));
        if (agentDoc.exists()) {
            const d = agentDoc.data();
            const sidebarData = {
                fullName: d.fullName || d.name || d.displayName,
                displayName: d.fullName || d.name || d.displayName,
                email: user.email || d.email,
                role: d.userType || d.role || 'agent',
                photoURL: d.photoURL || d.profilePhoto || d.profileImage || d.imageURL || user.photoURL
            };
            try { localStorage.setItem('userData', JSON.stringify(sidebarData)); } catch (e) {}
            if (typeof window.updateSidebarUserProfile === 'function') {
                window.updateSidebarUserProfile(sidebarData);
            }
            return;
        }
        // Try brokers collection
        const brokerDoc = await getDoc(doc(db, "brokers", user.uid));
        if (brokerDoc.exists()) {
            const d = brokerDoc.data();
            const sidebarData = {
                fullName: d.fullName || d.name || d.displayName,
                displayName: d.fullName || d.name || d.displayName,
                email: user.email || d.email,
                role: d.userType || d.role || 'broker',
                photoURL: d.photoURL || d.profilePhoto || d.profileImage || d.imageURL || user.photoURL
            };
            try { localStorage.setItem('userData', JSON.stringify(sidebarData)); } catch (e) {}
            if (typeof window.updateSidebarUserProfile === 'function') {
                window.updateSidebarUserProfile(sidebarData);
            }
            return;
        }
        // Try users collection
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
            const d = userDoc.data();
            const sidebarData = {
                fullName: d.fullName || d.name || d.displayName,
                displayName: d.fullName || d.name || d.displayName,
                email: user.email || d.email,
                role: d.userType || d.role || 'user',
                photoURL: d.photoURL || d.profilePhoto || d.profileImage || d.imageURL || user.photoURL
            };
            try { localStorage.setItem('userData', JSON.stringify(sidebarData)); } catch (e) {}
            if (typeof window.updateSidebarUserProfile === 'function') {
                window.updateSidebarUserProfile(sidebarData);
            }
            return;
        }
        // Fallback to auth data
        const fallbackData = { fullName: user.displayName, displayName: user.displayName, email: user.email, role: currentUserRole || 'user', photoURL: user.photoURL };
        try { localStorage.setItem('userData', JSON.stringify(fallbackData)); } catch (e) {}
        if (typeof window.updateSidebarUserProfile === 'function') {
            window.updateSidebarUserProfile(fallbackData);
        }
    } catch (e) {
        console.warn('Could not load sidebar user profile:', e);
        if (user && typeof window.updateSidebarUserProfile === 'function') {
            const fallback = { fullName: user.displayName, email: user.email, role: currentUserRole || 'user', photoURL: user.photoURL };
            try { localStorage.setItem('userData', JSON.stringify(fallback)); } catch (e) {}
            window.updateSidebarUserProfile(fallback);
        }
    }
}

// Function to get user role from Firestore
async function getUserRole(userId) {
    try {
        const userDoc = await getDoc(doc(db, "users", userId));
        if (userDoc.exists()) {
            const userData = userDoc.data();
            return userData.role || userData.userType || 'user';
        } else {
            // Check brokers collection
            const brokerDoc = await getDoc(doc(db, "brokers", userId));
            if (brokerDoc.exists()) {
                const brokerData = brokerDoc.data();
                return brokerData.role || 'broker';
            }
        }
    } catch (error) {
        console.error("Error getting user role:", error);
    }
    return 'user'; // Default role
}

// --- INITIALIZATION ---

// Check authentication and load property details
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    
    try {
        // Get user role
        currentUserRole = await getUserRole(user.uid);
        console.log(`👤 User role detected: ${currentUserRole}`);
        
        // Load appropriate sidebar
        await window.loadSidebarBasedOnRole(currentUserRole);
        
        // Load user profile for sidebar (agent/broker)
        await loadSidebarUserProfile(user);
        
        // Update back button based on role
        window.updateBackButton(currentUserRole);
        
        // Load property details
        await loadPropertyDetails();
    } catch (error) {
        console.error("Error in initialization:", error);
        displayError("Failed to load property details. Please refresh the page.");
    }
});

// Export for global use if needed
window.loadSidebarBasedOnRole = loadSidebarBasedOnRole;
window.updateBackButton = updateBackButton;
</script>
