services: 
  - type: web 
    name: bahai 
    runtime: python 
    buildCommand: | 
      pip install --upgrade pip 
      pip install "numpy<2" 
      pip install "scikit-learn==1.5.0" --no-build-isolation 
      pip install -r requirements.txt 
    startCommand: cd backend && gunicorn chatbot_backend:app 
    pythonVersion: "3.12.0" 
