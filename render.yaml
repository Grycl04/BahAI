services:
  - type: web
    name: bahai
    runtime: python
    plan: free
    region: oregon
    pythonVersion: 3.12
    buildCommand: |
      echo "=== STARTING BUILD ==="
      echo "Python version:"
      python --version
      echo "Pip version:"
      pip --version
      
      echo "=== INSTALLING ==="
      pip install --upgrade pip
      pip install numpy==1.21.6
      pip install pandas==1.3.5
      pip install -r requirements.txt
      
      echo "=== BUILD COMPLETE ==="
    startCommand: cd backend && gunicorn chatbot_backend:app
