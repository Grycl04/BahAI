services:
  - type: web
    name: bahai
    runtime: python
    buildCommand: |
      # First verify Python version
      echo "=== Python Information ==="
      python --version
      which python
      pip --version
      
      # Install specific versions that work with Python 3.12
      pip install --upgrade pip setuptools wheel
      
      # Install numpy first (critical dependency)
      pip install numpy==1.24.3
      
      # Install pandas from a pre-built wheel (avoids compilation)
      pip install pandas==1.5.3 --only-binary :all:
      
      # Install scikit-learn with compatible version
      pip install scikit-learn==1.3.0
      
      # Install the rest
      pip install -r requirements.txt
    startCommand: cd backend && gunicorn chatbot_backend:app
    pythonVersion: "3.12"