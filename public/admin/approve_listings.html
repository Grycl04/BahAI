<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve Listings - RealEase Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f8;
    }
    header {
      background-color: #3f51b5;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      display: flex;
    }
    nav {
      width: 250px;
      background-color: #263238;
      color: white;
      height: 100vh;
      padding-top: 20px;
    }
    nav a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 16px;
    }
    nav a:hover {
      background-color: #455a64;
    }
    nav a.active {
      background-color: #3f51b5;
    }
    main {
      flex: 1;
      padding: 20px;
    }
    h1 {
      color: #3f51b5;
      margin-top: 0;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      background: #ddd;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
    }
    .tab.active {
      background: #3f51b5;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #3f51b5;
      color: white;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }
    .approve { background: #4CAF50; }
    .reject { background: #f44336; }
    .neutral { background: #888; }
  </style>
</head>
<body>

<header>RealEase - Admin Dashboard</header>

<div class="container">
  <nav>
    <a href="admin_home.html">🏠 Dashboard</a>
    <a href="#">➕ Add User</a>
    <a href="approve_listings.html" class="active">⭐ Approve Listings</a>
    <a href="#">👥 Manage Users</a>
    <a href="#">📊 Reports</a>
    <a href="#">📜 Audit Log</a>
    <a href="#">🏠 Buyer Listings</a>
    <a href="#">🏢 Seller Listings</a>
    <a href="#" id="logoutBtn">🚪 Logout</a>
  </nav>

  <main>
    <h1>Manage Property Listings</h1>

    <div class="tabs">
      <button class="tab active" data-status="pending">Pending</button>
      <button class="tab" data-status="approved">Approved</button>
      <button class="tab" data-status="rejected">Rejected</button>
    </div>

    <table id="listingTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Property Type</th>
          <th>Listing Type</th>
          <th>Description</th>
          <th>Posted By</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="listingBody">
        <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  // 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
    authDomain: "bahai-1b76d.firebaseapp.com",
    projectId: "bahai-1b76d",
    storageBucket: "bahai-1b76d.firebasestorage.app",
    messagingSenderId: "646878644941",
    appId: "1:646878644941:web:5b4ccc3412250337587784"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const listingBody = document.getElementById("listingBody");
  const tabs = document.querySelectorAll(".tab");

  let currentStatus = "pending";

  // ✅ Load listings by status
  async function loadListings(status) {
    listingBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Loading...</td></tr>`;
    const q = query(collection(db, "listings"), where("status", "==", status));
    const querySnapshot = await getDocs(q);

    listingBody.innerHTML = "";

    if (querySnapshot.empty) {
      listingBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No ${status} listings right now.</td></tr>`;
      return;
    }

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${data.title || "Untitled"}</td>
        <td>${data.propertyType || "-"}</td>
        <td>${data.listingType || "-"}</td>
        <td>${data.description || "-"}</td>
        <td>${data.userId || "-"}</td>
        <td>${data.status || "-"}</td>
        <td>
          ${
            status === "pending"
              ? `
                <button class="approve">Approve</button>
                <button class="reject">Reject</button>
              `
              : `<button class="neutral">No Action</button>`
          }
        </td>
      `;

      if (status === "pending") {
        tr.querySelector(".approve").addEventListener("click", async () => {
          await updateDoc(doc(db, "listings", docSnap.id), { status: "approved" });
          alert(`✅ Approved: ${data.title}`);
          loadListings(currentStatus);
        });

        tr.querySelector(".reject").addEventListener("click", async () => {
          await updateDoc(doc(db, "listings", docSnap.id), { status: "rejected" });
          alert(`❌ Rejected: ${data.title}`);
          loadListings(currentStatus);
        });
      }

      listingBody.appendChild(tr);
    });
  }

  // 🧭 Tab switching
  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentStatus = tab.getAttribute("data-status");
      loadListings(currentStatus);
    });
  });

  // 👮 Admin check
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "admin_login.html";
      return;
    }

    const userDocs = await getDocs(query(collection(db, "users"), where("email", "==", user.email)));
    let role = "";
    userDocs.forEach((d) => role = d.data().role);

    if (role !== "admin") {
      alert("Access denied. Admins only.");
      window.location.href = "index.html";
      return;
    }

    loadListings(currentStatus);
  });

  // 🚪 Logout
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "admin_login.html";
  });
</script>
</body>
</html>
