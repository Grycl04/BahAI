<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        :root {
            --primary: #0b2e52;
            --primary-dark: #001F3F;
            --primary-light: #002f3f;
            --secondary: #1976d2;
            --accent: #ff9800;
            --text-dark: #1a202c;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --bg-white: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 0;
            box-shadow: var(--shadow-lg);
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .logo {
            padding: 0 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            font-size: 12px;
            opacity: 0.8;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin: 5px 15px;
            display: flex;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .sidebar a.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
        }

        .sidebar a i {
            margin-right: 12px;
            font-size: 18px;
        }

        /* Logout button styling */
        .logout-btn {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            background: #b00020;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #9a001b;
            opacity: 0.9;
        }

        .logout-btn i {
            margin-right: 12px;
            font-size: 18px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h1>BahAI</h1>
            <p>Real Estate Platform</p>
        </div>
        <ul>
            <li><a href="buyer_dashboard.html" class="sidebar-link"><i>🏠︎</i> Dashboard</a></li>
            <li><a href="settings.html" class="sidebar-link"><i>⚙️</i> Settings</a></li>
            <li><button id="logoutBtn" class="logout-btn"><i>🚪</i> Logout</button></li>
        </ul>
    </div>
</body>
</html>
