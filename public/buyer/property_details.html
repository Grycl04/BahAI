// Simple logout function that redirects to login page
// The actual Firebase signOut will be handled in the main script
function setupLogoutButton() {
    const logoutBtn = document.getElementById("logoutBtn");
    if (!logoutBtn) {
        console.warn("Logout button not found, retrying...");
        setTimeout(setupLogoutButton, 100);
        return;
    }


    // Remove existing event listeners
    const newLogoutBtn = logoutBtn.cloneNode(true);
    logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);


    // Add new event listener - use a global logout function
    newLogoutBtn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();


        if (confirm("Are you sure you want to log out?")) {
            // Call the global logout function defined in the module
            if (typeof window.performLogout === 'function') {
                window.performLogout();
            } else {
                // Fallback: redirect to login page
                window.location.href = "../login.html";
            }
        }
    });


    console.log('Logout button initialized successfully');
}
</script>

function getRoleDisplayText(role) {
    const roleMap = {
        'landlord': 'Property Owner',
        'seller': 'Property Seller',
        'broker': 'Licensed Broker',
        'agent': 'Property Agent',
        'admin': 'Administrator'
    };
    return roleMap[role] || 'Posted by';
}


function getListingType(listing) {
    if (listing.listingType === 'lease' || listing.type === 'lease') {
        return 'lease';
    }


    if (listing.listingType === 'rent' || listing.type === 'rent') {
        return 'rent';
    }


    if (listing.listingType === 'sale' || listing.type === 'sale') {
        return 'sale';
    }


    if (listing.monthlyRent !== undefined && listing.monthlyRent !== null && listing.monthlyRent > 0) {
        return 'rent';
    }


    if (listing.annualRent !== undefined && listing.annualRent !== null && listing.annualRent > 0) {
        return 'lease';
    }


    if ((listing.pricing !== undefined && listing.pricing !== null && listing.pricing > 0) ||
        (listing.salePrice !== undefined && listing.salePrice !== null && listing.salePrice > 0)) {
        return 'sale';
    }


    return 'sale';
}


function getDisplayPrice(listing) {
    const type = getListingType(listing);


    switch (type) {
        case 'rent':
            return `₱${(listing.monthlyRent || 0).toLocaleString()}/month`;
        case 'lease':
            const annualRent = listing.annualRent || 0;
            return `₱${annualRent.toLocaleString()}/year`;
        case 'sale':
        default:
            return `₱${(listing.pricing || listing.salePrice || 0).toLocaleString()}`;
    }
}


function getTypeBadgeText(listing) {
    const type = getListingType(listing);


    switch (type) {
        case 'rent':
            return 'FOR RENT';
        case 'lease':
            return 'FOR LEASE';
        case 'sale':
        default:

    }
}


// --- GOOGLE MAPS FUNCTIONS ---


async function loadGoogleMapsAPI() {
    return new Promise((resolve, reject) => {
        // Check if already loaded
        if (window.google && window.google.maps) {
            resolve();
            return;
        }


        // Load the API
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
        script.async = true;
        script.defer = true;
        script.onload = () => {
            if (window.google && window.google.maps) {
                resolve();
            } else {
                reject(new Error("Google Maps API failed to initialize"));
            }
        };
        script.onerror = () => reject(new Error("Failed to load Google Maps script"));
        document.head.appendChild(script);
    });
}


function initPropertyMap(lat, lng, title) {
    const mapElement = document.getElementById("propertyMap");
    if (!mapElement) {
        console.error("Map element not found");
        return;
    }


    try {
        // Parse coordinates
        const latitude = parseFloat(lat);
        const longitude = parseFloat(lng);
       
        if (isNaN(latitude) || isNaN(longitude)) {
            console.error("Invalid coordinates:", lat, lng);
            showMapPlaceholder(lat, lng);
            return;
        }


        // Initialize map
        const map = new google.maps.Map(mapElement, {
            center: { lat: latitude, lng: longitude },
            zoom: 16,
            mapTypeControl: true,
            streetViewControl: true,
            fullscreenControl: true
        });


        // Add marker
        new google.maps.Marker({
            position: { lat: latitude, lng: longitude },
            map: map,
            title: title || "Property Location",
            animation: google.maps.Animation.DROP
        });
    } catch (error) {
        console.error("Error initializing map:", error);
        showMapPlaceholder(lat, lng);
    }
}


function showMapPlaceholder(lat, lng) {

async function loadPropertyDetails() {
    if (!propertyId) {
        displayError("No property ID provided");
        return;
    }


    try {
        // Load property data
        const propertyDoc = await getDoc(doc(db, "properties", propertyId));
       
        if (!propertyDoc.exists()) {
            displayError("Property not found");
            return;
        }


        const listing = {
            id: propertyDoc.id,
            ...propertyDoc.data()
        };


        // Load user data
        let userInfo = {
            displayName: `User ${listing.userId ? listing.userId.substring(0, 8) : 'Unknown'}`,
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        };


        if (listing.userId) {
            try {
                const userDoc = await getDoc(doc(db, "users", listing.userId));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    userInfo.displayName = userData.fullName ||
                                        userData.email?.split('@')[0] ||
                                        `User ${listing.userId.substring(0, 8)}`;
                    userInfo.email = userData.email || 'Email not available';
                    userInfo.phone = userData.phone || 'Phone not available';
                    userInfo.role = userData.role || 'user';
                } else {
                    const brokerDoc = await getDoc(doc(db, "brokers", listing.userId));
                    if (brokerDoc.exists()) {
                        const brokerData = brokerDoc.data();
                        userInfo.displayName = brokerData.fullName || `Broker ${listing.userId.substring(0, 8)}`;
                        userInfo.email = brokerData.email || 'Email not available';
                        userInfo.phone = brokerData.phone || 'Phone not available';
                        userInfo.role = 'broker';
                    }
                }
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }


        // Display property details
        displayPropertyDetails(listing, userInfo);


    } catch (error) {
        console.error("Error loading property details:", error);
        displayError("Error loading property details");
    }
}

                <i class="fas fa-info-circle" style="color: var(--primary); margin-right: 10px;"></i>
                Property Facts
            </h3>
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: var(--shadow);">
                <div class="info-item" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                    <span style="color: var(--text-light);">Type:</span>
                    <span style="font-weight: 600;">${listing.propertyType || 'N/A'}</span>
                </div>
                ${listing.propertyCategory ? `
                <div class="info-item" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                    <span style="color: var(--text-light);">Category:</span>
                    <span style="font-weight: 600;">${listing.propertyCategory}</span>
                </div>
                ` : ''}
                ${listing.lotArea ? `
                <div class="info-item" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                    <span style="color: var(--text-light);">Lot Area:</span>
                    <span style="font-weight: 600;">${listing.lotArea} sqm</span>
                </div>
                ` : ''}
                ${listing.yearBuilt ? `
                <div class="info-item" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
                    <span style="color: var(--text-light);">Year Built:</span>
                    <span style="font-weight: 600;">${listing.yearBuilt}</span>
                </div>
                ` : ''}
                <div class="info-item" style="display: flex; justify-content: space-between; padding: 12px 0;">
                    <span style="color: var(--text-light);">Property ID:</span>
                    <span style="font-weight: 600;">${listing.id.substring(0, 8)}</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Map Section -->
${listing.latitude && listing.longitude ? `
<div class="property-section" style="margin-top: 40px;">
    <h3 class="section-title" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--primary);">
        <i class="fas fa-map-marked-alt" style="color: var(--primary);"></i>
        Property Location
    </h3>
    <div id="propertyMap" style="width: 100%; height: 400px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);"></div>
    <div style="display: flex; gap: 15px; margin-top: 20px;">
        <a href="https://www.google.com/maps?q=${listing.latitude},${listing.longitude}"
           target="_blank"
           class="map-button">
            <i class="fas fa-external-link-alt"></i> Open in Google Maps
        </a>
        <a href="https://maps.google.com/maps/dir/?api=1&destination=${listing.latitude},${listing.longitude}"
           target="_blank"
           class="map-button directions">
            <i class="fas fa-directions"></i> Get Directions
        </a>
    </div>
</div>
` : ''}

<!-- Action Buttons -->
<div class="property-actions" style="margin-top: 40px; padding-top: 30px; border-top: 2px solid var(--border);">
    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <button class="action-btn-large contact-btn" id="contactBtnBottom" 
                style="padding: 16px 32px; background: var(--secondary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-phone"></i> Contact Agent
        </button>
        <button class="action-btn-large calculator-btn" id="calculatorBtn"
                style="padding: 16px 32px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-calculator"></i> Mortgage Calculator
        </button>
        <button class="action-btn-large save-btn" id="saveBtnBottom"
                style="padding: 16px 32px; background: var(--bg-light); color: var(--text-dark); border: 1px solid var(--border); border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;">
            <i class="far fa-heart"></i> Save Property
        </button>
    </div>
</div>
    `;
   
    // Setup thumbnail click events
    if (images.length > 1) {
        document.querySelectorAll('.thumbnail').forEach(thumb => {
            thumb.addEventListener('click', function() {
                const imageUrl = this.getAttribute('data-image');
                document.getElementById('mainPropertyImage').src = imageUrl;
                document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
    }
   
    // Setup button event listeners
    setupButtonEventListeners(listing, userInfo);
   
    // Load Google Maps if coordinates exist
    if (listing.latitude && listing.longitude) {
        setTimeout(async () => {
            try {
                await loadGoogleMapsAPI();
                initPropertyMap(listing.latitude, listing.longitude, listing.title);
            } catch (error) {
                console.error("Failed to load Google Maps:", error);
                showMapPlaceholder(listing.latitude, listing.longitude);
            }
        }, 100);
    }
   
    // Update save button state
    updateSaveButtonState();
}


function setupButtonEventListeners(listing, userInfo) {
    // Contact buttons
    document.querySelectorAll('#contactOwnerBtn, #contactBtnBottom').forEach(btn => {
        btn.addEventListener('click', function() {
            const userType = userInfo.role === 'landlord' ? 'Property Owner' : 'Broker';
            alert(`Contact Information:\n\n${userType}: ${userInfo.displayName}\nEmail: ${userInfo.email}\nPhone: ${userInfo.phone}\n\nYou can contact this ${userType.toLowerCase()} for more information about the property.`);
        });
    });
   
    // Save buttons
    document.querySelectorAll('#savePropertyBtn, #saveBtnBottom').forEach(btn => {
        btn.addEventListener('click', function() {
            toggleSaveProperty();
        });
    });
   
    // Mortgage calculator button
    const calculatorBtn = document.getElementById('calculatorBtn');
    if (calculatorBtn) {
        calculatorBtn.addEventListener('click', function() {
            showMortgageCalculator(listing);
        });
    }
}


async function updateSaveButtonState() {
    if (!propertyId) return;


    const currentUser = auth.currentUser;
   
    if (!currentUser) {
        updateSaveButtonText('Login to Save');
        return;
    }


    try {
        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef,
            where('userId', '==', currentUser.uid),
            where('propertyId', '==', propertyId)
        );
        const snapshot = await getDocs(q);


        const isSaved = !snapshot.empty;
       
        updateSaveButtonText(isSaved ? 'Saved' : 'Save Property', isSaved);
    } catch (error) {
        console.error('Error checking saved status:', error);
        updateSaveButtonText('Error');
    }
}


function updateSaveButtonText(text, isSaved = false) {
    document.querySelectorAll('#savePropertyBtn, #saveBtnBottom').forEach(btn => {
        if (isSaved) {
            btn.innerHTML = '<i class="fas fa-heart"></i> Saved';
            btn.classList.add('saved');
        } else {
            if (text === 'Login to Save') {
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Save';
            } else {
                btn.innerHTML = '<i class="far fa-heart"></i> ' + text;
            }
            btn.classList.remove('saved');
        }
    });
}


async function toggleSaveProperty() {
    if (!propertyId) return;


    const currentUser = auth.currentUser;
    if (!currentUser) {
        alert('Please login to save properties');
        return;
    }


    try {
        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef,
            where('userId', '==', currentUser.uid),
            where('propertyId', '==', propertyId)
        );
        const snapshot = await getDocs(q);


        if (!snapshot.empty) {
            // Remove from saved
            await deleteDoc(snapshot.docs[0].ref);
            showSaveToast('Removed from saved', false);
            updateSaveButtonText('Save Property', false);
        } else {
            // Add to saved
            await addDoc(collection(db, 'savedProperties'), {
                userId: currentUser.uid,
                propertyId: propertyId,
                savedAt: new Date(),
                createdAt: new Date()
            });
           
            // Log save event
            await logSaveEvent(currentUser.uid, propertyId);
           
            showSaveToast('Property saved!', false);
            updateSaveButtonText('Saved', true);
        }
    } catch (error) {
        console.error('Error toggling save:', error);
        showSaveToast('Error saving property', true);
    }
}


function showMortgageCalculator(listing) {
    const listingType = getListingType(listing);
    let propertyPrice = 0;
   
    if (listingType === 'sale') {
        propertyPrice = listing.pricing || listing.salePrice || 0;
    }
   
    // Open mortgage calculator in new window or show alert
    if (propertyPrice > 0) {
        alert(`Mortgage Calculator\n\nProperty Price: ₱${propertyPrice.toLocaleString()}\n\nThis feature would open a mortgage calculator to estimate your monthly payments.`);
    } else {
        alert('This property is for rent/lease. Mortgage calculator is only available for properties for sale.');
    }
}


function showSaveToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${isError ? '#ef4444' : '#10b981'};
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        z-index: 9999;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: slideIn 0.3s ease;
    `;
   
    document.body.appendChild(toast);
   
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}


async function logSaveEvent(userId, propertyId) {
    try {
        const eventsRef = collection(db, 'events');
        await addDoc(eventsRef, {
            userId: userId,
            eventType: 'save',
            metadata: { propertyId: propertyId },
            timestamp: new Date()
        });
        console.log(`Logged save event for user ${userId}, property ${propertyId}`);
        return true;
    } catch (error) {
        console.error("Failed to log save event:", error);
        return false;
    }
}


function displayError(message) {
    const container = document.getElementById('propertyDetailsContainer');
    container.innerHTML = `
        <div class="error-state">
            <div class="error-icon">⚠️</div>
            <h3>${message}</h3>
            <p>Please try again or go back to the dashboard.</p>
            <a href="buyer_dashboard.html" class="search-button" style="margin-top: 20px;">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>
    `;
}


// --- INITIALIZATION ---


// Check authentication and load property details
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "../login.html";
        return;
    }


    // Load property details
    loadPropertyDetails();
});


// Add CSS animations
const style = document.createElement('style');
style.textContent = `
    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
    }
`;
document.head.appendChild(style);
</script>
