<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Search Results - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="recommendations.css">

<style>
:root {
  --primary: #0b2e52;
  --primary-dark: #001F3F;
  --primary-light: #002f3f;
  --secondary: #1976d2;
  --accent: #ff9800;
  --text-dark: #1a202c;
  --text-light: #718096;
  --bg-light: #f8fafc;
  --bg-white: #ffffff;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --rent-color: #10b981;
  --sale-color: #3b82f6;
  --lease-color: #8e44ad;
  --card-radius: 12px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    color: var(--text-dark);
    display: flex;
    min-height: 100vh;
}

/* Sidebar Styles */
.sidebar {
    width: 280px;
    background: var(--bg-white);
    box-shadow: var(--shadow-lg);
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    z-index: 1000;
    transition: transform 0.3s ease;
    overflow-y: auto;
}

@media (max-width: 1024px) {
    .sidebar {
        transform: translateX(-100%);
    }
    .sidebar.active {
        transform: translateX(0);
    }
}

/* Mobile Menu Toggle */
.mobile-menu-toggle {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1001;
    background: var(--primary);
    color: white;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 12px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
}

.container {
    flex: 1;
    margin-left: 280px;
    padding: 30px;
    transition: margin-left 0.3s ease;
}

@media (max-width: 1024px) {
    .container {
        margin-left: 0;
    }
}

/* ==== TOP HERO SECTION ==== */
.hero-section {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
    color: white;
    padding: 40px;
    border-radius: var(--card-radius);
    margin-bottom: 30px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
}

.hero-section::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    transform: translate(30%, -30%);
}

.hero-section h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

.hero-section p {
    font-size: 18px;
    opacity: 0.9;
    margin-bottom: 30px;
    max-width: 600px;
    position: relative;
    z-index: 1;
}

/*==== SEARCH BAR SECTION ==== */
.search-section {
    background: var(--bg-white);
    padding: 30px;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    margin-bottom: 40px;
    border: 1px solid var(--border);
}

.search-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-title i {
    color: var(--primary);
}

.search-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.search-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.search-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dark);
    margin-left: 5px;
}

.search-input, .search-select {
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
    background: var(--bg-white);
    width: 100%;
}

.search-input:focus, .search-select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(11, 46, 82, 0.1);
}

.search-actions {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: flex-end;
}

.search-button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
}

.search-button:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
}

.reset-button {
    background: var(--bg-light);
    color: var(--text-dark);
    border: 1px solid var(--border);
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.reset-button:hover {
    background: var(--border);
}

/* ==== LISTINGS GRID ==== */
.listings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 25px;
}

.listing-card {
    background: var(--bg-white);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    cursor: pointer;
}

.listing-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.listing-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-bottom: 1px solid var(--border);
}

.listing-content {
    padding: 20px;
}

.listing-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 10px;
}

.listing-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 5px;
    line-height: 1.3;
    word-wrap: break-word;
}

.listing-price {
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
}

.price-rent {
    color: var(--rent-color);
}

.price-sale {
    color: var(--sale-color);
}

.price-lease {
    color: var(--lease-color);
}
.status-rent {
    background: var(--rent-color);
}
.status-sale {
    background: var(--sale-color);
}
.status-lease {
    background: var(--lease-color);
}

.listing-location {
    color: var(--text-light);
    font-size: 14px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 5px;
    line-height: 1.4;
}

.listing-details {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.detail {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    color: var(--text-light);
    white-space: nowrap;
}

.listing-broker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
    padding: 10px;
    background: var(--bg-light);
    border-radius: 8px;
}

.broker-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
}

.broker-info {
    flex: 1;
    min-width: 0;
}

.broker-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.broker-contact {
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.listing-type-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: white;
}

.type-rent {
    background: var(--rent-color);
}

.type-sale {
    background: var(--sale-color);
}

.type-lease {
    background: var(--lease-color);
}

.listing-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.action-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
}

.contact-btn {
    background: var(--secondary);
    color: white;
}

.contact-btn:hover {
    background: #1565c0;
    transform: translateY(-1px);
}

.view-btn {
    background: var(--bg-light);
    color: var(--text-dark);
    border: 1px solid var(--border);
}

.view-btn:hover {
    background: var(--border);
    transform: translateY(-1px);
}

/* ==== EMPTY STATES ==== */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    grid-column: 1 / -1;
}

.empty-state-icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.5;
}

.empty-state h3 {
    font-size: 20px;
    margin-bottom: 10px;
    color: var(--text-dark);
}

.loading-state {
    text-align: center;
    padding: 40px 20px;
    grid-column: 1 / -1;
}

.spinner {
    border: 4px solid var(--bg-light);
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.error-state {
    text-align: center;
    padding: 40px 20px;
    grid-column: 1 / -1;
    background: var(--bg-white);
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.error-icon {
    font-size: 48px;
    margin-bottom: 20px;
    color: #ef4444;
}

/* ==== SAVE BUTTON STYLES ==== */
.save-property-btn {
    transition: all 0.3s ease !important;
    box-shadow: var(--shadow) !important;
}

.save-property-btn:hover {
    transform: scale(1.1) !important;
    box-shadow: var(--shadow-lg) !important;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

.save-property-btn.saved {
    animation: pulse 0.5s ease;
}

/*===== MODAL STYLES ==== */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}

.modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
}

.modal-content {
    position: relative;
    background: var(--bg-white);
    border-radius: var(--card-radius);
    width: 90%;
    max-width: 1000px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-white);
    z-index: 1;
}

.modal-header h2 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-dark);
}

.modal-close {
    background: none;
    border: none;
    font-size: 28px;
    color: var(--text-light);
    cursor: pointer;
    padding: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s ease;
}

.modal-close:hover {
    background: var(--bg-light);
    color: var(--text-dark);
}

.modal-body {
    padding: 30px;
}

.modal-gallery {
    margin-bottom: 30px;
}

.modal-main-image {
    width: 100%;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 15px;
    background: var(--bg-light);
}

.modal-main-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.modal-thumbnails {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.thumbnail {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.thumbnail.active {
    border-color: var(--primary);
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.modal-details {
    display: grid;
    gap: 25px;
}

.modal-price-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.modal-price {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
}

.modal-type-badge {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: white;
}

.modal-location {
    font-size: 16px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 8px;
}

.modal-basic-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    background: var(--bg-light);
    padding: 20px;
    border-radius: 12px;
}

.info-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
}

.info-item span:first-child {
    font-size: 20px;
}

.modal-section {
    border-top: 1px solid var(--border);
    padding-top: 25px;
}

.modal-section h4 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
    color: var(--text-dark);
}

#modalDescription {
    line-height: 1.6;
    color: var(--text-dark);
    white-space: pre-line;
}

.modal-amenities {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
}

.amenity-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-light);
    border-radius: 8px;
    font-size: 14px;
}

.amenity-item i {
    color: var(--primary);
    width: 20px;
}

.modal-contact {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    background: var(--bg-light);
    padding: 20px;
    border-radius: 12px;
}

.contact-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 20px;
    flex-shrink: 0;
}

.contact-info {
    flex: 1;
}

.contact-info h5 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text-dark);
}

.contact-info p {
    margin-bottom: 8px;
    color: var(--text-light);
    font-size: 14px;
}

.contact-info strong {
    color: var(--text-dark);
    margin-right: 5px;
}

.modal-additional-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}

.info-label {
    font-weight: 600;
    color: var(--text-dark);
}

.modal-footer {
    display: flex;
    gap: 15px;
    padding: 20px 30px;
    border-top: 1px solid var(--border);
    position: sticky;
    bottom: 0;
    background: var(--bg-white);
    z-index: 1;
}

.modal-btn {
    flex: 1;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.contact-btn {
    background: var(--secondary);
    color: white;
}

.contact-btn:hover {
    background: #1565c0;
    transform: translateY(-2px);
}

.save-btn {
    background: var(--bg-light);
    color: var(--text-dark);
    border: 1px solid var(--border);
}

.save-btn:hover {
    background: var(--border);
    transform: translateY(-2px);
}

.save-btn.saved {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.close-btn {
    background: var(--text-light);
    color: white;
}

.close-btn:hover {
    background: var(--text-dark);
    transform: translateY(-2px);
}

/* ==== ANIMATIONS ==== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ==== RESPONSIVE DESIGN ==== */

/* Small Desktop / Large Tablet */
@media (max-width: 1200px) {
    .container {
        margin-left: 240px;
    }
    
    .listings-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
}

/* Tablet */
@media (max-width: 1024px) {
    .container {
        margin-left: 0;
        padding: 25px;
    }
    
    .mobile-menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .listings-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }
    
    /* Responsive Modal */
    .modal-content {
        width: 95%;
        max-height: 95vh;
    }
    
    .modal-header {
        padding: 15px 20px;
    }
    
    .modal-body {
        padding: 20px;
    }
    
    .modal-main-image {
        height: 300px;
    }
    
    .modal-price {
        font-size: 24px;
    }
    
    .modal-basic-info {
        grid-template-columns: 1fr 1fr;
    }
    
    .modal-amenities {
        grid-template-columns: 1fr;
    }
    
    .modal-additional-info {
        grid-template-columns: 1fr;
    }
    
    .modal-contact {
        flex-direction: column;
        text-align: center;
    }
    
    .contact-avatar {
        margin: 0 auto;
    }
    
    .modal-footer {
        flex-direction: column;
        gap: 10px;
    }
}

/* Large Mobile */
@media (max-width: 768px) {
    .container {
        padding: 20px;
    }
    
    .mobile-menu-toggle {
        top: 15px;
        left: 15px;
        width: 45px;
        height: 45px;
        font-size: 20px;
    }
    
    .hero-section {
        padding: 30px 25px;
    }
    
    .hero-section h1 {
        font-size: 28px;
    }
    
    .hero-section p {
        font-size: 16px;
    }
    
    .search-section {
        padding: 25px 20px;
    }
    
    .search-grid {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .search-actions {
        flex-direction: column;
        align-items: stretch;
    }
    
    .search-button, .reset-button {
        width: 100%;
    }
    
    .listings-grid {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .listing-content {
        padding: 15px;
    }
    
    .modal-main-image {
        height: 250px;
    }
    
    .modal-header h2 {
        font-size: 20px;
    }
}

/* Small Mobile */
@media (max-width: 480px) {
    .container {
        padding: 15px;
    }
    
    .mobile-menu-toggle {
        top: 10px;
        left: 10px;
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
    
    .hero-section {
        padding: 25px 20px;
    }
    
    .hero-section h1 {
        font-size: 24px;
    }
    
    .section-title {
        font-size: 20px;
    }
    
    .search-section {
        padding: 20px 15px;
    }
    
    .listing-content {
        padding: 12px;
    }
    
    .listing-title {
        font-size: 16px;
    }
    
    .listing-price {
        font-size: 16px;
    }
    
    .modal-main-image {
        height: 200px;

async function loadGoogleMapsAPI() {
  if (googleMapsLoaded && window.google && window.google.maps) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    // Check if already loaded
    if (window.google && window.google.maps) {
      googleMapsLoaded = true;
      resolve();
      return;
    }

    // Check if script is being loaded
    const existingScript = document.querySelector('script[src*="maps.googleapis.com"]');
    if (existingScript) {
      const checkInterval = setInterval(() => {
        if (window.google && window.google.maps) {
          clearInterval(checkInterval);
          googleMapsLoaded = true;
          resolve();
        }
      }, 100);
      setTimeout(() => {
        clearInterval(checkInterval);
        reject(new Error("Google Maps API loading timeout"));
      }, 10000);
      return;
    }

    // Load the API
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
    script.async = true;
    script.defer = true;
    script.onload = () => {
      if (window.google && window.google.maps) {
        googleMapsLoaded = true;
        resolve();
      } else {
        reject(new Error("Google Maps API failed to initialize"));
      }
    };
    script.onerror = () => reject(new Error("Failed to load Google Maps script"));
    document.head.appendChild(script);
  });
}

function initPropertyMap(lat, lng, title) {
  const mapElement = document.getElementById("propertyMap");
  if (!mapElement) {
    console.error("Map element not found");
    return;
  }

  try {
    // Check if Google Maps is loaded
    if (!window.google || !window.google.maps) {
      console.error("Google Maps API not loaded");
      showMapPlaceholder(lat, lng);
      return;
    }

    // Parse coordinates
    const latitude = parseFloat(lat);
    const longitude = parseFloat(lng);
    
    if (isNaN(latitude) || isNaN(longitude)) {
      console.error("Invalid coordinates:", lat, lng);
      showMapPlaceholder(lat, lng);
      return;
    }

    // Initialize map
    const map = new google.maps.Map(mapElement, {
      center: { lat: latitude, lng: longitude },
      zoom: 16,
      mapTypeControl: true,
      streetViewControl: true,
      fullscreenControl: true
    });

    // Add marker
    new google.maps.Marker({
      position: { lat: latitude, lng: longitude },
      map: map,
      title: title || "Property Location",
      animation: google.maps.Animation.DROP
    });
  } catch (error) {
    console.error("Error initializing map:", error);
    showMapPlaceholder(lat, lng);
  }
}

function getListingType(listing) {
    if (listing.listingType === 'lease' || listing.type === 'lease') {
        return 'lease';
    }
    
    if (listing.listingType === 'rent' || listing.type === 'rent') {
        return 'rent';
    }
    
    if (listing.listingType === 'sale' || listing.type === 'sale') {
        return 'sale';
    }
    
    if (listing.monthlyRent !== undefined && listing.monthlyRent !== null && listing.monthlyRent > 0) {
        return 'rent';
    }
    
    if (listing.annualRent !== undefined && listing.annualRent !== null && listing.annualRent > 0) {
        return 'lease';
    }
    
    if ((listing.pricing !== undefined && listing.pricing !== null && listing.pricing > 0) ||
        (listing.salePrice !== undefined && listing.salePrice !== null && listing.salePrice > 0)) {
        return 'sale';
    }
    
    return 'sale';
}

// ==================== CATEGORY DROPDOWN FUNCTIONS ====================

// Update category dropdown based on selected transaction type
function updateCategoryDropdown() {
    const transactionType = document.getElementById('filterListingType').value;

    const typeSelect = document.getElementById('filterPropertyType');

    // Reset both dropdowns
    categorySelect.innerHTML = '<option value="">All Categories</option>';

function loadFiltersFromURL() {
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('filters')) {

            searchFilters = JSON.parse(decodeURIComponent(urlParams.get('filters')));
            
            // Set form values from filters
            if (searchFilters.location) {
                document.getElementById('filterLocation').value = searchFilters.location;
            }
            if (searchFilters.transactionType) {
                document.getElementById('filterListingType').value = searchFilters.transactionType;
            }
            if (searchFilters.propertyCategory) {
                document.getElementById('filterPropertyCategory').value = searchFilters.propertyCategory;

            if (searchFilters.propertyType) {
                document.getElementById('filterPropertyType').value = searchFilters.propertyType;
            }
            if (searchFilters.searchTerm) {
                document.getElementById('filterName').value = searchFilters.searchTerm;
            }

            // Update dropdowns
            updateCategoryDropdown();

        } catch (error) {
            console.error('Error parsing filters from URL:', error);
        }
    }
}

// ==================== FILTER FUNCTIONS ====================

// Apply filters function for this page
window.applyFilters = async function() {
    // Collect filter values
    const filters = {
        location: document.getElementById('filterLocation').value || undefined,
        transactionType: document.getElementById('filterListingType').value || undefined,
        propertyCategory: document.getElementById('filterPropertyCategory').value || undefined,
        propertyType: document.getElementById('filterPropertyType').value || undefined,
        searchTerm: document.getElementById('filterName').value || undefined
    };

    // Clean filters (remove undefined values)
    const cleanFilters = Object.fromEntries(
        Object.entries(filters).filter(([key, value]) => value !== undefined)
    );

    // Update searchFilters and reload
    searchFilters = cleanFilters;
    
    // Load listings with filters
    await loadAllListings();

    // Update URL without reloading
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('filters', encodeURIComponent(JSON.stringify(cleanFilters)));
    window.history.pushState({}, '', newUrl);

    // Log search event for recommendations (only if user is logged in)
    try {
        const currentUser = auth.currentUser;
        if (currentUser && Object.keys(cleanFilters).length > 0) {
            const { logSearchEvent } = await import('./recommendations.js');
            await logSearchEvent(currentUser.uid, cleanFilters);
        }
    } catch (error) {
        console.log('Could not log search event.', error.message);
    }
};

    searchFilters = {};
    loadAllListings();

    window.history.pushState({}, '', 'search_results.html');
};

// ==================== LISTINGS FUNCTIONS ====================

async function loadAllListings() {
    try {
        console.log('[ ] Loading all listings...');

        // Fetch ALL properties
        const listingsQuery = query(collection(db, "properties"));
        const querySnapshot = await getDocs(listingsQuery);

        allListings = [];
        const userIds = new Set();

        querySnapshot.forEach((doc) => {
            const listing = {
                id: doc.id,
                ...doc.data()
            };
            allListings.push(listing);

            // Collect user IDs
            if (listing.userId) {
                userIds.add(listing.userId);
            } else if (listing.ownerId) {
                userIds.add(listing.ownerId);
            }
        });

        console.log(`  Found ${allListings.length} listings total`);

        await loadAllUserData(userIds);

        // Display filtered listings
        displayFilteredListings();

    } catch (error) {
        console.error("Error loading listings:", error);
        displayError(error);
    }
}

async function loadAllUserData(userIds) {
    userMap.clear();

    if (userIds.size === 0) {
        console.log('No user IDs found to load');
        return;
    }

    console.log(`Loading user data for ${userIds.size} users...`);

    for (const userId of userIds) {
        await loadUserData(userId);
    }
}

async function loadUserData(userId) {
    try {
        const userDoc = await getDoc(doc(db, "users", userId));

        if (userDoc.exists()) {
            const userData = userDoc.data();
            
            const fullName = userData.fullName || 
                             userData.email?.split('@')[0] || 
                             `User ${userId.substring(0, 8)}`;

            userMap.set(userId, {
                displayName: fullName,
                email: userData.email || 'Email not available',
                phone: userData.phone || 'Phone not available',
                role: userData.role || 'user'
            });
            return;
        }

        const brokerDoc = await getDoc(doc(db, "brokers", userId));

        if (brokerDoc.exists()) {
            const brokerData = brokerDoc.data();
            
            const fullName = brokerData.fullName || `Broker ${userId.substring(0, 8)}`;

            userMap.set(userId, {
                displayName: fullName,
                email: brokerData.email || 'Email not available',
                phone: brokerData.phone || 'Phone not available',
                role: 'broker'
            });
            return;
        }

        userMap.set(userId, {
            displayName: `User ${userId.substring(0, 8)}`,
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        });

    } catch (error) {
        console.error(`Error loading user ${userId}:`, error);
        
        userMap.set(userId, {
            displayName: `User ${userId.substring(0, 8)}`,
            email: 'Email not available',
            phone: 'Phone not available',
            role: 'user'
        });
    }
}

function displayFilteredListings() {
    // Filter active listings
    let filtered = allListings.filter(listing => {
        return listing.status === 'active' ||
               listing.status === 'available' ||
               listing.status === 'Active' ||
               (listing.status === undefined && listing.isActive !== false);
    });

    // Apply filters if any
    if (Object.keys(searchFilters).length > 0) {
        // Apply location filter
        if (searchFilters.location) {
            filtered = filtered.filter(listing => 
                (listing.location || "").includes(searchFilters.location) ||
                (listing.city || "").includes(searchFilters.location) ||
                (listing.province || "").includes(searchFilters.location)
            );
        }

        // Apply transaction type filter
        if (searchFilters.transactionType) {
            filtered = filtered.filter(listing => 
                getListingType(listing) === searchFilters.transactionType.toLowerCase()
            );
        }

        // Apply property category filter
        if (searchFilters.propertyCategory) {
            filtered = filtered.filter(listing => {
                const propertyType = (listing.propertyType || "").toLowerCase();
                const propertyCategory = (listing.propertyCategory || "").toLowerCase();
                const listingTitle = (listing.title || "").toLowerCase();
                const listingDescription = (listing.description || "").toLowerCase();
                const searchText = `${propertyType} ${propertyCategory} ${listingTitle} ${listingDescription}`;

                const categoryName = searchFilters.propertyCategory.toLowerCase();

                // Check category-specific keywords
                if (categoryName.includes('residential')) {
                    const residentialKeywords = ['house', 'apartment', 'condo', 'condominium', 'townhouse', 'dormitory', 'room', 'bedspace', 'residential', 'home', 'villa', 'bungalow', 'duplex'];
                    return residentialKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                if (categoryName.includes('commercial')) {
                    const commercialKeywords = ['commercial', 'office', 'retail', 'shop', 'kiosk', 'stall', 'store', 'mall', 'business', 'establishment', 'showroom'];
                    return commercialKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                if (categoryName.includes('industrial')) {
                    const industrialKeywords = ['industrial', 'warehouse', 'factory', 'storage', 'manufacturing', 'plant', 'facility', 'workshop'];
                    return industrialKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                if (categoryName.includes('land') || categoryName.includes('lot')) {
                    const landKeywords = ['land', 'lot', 'plot', 'agricultural', 'farm', 'agriculture', 'property', 'vacant', 'empty', 'beachfront'];
                    return landKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                if (categoryName.includes('special') || categoryName.includes('purpose')) {
                    const specialKeywords = ['resort', 'event', 'venue', 'school', 'sports', 'facility', 'special', 'purpose', 'institutional', 'hotel', 'motel', 'inn', 'parking', 'hospitality'];
                    return specialKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                if (categoryName.includes('condominium') || categoryName.includes('condo')) {
                    const condoKeywords = ['condominium', 'condo', 'penthouse', 'studio unit', 'loft unit'];
                    return condoKeywords.some(keyword => 
                        searchText.includes(keyword) ||
                        propertyType.includes(keyword) ||
                        propertyCategory.includes(keyword)
                    );
                }

                // Fallback: exact match
                return propertyCategory.includes(categoryName) || 
                       listingTitle.includes(categoryName) || 
                       propertyType.includes(categoryName);
            });
        }

        // Apply property type filter
        if (searchFilters.propertyType) {
            filtered = filtered.filter(listing => 
                listing.propertyType === searchFilters.propertyType
            );
        }

        // Apply name/keyword filter
        if (searchFilters.searchTerm) {
            const searchTerm = searchFilters.searchTerm.toLowerCase().trim();
            filtered = filtered.filter(listing => 
                (listing.title || "").toLowerCase().includes(searchTerm) ||
                (listing.description || "").toLowerCase().includes(searchTerm)
            );
        }
    }

    // Update search summary
    const searchSummary = document.getElementById('searchSummary');
    const resultsCount = document.getElementById('resultsCount');
    const resultsTitle = document.getElementById('resultsTitle');

    if (Object.keys(searchFilters).length > 0) {
        let summaryText = `Found ${filtered.length} properties`;
        let filterParts = [];
        if (searchFilters.location) filterParts.push(`Location: ${searchFilters.location}`);
        if (searchFilters.transactionType) filterParts.push(`Type: ${searchFilters.transactionType}`);
        if (searchFilters.propertyCategory) filterParts.push(`Category: ${searchFilters.propertyCategory}`);
        if (searchFilters.propertyType) filterParts.push(`Property: ${searchFilters.propertyType}`);
        if (searchFilters.searchTerm) filterParts.push(`Keyword: "${searchFilters.searchTerm}"`);

        if (filterParts.length > 0) {
            summaryText += ` matching ${filterParts.join(', ')}`;
        }

        searchSummary.textContent = summaryText;
        resultsCount.textContent = summaryText;
        resultsTitle.innerHTML = `<i class="fas fa-search"></i> Search Results (${filtered.length})`;
    } else {
        searchSummary.textContent = `Showing ${filtered.length} properties in Batangas`;
        resultsCount.textContent = `Showing ${filtered.length} properties in Batangas`;
        resultsTitle.innerHTML = `<i class="fas fa-building"></i> All Properties in Batangas (${filtered.length})`;
    }

    // Display filtered listings
    if (filtered.length === 0) {
        displayNoListings();
    } else {
        displayListings(filtered);
    }
}

async function checkSavedStatus(listings) {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) return new Map();

        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef, where('userId', '==', currentUser.uid));
        const snapshot = await getDocs(q);

        const savedMap = new Map();
        snapshot.forEach(doc => {
            savedMap.set(doc.data().propertyId, true);
        });
        return savedMap;
    } catch (error) {
        console.error("Error checking saved status:", error);
        return new Map();
    }
}

function setupListingEventListeners() {
    // Listing card click
    document.querySelectorAll('.listing-card').forEach(card => {
        card.addEventListener('click', function(e) {
            // Don't trigger if clicking on a button inside the card
            if (!e.target.closest('button')) {
                const listingId = this.getAttribute('data-listing-id');
                if (listingId) {
                    window.showListingDetails(listingId);
                }
            }
        });
    });

    // Save property buttons
    document.querySelectorAll('.save-property-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const propertyId = this.getAttribute('data-property-id');
            if (propertyId) {
                window.toggleSaveProperty(propertyId, this);
            }
        });
    });

    // Contact buttons
    document.querySelectorAll('.action-btn.contact-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const userId = this.getAttribute('data-user-id');
            if (userId) {
                window.contactBroker(userId);
            }
        });
    });

    // View details buttons
    document.querySelectorAll('.action-btn.view-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const listingId = this.getAttribute('data-listing-id');
            if (listingId) {
                window.showListingDetails(listingId);
            }
        });
    });
}

            <div id="propertyMap" style="width: 100%; height: 300px; border-radius: 12px; margin-bottom: 15px; background: var(--bg-light);"></div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <a href="https://www.google.com/maps?q=${listing.latitude},${listing.longitude}" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--primary); color: white; border-radius: 8px; text-decoration: none; font-weight: 500;">
                    <i class="fas fa-external-link-alt"></i> Open in Google Maps
                </a>
                <a href="https://maps.google.com/maps/dir/?api=1&destination=${listing.latitude},${listing.longitude}" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--secondary); color: white; border-radius: 8px; text-decoration: none; font-weight: 500;">
                    <i class="fas fa-directions"></i> Get Directions
                </a>
            </div>
        </div>
        ` : ''}
        `;

        // Set up thumbnail click events
        if (images.length > 1) {
            document.querySelectorAll('.thumbnail').forEach(thumb => {
                thumb.addEventListener('click', function() {
                    const imageUrl = this.getAttribute('data-image');
                    document.getElementById('modalCurrentImage').src = imageUrl;
                    document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        // Set up modal button events
        document.getElementById('modalContactBtn').onclick = contactFromModal;
        document.getElementById('modalCloseBtn2').onclick = closeModal;

        // Update save button state
        await updateModalSaveButton();

        // Show modal
        document.getElementById('propertyModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';

        // Initialize map if coordinates exist
        if (listing.latitude && listing.longitude) {
            setTimeout(async () => {
                try {
                    await loadGoogleMapsAPI();
                    initPropertyMap(listing.latitude, listing.longitude, listing.title);
                } catch (error) {
                    console.error("Failed to load Google Maps:", error);
                    showMapPlaceholder(listing.latitude, listing.longitude);
                }
            }, 100);
        }

    } catch (error) {
        console.error('Error showing property details:', error);
        alert('Error loading property details. Please try again.');
    }
};

async function updateModalSaveButton() {
    if (!currentModalListingId) return;

    const saveBtn = document.getElementById('modalSaveBtn');
    const currentUser = auth.currentUser;

    if (!currentUser) {
        saveBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Save';
        saveBtn.onclick = () => {
            alert('Please login to save properties');
            window.location.href = './login.html';
        };
        return;
    }

    try {
        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef,
            where('userId', '==', currentUser.uid),
            where('propertyId', '==', currentModalListingId)
        );
        const snapshot = await getDocs(q);

        const isSaved = !snapshot.empty;

        if (isSaved) {
            saveBtn.innerHTML = '<i class="fas fa-heart"></i> Saved';
            saveBtn.classList.add('saved');
            saveBtn.onclick = () => removeFromSaved();
        } else {
            saveBtn.innerHTML = '<i class="far fa-heart"></i> Save Property';
            saveBtn.classList.remove('saved');
            saveBtn.onclick = () => addToSaved();
        }
    } catch (error) {
        console.error('Error checking saved status:', error);
    }
}

async function addToSaved() {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) {
            alert('Please login to save properties');
            window.location.href = './login.html';
            return;
        }
        
        await addDoc(collection(db, 'savedProperties'), {
            userId: currentUser.uid,
            propertyId: currentModalListingId,
            savedAt: new Date(),
            createdAt: new Date()
        });

        // Update button
        const saveBtn = document.getElementById('modalSaveBtn');
        saveBtn.innerHTML = '<i class="fas fa-heart"></i> Saved';
        saveBtn.classList.add('saved');
        saveBtn.onclick = () => removeFromSaved();

        // Show toast
        showSaveToast('Property saved!', false);

        // Log save event for recommendations
        try {
            const { logSaveEvent } = await import('./recommendations.js');
            await logSaveEvent(currentUser.uid, currentModalListingId);
        } catch (error) {
            console.log("Could not log save event:", error.message);
        }

    } catch (error) {
        console.error('Error saving property:', error);
        showSaveToast('Error saving property', true);
    }
}

async function removeFromSaved() {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) return;

        const savedRef = collection(db, 'savedProperties');
        const q = query(savedRef,
            where('userId', '==', currentUser.uid),
            where('propertyId', '==', currentModalListingId)
        );
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
            await deleteDoc(snapshot.docs[0].ref);

            // Update button
            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.innerHTML = '<i class="far fa-heart"></i> Save Property';
            saveBtn.classList.remove('saved');
            saveBtn.onclick = () => addToSaved();

            // Show toast
            showSaveToast('Removed from saved', false);
        }
    } catch (error) {
        console.error('Error removing saved property:', error);
        showSaveToast('Error removing property', true);
    }
}

function contactFromModal() {
    if (currentModalListing && currentModalListing.userId) {
        window.contactBroker(currentModalListing.userId);
    } else {
        alert('Contact information not available.');
    }
}

function closeModal() {
    document.getElementById('propertyModal').style.display = 'none';
    document.body.style.overflow = 'auto';
    currentModalListingId = null;
    currentModalListing = null;
}

// ==================== EVENT HANDLERS ====================

window.toggleSaveProperty = async function(propertyId, buttonElement) {
    try {
        const currentUser = auth.currentUser;
        if (!currentUser) {
            alert('Please login to save properties');
            window.location.href = './login.html';
            return;
        }
        
        const isSaved = buttonElement.textContent.includes("❤");
        
        if (isSaved) {
            // Remove from saved
            const savedRef = collection(db, 'savedProperties');
            const q = query(savedRef,
                where('userId', '==', currentUser.uid),
                where('propertyId', '==', propertyId)
            );
            const snapshot = await getDocs(q);
            
            if (!snapshot.empty) {
                await deleteDoc(snapshot.docs[0].ref);
                buttonElement.innerHTML = '🤍';
                buttonElement.style.background = 'var(--bg-light)';
                buttonElement.style.color = 'var(--text-dark)';
                console.log(`Property ${propertyId} removed from saved`);
                showSaveToast('Removed from saved', false);
            }
        } else {
            // Add to saved
            await addDoc(collection(db, 'savedProperties'), {
                userId: currentUser.uid,
                propertyId: propertyId,
                savedAt: new Date(),
                createdAt: new Date()
            });
            buttonElement.innerHTML = '❤';
            buttonElement.style.background = 'var(--primary)';
            buttonElement.style.color = 'white';
            console.log(`Property ${propertyId} saved`);
            showSaveToast('Property saved!', false);
            
            // Log save event for recommendations
            try {
                const { logSaveEvent } = await import('./recommendations.js');
                await logSaveEvent(currentUser.uid, propertyId);
            } catch (error) {
                console.log("Could not log save event:", error.message);
            }
        }
        
        // Update modal save button if modal is open
        if (currentModalListingId === propertyId) {
            await updateModalSaveButton();
        }
        
    } catch (error) {
        console.error("Error toggling save:", error);
        showSaveToast("Error saving property", true);
    }
};

function showSaveToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${isError ? '#ef4444' : '#10b981'};
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        z-index: 9999;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: slideIn 0.3s ease;
    `;
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Close modal when clicking outside
document.addEventListener('click', function(e) {
    const modal = document.getElementById('propertyModal');
    const modalContent = document.querySelector('.modal-content');

    if (modal && modalContent && modal.style.display === 'flex') {
        if (!modalContent.contains(e.target) && !e.target.closest('.listing-card')) {
            closeModal();
        }
    }
});

// Close modal with Escape key
document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('propertyModal');
    if (e.key === 'Escape' && modal && modal.style.display === 'flex') {
        closeModal();
    }
});

// ==================== WINDOW FUNCTIONS ====================

window.contactBroker = async function(userId) {
    const userInfo = userMap.get(userId);
    if (userInfo) {
        const userType = userInfo.role === 'landlord' ? 'Property Owner' : 'Broker';
        alert(`Contact Information:\n\n${userType}: ${userInfo.displayName}\nEmail: ${userInfo.email}\nPhone: ${userInfo.phone}\n\nYou can contact this ${userType.toLowerCase()} for more information about the property.`);
    } else {
        alert('Contact information not available.');
    }
};

window.loadAllListings = loadAllListings;
