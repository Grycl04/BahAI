<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar</title>

  <style>
    :root {
      --primary: #0b2e52;
      --primary-dark: #001f3f;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 30px 0;
      box-shadow: var(--shadow-lg);
      position: fixed;
      height: 100vh;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .logo {
      padding: 0 25px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .logo p {
      font-size: 12px;
      opacity: 0.8;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .sidebar li {
      margin: 5px 15px;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .sidebar a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .sidebar a.active {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 600;
    }

    .sidebar a i {
      margin-right: 12px;
      font-size: 18px;
    }

    /* Logout */
    .sidebar-footer {
      padding: 20px 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(5px);
    }

    .logout-btn i {
      margin-right: 12px;
      font-size: 18px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        width: 240px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h1>BahAI</h1>
      <p>Real Estate Platform</p>
    </div>

    <ul>
      <li>
        <a href="landlord_dashboard.html" class="sidebar-link">
          <i>🏠︎</i> Dashboard
        </a>
      </li>
      <li>
        <a href="landlord_listings.html" class="sidebar-link">
          <i>📃</i> My Listings
        </a>
      </li>
      <li>
        <a href="add_property.html" class="sidebar-link">
          <i>✚</i> Add Property
        </a>
      </li>
      <li>
        <a href="inquiries.html" class="sidebar-link">
          <i>💬</i> Inquiries
        </a>
      </li>
      <li>
        <a href="settings.html" class="sidebar-link">
          <i>⚙️</i> Settings
        </a>
      </li>
    </ul>

    <!-- Logout Button -->
    <div class="sidebar-footer">
      <button id="logoutBtn" class="logout-btn">
        <i>🚪</i> Logout
      </button>
    </div>
  </div>

  <!-- Logout Script -->
  <script>
    // Get the logout button
    const logoutBtn = document.getElementById("logoutBtn");

    // Add click event listener
    if (logoutBtn) {
      logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();

        // Ask for confirmation
        if (confirm("Are you sure you want to log out?")) {
          // Redirect to PHP logout page
          window.location.href = "../logout.php";
        }
      });
    }
  </script>

</body>
</html>
