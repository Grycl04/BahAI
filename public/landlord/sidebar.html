        <li><a href="settings.html">Settings</a></li>
    </ul>
</div>

<style>
    /* SIDEBAR STYLES - UPDATED TO MATCH DASHBOARD */
    .sidebar {
        width: 280px;
        height: 100vh;
        background: linear-gradient(180deg, var(--primary-dark), var(--primary));
        color: white;
        padding: 30px 0;
        box-shadow: var(--shadow-lg);
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        transition: transform 0.3s ease;
    }

    .sidebar.sidebar-collapsed {
        transform: translateX(-280px);
    }

    .sidebar ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .sidebar li {
        margin: 5px 15px;
        border-radius: 12px;
        overflow: hidden;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 20px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 500;
        font-size: 15px;
        transition: all 0.3s ease;
        position: relative;
    }

    .sidebar a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        transform: translateX(5px);
    }

    .sidebar a.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        font-weight: 600;
    }

    .sidebar a.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--accent);
    }

    .sidebar a::before {
        font-size: 18px;
        width: 24px;
        text-align: center;
    }

    /* Icon Placeholders - add actual icons later */
    .sidebar a[href*="dashboard"]::before { content: "📊"; }
    .sidebar a[href*="properties"]::before { content: "🏠"; }
    .sidebar a[href*="add"]::before { content: "➕"; }
    .sidebar a[href*="tenants"]::before { content: "👥"; }
    .sidebar a[href*="inquiries"]::before { content: "💬"; }
    .sidebar a[href*="payments"]::before { content: "💰"; }
    .sidebar a[href*="settings"]::before { content: "⚙️"; }

    /* Sidebar Profile Section - Optional */
    .sidebar-profile {
        padding: 25px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .profile-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--secondary));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 600;
        color: white;
    }

    .profile-info h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 5px;
        color: white;
    }

    .profile-info p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
    }

    /* Logout Link */
    .sidebar-logout {
        position: absolute;
        bottom: 30px;
        left: 0;
        right: 0;
        padding: 0 15px;
    }

    .sidebar-logout a {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        margin: 0 15px;
    }

    .sidebar-logout a:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    /* Mobile responsive */
    @media (max-width: 1024px) {
        .sidebar {
            transform: translateX(-280px);
        }
        
        .sidebar.sidebar-open {
            transform: translateX(0);
        }
    }
</style>

<!-- JavaScript for mobile toggle -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const sidebar = document.querySelector('.sidebar');
        
        if (mobileMenuToggle && sidebar) {
            mobileMenuToggle.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar-open');
            });
        }
        
        // Highlight current page
        const currentPage = window.location.pathname.split('/').pop();
        const links = document.querySelectorAll('.sidebar a');
        
        links.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage) {
                link.classList.add('active');
            }
        });
    });
</script>
