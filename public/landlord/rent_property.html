<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Rental Property</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    header { background: #2c3e50; padding: 10px 20px; position: relative; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
    nav a { color: white; text-decoration: none; padding: 10px 15px; display: block; }
    nav a:hover { background: #34495e; border-radius: 4px; }
    .dropdown { position: relative; }
    .dropdown-content { display: none; position: absolute; background: white; min-width: 220px; box-shadow: 0px 4px 8px rgba(0,0,0,0.2); z-index: 10; }
    .dropdown:hover > .dropdown-content { display: block; }
    .dropdown-sub { position: relative; }
    .dropdown-sub-content { display: none; position: absolute; top: 0; left: 100%; min-width: 220px; background: white; box-shadow: 0px 4px 8px rgba(0,0,0,0.2); z-index: 11; }
    .dropdown-sub:hover > .dropdown-sub-content { display: block; }
    .dropdown-content a, .dropdown-sub-content a { color: black; padding: 8px 12px; text-decoration: none; display: block; }
    .dropdown-content a:hover, .dropdown-sub-content a:hover { background: #f1f1f1; }
    .hamburger { display: none; flex-direction: column; justify-content: space-between; width: 25px; height: 20px; background: none; border: none; cursor: pointer; margin-right: 10px; }
    .hamburger span { display: block; height: 3px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
    .hamburger.open span:nth-child(1){ transform: rotate(45deg) translate(5px,5px); }
    .hamburger.open span:nth-child(2){ opacity: 0; }
    .hamburger.open span:nth-child(3){ transform: rotate(-45deg) translate(5px,-5px); }
    @media(max-width:768px){
      nav{ position:absolute; top:60px; left:0; width:100%; background:#2c3e50; flex-direction:column; align-items:flex-start; padding:10px 0; display:none; }
      nav.active{ display:flex; }
      .nav-left, .nav-right{ flex-direction:column; width:100%; gap:0; }
      nav a{ width:100%; padding:12px 20px; }
      .hamburger{ display:flex; position:absolute; right:20px; top:15px; }
    }
    form { background:white; padding:20px; border-radius:8px; max-width:600px; margin:80px auto 20px; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
    label { font-weight:bold; display:block; margin-top:10px; }
    input, textarea, select { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px; }
    button { background:navy; color:white; padding:10px 15px; border:none; border-radius:4px; margin-top:15px; cursor:pointer; }
    button:disabled { background:#999; cursor:not-allowed; }
    .message { text-align:center; font-weight:bold; margin:15px; color:red; }
    .preview-container { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .preview-container img { width:100px; height:100px; object-fit:cover; border-radius:6px; border:1px solid #ccc; }
  </style>
</head>
<body>

<header>
  <button class="hamburger" onclick="toggleMenu(this)"><span></span><span></span><span></span></button>
  <nav>
    <div class="nav-left">
      <a href="landlord_dashboard.html">Home</a>
      <div class="dropdown">
        <a href="#">Properties <span class="arrow">▾</span></a>
        <div class="dropdown-content">
          <a href="#">Rent</a>
          <a href="#">Lease</a>
          <a href="#">For Sale</a>
        </div>
      </div>
      <a href="post_rental.html">Post Rental</a>
    </div>
    <div class="nav-right">
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>
</header>

<div class="message" id="messageBox"></div>

<form id="rentalForm">
  <label for="title">Property Title</label>
  <input type="text" id="title" title="Property Title" placeholder="Enter property title" required>

  <label for="propertyType">Property Type</label>
  <select id="propertyType" title="Select property type" required>
    <option value="">-- Select --</option>
    <option value="apartment">Apartment</option>
    <option value="house">House</option>
    <option value="studio">Studio</option>
    <option value="room">Room / Shared</option>
  </select>

  <label for="description">Description</label>
  <textarea id="description" title="Description" placeholder="Describe the property" rows="4"></textarea>

  <label for="monthlyRent">Monthly Rent (₱)</label>
  <input type="number" id="monthlyRent" title="Monthly Rent" placeholder="e.g., 15000" step="0.01" required>

  <label for="deposit">Deposit (₱)</label>
  <input type="number" id="deposit" title="Deposit" placeholder="Optional" step="0.01">

  <label for="minStay">Minimum Stay (months)</label>
  <input type="number" id="minStay" title="Minimum Stay" placeholder="e.g., 6" value="1" min="1">

  <label for="images">Upload Images</label>
  <input type="file" id="images" title="Upload property images" accept="image/*" multiple>
  <div class="preview-container" id="preview"></div>

  <button type="submit">Post Rental</button>
</form>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
    authDomain: "bahai-1b76d.firebaseapp.com",
    projectId: "bahai-1b76d",
    storageBucket: "bahai-1b76d.firebasestorage.app",
    messagingSenderId: "646878644941",
    appId: "1:646878644941:web:5b4ccc3412250337587784"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const form = document.getElementById("rentalForm");
  const preview = document.getElementById("preview");
  const messageBox = document.getElementById("messageBox");

  // Image preview
  document.getElementById("images").addEventListener("change", (e) => {
    preview.innerHTML = "";
    Array.from(e.target.files).forEach(file => {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = "Property preview image";
      preview.appendChild(img);
    });
  });

  // Authentication check
  let currentUser = null;
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      alert("⚠️ Please log in first.");
      window.location.href = "../login.html";
    } else {
      currentUser = user;
    }
  });

  // Submit property
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!currentUser) return alert("Not logged in.");

    const title = document.getElementById("title").value;
    const type = document.getElementById("propertyType").value;
    const description = document.getElementById("description").value;
    const monthlyRent = parseFloat(document.getElementById("monthlyRent").value);
    const deposit = parseFloat(document.getElementById("deposit").value) || 0;
    const minStay = parseInt(document.getElementById("minStay").value);
    const files = document.getElementById("images").files;

    try {
      const imageUrls = [];
      for (const file of files) {
        const storageRef = ref(storage, `properties/${currentUser.uid}/${file.name}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        imageUrls.push(url);
      }

      await addDoc(collection(db, "properties"), {
        landlordId: currentUser.uid,
        title,
        type,
        description,
        monthlyRent,
        deposit,
        minStay,
        imageUrls,
        createdAt: new Date()
      });

      messageBox.style.color = "green";
      messageBox.textContent = "✅ Property posted successfully!";
      setTimeout(() => window.location.href = "landlord_dashboard.html", 2000);
      
      form.reset();
      preview.innerHTML = "";
    } catch (err) {
      console.error(err);
      messageBox.style.color = "red";
      messageBox.textContent = "❌ Failed to post property.";
    }
  });

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "../login.html";
  });

  // Hamburger menu
  window.toggleMenu = (el) => {
    el.classList.toggle("open");
    document.querySelector("nav").classList.toggle("active");
  };
</script>
</body>
</html>
