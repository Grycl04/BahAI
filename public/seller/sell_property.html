<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Property - RealEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f7f9fc;
    margin: 0;
    padding: 0;
  }

  header {
    background: #2c3e50;
    padding: 10px 20px;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  nav a {
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    font-weight: bold;
  }

  nav a:hover {
    background: #34495e;
    border-radius: 4px;
  }

  .nav-left, .nav-right {
    display: flex;
    gap: 15px;
    align-items: center;
  }

  .dropdown { position: relative; }
  .dropdown-content {
    display: none;
    position: absolute;
    background: white;
    min-width: 220px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  .dropdown:hover .dropdown-content { display: block; }
  .dropdown-content a { color: black; padding: 8px 12px; display: block; }
  .dropdown-content a:hover { background: #f1f1f1; }

  .hamburger {
    display: none;
    flex-direction: column;
    width: 25px;
    height: 20px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .hamburger span {
    display: block;
    height: 3px;
    width: 100%;
    background: white;
    border-radius: 2px;
    transition: 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

  @media (max-width:768px){
    .nav-left,.nav-right{
      flex-direction: column;
      background:#2c3e50;
      position:absolute;
      top:60px;
      left:0;
      width:100%;
      max-height:0;
      overflow:hidden;
      transition:max-height 0.4s;
    }
    nav.active .nav-left, nav.active .nav-right { max-height:400px; }
    .hamburger { display:flex; }
  }

  form {
    background:white;
    padding:20px;
    border-radius:8px;
    max-width:600px;
    margin:20px auto;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
  }

  label {
    font-weight:bold;
    display:block;
    margin-top:10px;
  }

  input, textarea, select {
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:4px;
  }

  .amenities-list {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:10px 0;
  }

  .amenities-list label {
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1 1 calc(50% - 10px);
    padding:8px 12px;
    border:1px solid #000;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
  }

  .amenities-list input[type="checkbox"] { display:none; }
  .amenities-list input[type="checkbox"]:checked + span { background:#007bff; color:white; border-color:#007bff; }
  .amenities-list span { display:flex; align-items:center; gap:5px; justify-content:center; }

  button {
    background: navy;
    color:white;
    padding:10px 15px;
    border:none;
    border-radius:4px;
    margin-top:15px;
    cursor:pointer;
  }

  button:hover { background:#003366; }

  .message {
    text-align:center;
    font-weight:bold;
    margin:15px;
  }

  #images-preview img {
    width:120px;
    height:120px;
    object-fit:cover;
    border:1px solid #ccc;
    border-radius:5px;
  }

  #video-preview iframe {
    width:100%;
    height:315px;
    margin-top:10px;
  }
</style>
</head>
<body>

<header>
  <button class="hamburger" onclick="toggleMenu(this)"><span></span><span></span><span></span></button>
  <nav>
    <div class="nav-left">
      <a href="seller_dashboard.html"><i class="bi bi-house-door"></i> Home</a>
      <a href="sell_property.html"><i class="bi bi-cash-stack"></i> Sell Property</a>
    </div>
    <div class="nav-right">
      <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
      <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
  </nav>
</header>

<div class="message" id="message"></div>

<form id="sellForm">
  <label for="title">Title</label>
  <input type="text" id="title" required placeholder="Enter property title">

  <label for="description">Description</label>
  <textarea id="description" rows="4" required placeholder="Enter property description"></textarea>

  <label for="property_type">Property Type</label>
  <select id="property_type" required>
    <option value="">-- Select --</option>
    <option value="apartment">Apartment</option>
    <option value="commercial">Commercial</option>
    <option value="land">Land</option>
    <option value="house">House</option>
  </select>

  <label for="price">Price (₱)</label>
  <input type="text" id="price" placeholder="Enter price" required>

  <div id="bedrooms-field" style="display:none;">
    <label for="bedrooms">Bedrooms</label>
    <input type="number" id="bedrooms" min="0">
  </div>

  <div id="bathrooms-field" style="display:none;">
    <label for="bathrooms">Bathrooms</label>
    <input type="number" id="bathrooms" min="0">
  </div>

  <div id="floors-field" style="display:none;">
    <label for="floors">Floors</label>
    <input type="number" id="floors" min="0">
  </div>

  <label>Amenities</label>
  <div class="amenities-list" id="amenities-list">
    <!-- JS will generate amenities checkboxes -->
  </div>

  <label for="images">Property Images</label>
  <input type="file" id="images" accept="image/*" multiple>
  <div id="images-preview"></div>

  <label for="video_url">Video URL</label>
  <input type="url" id="video_url" placeholder="https://youtube.com/watch?v=...">
  <div id="video-preview"></div>

  <button type="submit">Submit Property</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.appspot.com",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784",
  measurementId: "G-PDW1PRZTM9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const amenitiesData = {
  apartment:["Swimming Pool","Elevator","Gym","24/7 Security","Balcony"],
  commercial:["Parking","Elevator","Loading Dock","CCTV"],
  land:["Road Access","Electricity","Water Supply"],
  house:["Garage","Garden","Balcony","Furnished"]
};

// Authentication
onAuthStateChanged(auth, user=>{
  if(!user) location.href="login.html";
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', ()=>signOut(auth).then(()=>location.href="../login.html"));

// Show amenities & extra fields
document.getElementById('property_type').addEventListener('change', e=>{
  const type = e.target.value;
  const amenitiesList = document.getElementById('amenities-list');
  amenitiesList.innerHTML = "";
  ["bedrooms-field","bathrooms-field","floors-field"].forEach(id=>document.getElementById(id).style.display="none");

  if(type){
    if(type==="apartment"||type==="house"){
      ["bedrooms-field","bathrooms-field","floors-field"].forEach(id=>document.getElementById(id).style.display="block");
    } else if(type==="commercial"){ document.getElementById("floors-field").style.display="block"; }
    amenitiesData[type].forEach(a=>{
      const id = "amenity_"+a.replace(/\s+/g,"");
      amenitiesList.innerHTML += `<label><input type="checkbox" value="${a}" id="${id}"><span>${a}</span></label>`;
    });
  }
});

// Image preview & Base64
const imagesInput = document.getElementById('images');
let imagesBase64 = [];
imagesInput.addEventListener('change', e=>{
  imagesBase64 = [];
  const preview = document.getElementById('images-preview');
  preview.innerHTML = "";
  Array.from(e.target.files).forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      imagesBase64.push({data:ev.target.result,mime:file.type});
      const img = document.createElement('img');
      img.src = ev.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

// Form submit
document.getElementById('sellForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const user = auth.currentUser;
  if(!user) return alert("Login required!");

  const title = document.getElementById('title').value;
  const description = document.getElementById('description').value;
  const property_type = document.getElementById('property_type').value;
  const price = document.getElementById('price').value.replace(/,/g,'');
  const bedrooms = document.getElementById('bedrooms').value || null;
  const bathrooms = document.getElementById('bathrooms').value || null;
  const floors = document.getElementById('floors').value || null;
  const amenities = Array.from(document.querySelectorAll('#amenities-list input:checked')).map(i=>i.value);
  const video_url = document.getElementById('video_url').value;

  try {
    const docRef = await addDoc(collection(db,"properties"),{
      user_id: user.uid,
      title,
      description,
      property_type,
      price,
      bedrooms,
      bathrooms,
      floors,
      amenities,
      video_url,
      images: imagesBase64
    });
    document.getElementById('message').textContent = "✅ Property submitted successfully!";
    document.getElementById('sellForm').reset();
    document.getElementById('images-preview').innerHTML = "";
    imagesBase64 = [];
  } catch(err){
    document.getElementById('message').textContent = "❌ Error: "+err.message;
  }
});

// Hamburger
function toggleMenu(el){ el.classList.toggle("open"); document.querySelector("nav").classList.toggle("active"); }
</script>
</body>
</html>
