<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealEase - Seller Dashboard</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
header { background: #2c3e50; padding: 10px 20px; position: relative; }
nav { display: flex; justify-content: space-between; align-items: center; }
.nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
nav a { color: white; text-decoration: none; padding: 10px 15px; display: block; }
nav a:hover { background: #34495e; border-radius: 4px; }
.dropdown { position: relative; }
.dropdown > a { cursor: pointer; }
.dropdown-content { display: none; position: absolute; background-color: white; min-width: 220px; box-shadow: 0px 4px 8px rgba(0,0,0,0.2); z-index: 10; }
.dropdown:hover > .dropdown-content { display: block; }
.dropdown-content a { color: black; padding: 8px 12px; text-decoration: none; display: block; }
.dropdown-content a:hover { background-color: #f1f1f1; }
.hamburger { display: none; flex-direction: column; justify-content: space-between; width: 25px; height: 20px; background: none; border: none; cursor: pointer; margin-right: 10px; }
.hamburger span { display: block; height: 3px; width: 100%; background: white; border-radius: 2px; transition: 0.3s; }
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
@media (max-width: 768px) {
  nav { position: absolute; top: 60px; left: 0; width: 100%; background: #2c3e50; flex-direction: column; align-items: flex-start; padding: 10px 0; display: none; }
  nav.active { display: flex; }
  .nav-left, .nav-right { flex-direction: column; width: 100%; gap: 0; }
  nav a { width: 100%; padding: 12px 20px; }
  .hamburger { display: flex; position: absolute; right: 20px; top: 15px; }
}
.welcome { text-align: center; padding: 50px; background: #ecf0f1; }
.properties { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
.property-card { background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; transition: transform 0.2s ease-in-out; }
.property-card:hover { transform: scale(1.03); }
.property-card img { width: 100%; height: 200px; object-fit: cover; }
.property-info { padding: 15px; }
.listing-badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}
.badge-rent {
  background: #3498db;
  color: white;
}
.badge-sale {
  background: #e74c3c;
  color: white;
}
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow-y: auto; background-color: rgba(0,0,0,0.5); padding: 30px 0; }
.modal-content { background: white; margin: auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 800px; position: relative; }
.close { position: absolute; right: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; user-select: none; }
.modal img { width: 100%; margin-bottom: 10px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <button class="hamburger" onclick="toggleMenu(this)"><span></span><span></span><span></span></button>
  <nav>
    <div class="nav-left">
      <a href="seller_dashboard.html">Home</a>
      <a href="sell_property.html">Sell Property</a>
    </div>
    <div class="nav-right">
      <a href="#" id="profileName">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>
</header>

<div class="welcome">
  <h1>Welcome, <span id="userName"></span></h1>
  <p>Your smart real estate rental platform in Batangas for students and professionals.</p>
</div>

<div class="properties" id="propertiesContainer"></div>

<div id="modalTemplate" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="modal-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.appspot.com",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784",
  measurementId: "G-PDW1PRZTM9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const propertiesContainer = document.getElementById("propertiesContainer");
const userNameSpan = document.getElementById("userName");
const logoutBtn = document.getElementById("logoutBtn");

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "../login.html";
});

onAuthStateChanged(auth, async (user) => {
  if(!user) return window.location.href = "login.html";
  
  const docSnap = await getDoc(doc(db, "users", user.uid));
  if(docSnap.exists()) {
    userNameSpan.textContent = docSnap.data().fullname || user.email;
  }
  
  // Query unified "properties" collection for this user
  const q = query(collection(db, "properties"), where("user_id", "==", user.uid));
  
  onSnapshot(q, (snapshot) => {
    propertiesContainer.innerHTML = "";
    
    if (snapshot.empty) {
      propertiesContainer.innerHTML = "<p style='text-align:center; padding:20px;'>No properties found.</p>";
      return;
    }
    
    snapshot.forEach(d => {
      const prop = d.data();
      const card = document.createElement("div");
      card.className = "property-card";
      
      // Handle both image formats
      let imgSrc = "placeholder.jpg";
      if (prop.images && prop.images.length > 0) {
        imgSrc = prop.images[0].data || prop.images[0];
      } else if (prop.imageUrls && prop.imageUrls.length > 0) {
        imgSrc = prop.imageUrls[0];
      }
      
      // Determine listing type
      const isRental = prop.monthlyRent || prop.listingType === 'rental';
      const listingType = isRental ? 'rent' : 'sale';
      
      // Get price
      const price = prop.monthlyRent || prop.price || 0;
      
      // Get property type
      const propertyType = prop.type || prop.property_type || 'N/A';
      
      // Get bedrooms and bathrooms
      const bedrooms = prop.bedrooms || 0;
      const bathrooms = prop.bathrooms || 0;
      
      card.innerHTML = `
        <img src="${imgSrc}" alt="Property">
        <div class="property-info">
          <h3>${prop.title}</h3>
          <p>₱${parseFloat(price).toLocaleString()}</p>
          <p>${propertyType} • ${bedrooms} BR • ${bathrooms} BA</p>
          <span class="listing-badge badge-${listingType}">${isRental ? 'For Rent' : 'For Sale'}</span>
        </div>
      `;
      card.addEventListener("click", () => openModalFirebase(prop));
      propertiesContainer.appendChild(card);
    });
  });
});

function openModalFirebase(prop){
  const modal = document.getElementById("modalTemplate");
  
  // Determine listing type
  const isRental = prop.monthlyRent || prop.listingType === 'rental';
  const price = prop.monthlyRent || prop.price || 0;
  const propertyType = prop.type || prop.property_type || 'N/A';
  
  let mediaHTML = "";
  if (prop.images?.length) {
    prop.images.forEach(imgObj => {
      const imgSrc = imgObj.data || imgObj;
      mediaHTML += `<img src="${imgSrc}" alt="Property Image">`;
    });
  }
  
  if(prop.video_url){
    const vidID = getYoutubeID(prop.video_url);
    if(vidID) {
      mediaHTML += `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${vidID}" frameborder="0" allowfullscreen style="margin-top:10px;"></iframe>`;
    }
  }
  
  // Build modal content
  let detailsHTML = `
    <h2>${prop.title}</h2>
    <p><strong>Type:</strong> ${propertyType}</p>
    <p><strong>Price:</strong> ₱${parseFloat(price).toLocaleString()}</p>
    <p><strong>Listing Type:</strong> ${isRental ? 'For Rent' : 'For Sale'}</p>
  `;
  
  if (prop.bedrooms) detailsHTML += `<p><strong>Bedrooms:</strong> ${prop.bedrooms}</p>`;
  if (prop.bathrooms) detailsHTML += `<p><strong>Bathrooms:</strong> ${prop.bathrooms}</p>`;
  if (prop.floors) detailsHTML += `<p><strong>Floors:</strong> ${prop.floors}</p>`;
  if (prop.deposit) detailsHTML += `<p><strong>Deposit:</strong> ₱${parseFloat(prop.deposit).toLocaleString()}</p>`;
  if (prop.minStay) detailsHTML += `<p><strong>Minimum Stay:</strong> ${prop.minStay} months</p>`;
  if (prop.description) detailsHTML += `<p><strong>Description:</strong> ${prop.description}</p>`;
  if (prop.amenities && prop.amenities.length > 0) {
    detailsHTML += `<p><strong>Amenities:</strong> ${prop.amenities.join(', ')}</p>`;
  }
  
  modal.querySelector(".modal-body").innerHTML = detailsHTML + mediaHTML;
  modal.style.display = "block";
  
  modal.querySelector(".close").onclick = () => { modal.style.display = "none"; };
  window.onclick = (e) => { if(e.target === modal) modal.style.display = "none"; };
}

function getYoutubeID(url){ 
  const m = url.match(/^.*(youtu.be\/|v\/|watch\?v=|embed\/)([^#&?]*).*/); 
  return (m && m[2].length===11)? m[2]:""; 
}

function toggleMenu(el){ 
  el.classList.toggle("open");
  document.querySelector("nav").classList.toggle("active"); 
}

window.toggleMenu = toggleMenu;
</script>
</body>
</html>
