[build]
  publish = "public"
  command = "echo 'Static site, no build needed'"

[build.environment]
  NODE_VERSION = "18"  # Use Node.js instead of Python
  REACT_APP_API_URL = "https://bahai.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"