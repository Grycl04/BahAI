[build]
  publish = "public"
  command = "echo 'Static site'"

[build.environment]
  REACT_APP_API_URL = "https://bahai.onrender.com"
  # Force disable mise/Python
  MISE_ENABLED = "false"
  PYTHON_VERSION = "none"
  
# Disable all language detection
[build.processing]
  skip_processing = true

# Add redirects
[[redirects]]
  from = "/"
  to = "/login"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200